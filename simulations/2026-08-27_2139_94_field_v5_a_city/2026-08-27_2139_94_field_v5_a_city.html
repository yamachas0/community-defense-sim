で空き家や相続の話が出ていましたが、私の所有する中央駅前地区の土地も、活用方法について相談できればと考えています。何か良いアイデアや、相談できる窓口などがあれば教えていただけますでしょうか。", "frame": "our_town", "about_acquisition": false}, {"step": 1, "from": "HH14", "role": "household", "name": "R14", "text": "R03さん、湾岸地区のP20のことですが、草刈りが大変とのこと、お察しいたします。私も駅前の古い建物の維持管理に苦労しておりまして。もしよろしければ、その土地の活用について、何か情報交換できればと思うのですが。", "frame": "our_town", "about_acquisition": true}, {"step": 1, "from": "HH16", "role": "household", "name": "R16", "text": "R06さん、お気持ちお察しいたします。私の北部にある古い空き家P33も、築年数が経っており、リフォームするか、更地にして売却するかで悩んでおります。R08さん、R09さん、R06さんのように、長年この地域にお住まいの皆様のご意見を伺えませんか？どちらの方が、この街のためになるのか、あるいは将来的な負担が少ないのか、ぜひお聞かせ願いたいです。", "frame": "our_town", "about_acquisition": false}, {"step": 1, "from": "MD01", "role": "media", "name": "J01", "text": "G01さん、先ほどの窓口の件ですが、具体的にどのような相談が多いのでしょうか？例えば、空き家や相続に関するものが増えているといった傾向はありますか？\nB01さん、不動産仲介の立場から、最近そういった相談を受けることはありますか？", "frame": "neutral", "about_acquisition": false}, {"step": 1, "from": "MD02", "role": "media", "name": "J02", "text": "G01さん、先ほどのJ01さんの質問に関連して、もしよろしければ、最近窓口でどのような種類の相談が多いか、具体的な事例や傾向など、もう少し詳しく教えていただけますでしょうか。特に、空き家や相続に関するご相談が増えているとのことですが、そのあたりについて何か伺えれば幸いです。", "frame": "neutral", "about_acquisition": false}, {"step": 1, "from": "MU01", "role": "municipality", "name": "G01", "text": "J01さん、J02さん、先ほどのG02さんの話にもありましたが、最近、窓口で特に増えている相談内容や、何か気になる動きなどはありますでしょうか？例えば、空き家や相続に関するものなど、具体的な情報があれば共有いただけると助かります。", "frame": "neutral", "about_acquisition": false}, {"step": 2, "from": "BR01", "role": "broker", "name": "B01", "text": "R10さん、お疲れ様です。最近、空き家や相続のご相談が増えているそうですね。私も不動産仲介の立場として、何か協力できることがあればと思っております。来月は市役所の窓口にも伺ってみようと考えています。", "frame": "neutral", "about_acquisition": false}, {"step": 2, "from": "BR02", "role": "broker", "name": "B02", "text": "皆さん、おはようございます。駅前はいつも活気がありますね。最近、何か面白い話題はありますか？", "frame": "neutral", "about_acquisition": false}, {"step": 2, "from": "BZ01", "role": "business", "name": "T01", "text": "皆さん、おはようございます。先月の会議でも話題になりましたが、空き家や建物の相続問題、ますます深刻になっているようですね。うちも他人事ではないので、今日のS4は市役所の窓口に行く予定です。何か新しい情報があれば、また皆さんにもお伝えします。", "frame": "our_town", "about_acquisition": false}, {"step": 2, "from": "BZ02", "role": "business", "name": "T02", "text": "こんにちは。市役所の窓口で相談したいことがあるのですが、不動産のことについて、どこに聞けば良いかご存知ですか？", "frame": "neutral", "about_acquisition": false}, {"step": 2, "from": "BZ03", "role": "business", "name": "T03", "text": "R04さん、ご体調はいかがですか？配達の件、いつでもお声がけくださいね。", "frame": "neutral", "about_acquisition": false}, {"step": 2, "from": "HH03", "role": "household", "name": "R03", "text": "相続した空き地の管理、本当に大変ですよね。私もどうしたものかと考えています。売却も視野に入れているんですよ。", "frame": "our_town", "about_acquisition": true}, {"step": 2, "from": "HH04", "role": "household", "name": "R04", "text": "T03さん、先月は共同浴場の件で声をかけていただき、ありがとうございました。この共同浴場は地域の皆さんの大切な場所ですから、これからも維持していきたいと思っています。T03さんのようなお力添えがあると、とても心強いです。今後、どのように協力いただけそうか、少しお話を聞かせてもらえませんか？", "frame": "our_town", "about_acquisition": false}, {"step": 2, "from": "HH08", "role": "household", "name": "R08", "text": "おはようございます。", "frame": "neutral", "about_acquisition": false}, {"step": 2, "from": "HH09", "role": "household", "name": "R09", "text": "R16さん、こんにちは。北部で空き家をどうにかしたいというお話、先月伺いました。ちょうど私も同じようなことで考えているんです。もしよろしければ、市役所の窓口でご相談できたらと思っています。", "frame": "our_town", "about_acquisition": false}, {"step": 2, "from": "HH10", "role": "household", "name": "R10", "text": "皆様、こんにちは。最近この辺りに越してきたばかりなのですが、何かこの街の面白い変化や、気になる動きなど、皆様の目に留まったことはございますか？", "frame": "neutral", "about_acquisition": false}, {"step": 2, "from": "HH12", "role": "household", "name": "R12", "text": "おはようございます。お二人とも、今日は良い天気ですね。", "frame": "neutral", "about_acquisition": false}, {"step": 2, "from": "HH13", "role": "household", "name": "R13", "text": "おはようございます。この辺りは初めてなので、色々教えていただけると助かります。", "frame": "neutral", "about_acquisition": false}, {"step": 2, "from": "HH15", "role": "household", "name": "R15", "text": "おはようございます。B01さん、不動産関係で何か新しい動きはありますか？", "frame": "neutral", "about_acquisition": false}, {"step": 2, "from": "HH16", "role": "household", "name": "R16", "text": "おはようございます。皆さん、今日も賑わっていますね。", "frame": "neutral", "about_acquisition": false}, {"step": 2, "from": "MD01", "role": "media", "name": "J01", "text": "B01さん、おはようございます。駅前はいつも賑わっていますね。不動産屋さんのほうは、最近いかがですか？", "frame": "neutral", "about_acquisition": false}, {"step": 2, "from": "MU01", "role": "municipality", "name": "G01", "text": "T02さん、こんにちは。空き家や相続絡みの物件の動きで、何か気になることはありますか？", "frame": "neutral", "about_acquisition": false}, {"step": 2, "from": "MU02", "role": "municipality", "name": "G02", "text": "おはようございます。今日もいい天気ですね。", "frame": "neutral", "about_acquisition": false}, {"step": 2, "from": "BR01", "role": "broker", "name": "B01", "text": "R10さん、先ほどの私の話に加えて、T01さんもおっしゃっていましたが、空き家や相続問題は本当に増えていますね。私も不動産仲介として、この問題にどう取り組むべきか考えています。来月、市役所の窓口（V06）へ伺う予定ですので、その際に改めてご相談させていただければと思います。皆様も何か情報がありましたら、ぜひお聞かせください。", "frame": "neutral", "about_acquisition": false}, {"step": 2, "from": "BR02", "role": "broker", "name": "B02", "text": "皆さん、こんにちは。R10さんの質問に便乗すると、最近は特に、昔ながらの建物の活用や、空き地をどうするかといったご相談が増えているように感じますね。街の将来を考えると、活気ある活用方法を皆で考えていきたいところです。", "frame": "our_town", "about_acquisition": false}, {"step": 2, "from": "BZ01", "role": "business", "name": "T01", "text": "R10さん、この街は昔から温泉と観光で賑わってきましたが、最近は空き家や建物の問題が目立つようになってきましたね。市役所の窓口で、そのあたり何か情報が得られないか見てこようと思っています。B01さん、J01さんも、何か気になる動きがあれば教えてください。", "frame": "our_town", "about_acquisition": false}, {"step": 2, "from": "BZ02", "role": "business", "name": "T02", "text": "空き家P33の件で、草刈りとか、どうしたら良いものかと思っていまして。市役所の窓口で相談できるものなのか、ご存知でしたら教えていただけますか？", "frame": "neutral", "about_acquisition": false}, {"step": 2, "from": "BZ03", "role": "business", "name": "T03", "text": "共同浴場は、この町の宝のようなものですから、私もできる限り協力したいと思っています。配達の件も、お困りのことがあればいつでもお声がけください。地域全体で支え合っていくことが、この町を元気にすることに繋がるはずです。R01さん、最近、不動産や空き家の件で何か動きはありますか？", "frame": "our_town", "about_acquisition": true}, {"step": 2, "from": "HH01", "role": "household", "name": "R01", "text": "共同浴場の件、承知しました。皆さんの大切な場所ですから、これからも協力していきましょう。さて、私はこの後、市役所へ行く予定です。何か市役所に聞きたいことや、伝えておきたいことがあれば、私に託してくださいませんか？", "frame": "our_town", "about_acquisition": false}, {"step": 2, "from": "HH03", "role": "household", "name": "R03", "text": "R14さん、R02さん、R07さん、おはようございます。私も相続した空き地の管理が負担で、売却も考えているんです。S4で市役所の窓口に行く予定なのですが、何か相談できることはありますか？", "frame": "our_town", "about_acquisition": true}, {"step": 2, "from": "HH04", "role": "household", "name": "R04", "text": "共同浴場の維持、本当にありがたいお申し出です。T03さんのような地域の方の支えがあれば、この場所を守っていけると思います。具体的にどのような形でお力添えいただけそうか、ぜひお聞かせください。", "frame": "our_town", "about_acquisition": false}, {"step": 2, "from": "HH06", "role": "household", "name": "R06", "text": "おはようございます。相続した空き地の管理、本当に大変ですよね。私もどうしたものかと考えています。売却も視野に入れているんですよ。", "frame": "our_town", "about_acquisition": true}, {"step": 2, "from": "HH07", "role": "household", "name": "R07", "text": "B01さん、不動産関係で何か新しい動きはありますか？相続や空き家に関するご相談が増えていると聞きましたが。", "frame": "neutral", "about_acquisition": true}, {"step": 2, "from": "HH08", "role": "household", "name": "R08", "text": "おはようございます。市役所の窓口相談、R16さんのところへ行ってみようかと思っているのですが、ご存知ですか？", "frame": "neutral", "about_acquisition": false}, {"step": 2, "from": "HH10", "role": "household", "name": "R10", "text": "BR01さん、市役所の窓口にご相談されるのですね。私も最近こちらに越してきたばかりで、空き家や相続の問題には関心があります。もしよろしければ、何か有益な情報がありましたら、お聞かせいただけますと幸いです。来月、私も市役所の窓口に行こうと考えているんです。", "frame": "neutral", "about_acquisition": true}, {"step": 2, "from": "HH11", "role": "household", "name": "R11", "text": "T01さん、私もS4で市役所の窓口に行く予定です。相続や空き家問題は、この街の大きな課題だと感じています。何か有益な情報があれば、ぜひ共有させてください。", "frame": "our_town", "about_acquisition": true}, {"step": 2, "from": "HH13", "role": "household", "name": "R13", "text": "B01さん、R03さんの相続した土地の管理について、何かお話を聞かれたことはありますか？ 私も不動産のことには疎いのですが、もし何か参考になることがあればと思って。", "frame": "neutral", "about_acquisition": true}, {"step": 2, "from": "HH14", "role": "household", "name": "R14", "text": "R03さん、先ほどの相続された空き地のことですが、もしよろしければ、S4で市役所にお越しになるようでしたら、少しお話をお伺いできますでしょうか。私も同じような状況で、どのように進めていくべきか悩んでおりまして。", "frame": "our_town", "about_acquisition": true}, {"step": 2, "from": "HH15", "role": "household", "name": "R15", "text": "B01さん、おはようございます。不動産関係で何か新しい動きはありますか？ T01さんもおっしゃっていましたが、空き家や相続の問題、ますます深刻になっているようですね。私も自分の土地の将 でいらっしゃる情報はございますか？ R01さんの件につきましては、窓口にて引き続き対応させていただきます。", "frame": "our_town", "about_acquisition": true}, {"step": 12, "from": "BR01", "role": "broker", "name": "B01", "text": "B02さん、最近お見かけしませんが、どこにいらっしゃいますか？", "frame": "neutral", "about_acquisition": false}, {"step": 12, "from": "BR02", "role": "broker", "name": "B02", "text": "B companyのP11地区への関与と共同浴場登記について、何かご存知のことはありますか？特に、T03さんの店舗がB company名義であるという情報もありますので、その点も含めてお伺いしたいです。", "frame": "our_town", "about_acquisition": true}, {"step": 12, "from": "BZ01", "role": "business", "name": "T01", "text": "B社のP11地区への動きについて、何か新しい情報はありますか？共同浴場の登記の件と関係があるのか、気になっているのですが。", "frame": "our_town", "about_acquisition": true}, {"step": 12, "from": "BZ03", "role": "business", "name": "T03", "text": "G01さん、少しお話できますか？B社が共同浴場とP11地区の土地を取得した件で、何かご存知ないかと思いまして。", "frame": "their_town", "about_acquisition": true}, {"step": 12, "from": "HH01", "role": "household", "name": "R01", "text": "うちの店もB社名義になってますよ。経緯はともかく、共同浴場との関連で何か情報があれば、また教えてください。", "frame": "our_town", "about_acquisition": true}, {"step": 12, "from": "HH02", "role": "household", "name": "R02", "text": "T04さん、B01さんの話を聞いて気になったのですが、B社がP11地区で土地を取得している件、共同浴場の登記とも関係があるのでしょうか？", "frame": "their_town", "about_acquisition": true}, {"step": 12, "from": "HH03", "role": "household", "name": "R03", "text": "おはようございます。皆さん、お元気でしたか？", "frame": "neutral", "about_acquisition": false}, {"step": 12, "from": "HH04", "role": "household", "name": "R04", "text": "共同浴場の建物の修繕、そろそろ考えないといけない時期かねぇ。", "frame": "our_town", "about_acquisition": false}, {"step": 12, "from": "HH06", "role": "household", "name": "R06", "text": "こんにちは。B社のP11地区の件、何か新しい情報はありませんか？", "frame": "their_town", "about_acquisition": true}, {"step": 12, "from": "HH07", "role": "household", "name": "R07", "text": "J01さん、B社のP11地区の件と共同浴場の登記について、何かご存知ですか？", "frame": "their_town", "about_acquisition": true}, {"step": 12, "from": "HH08", "role": "household", "name": "R08", "text": "おはようございます。今日は少し肌寒いですね。駅前はいつも賑わっていて活気がありますね。", "frame": "neutral", "about_acquisition": false}, {"step": 12, "from": "HH11", "role": "household", "name": "R11", "text": "B社のP11地区への関心と、この共同浴場の登記とは、何か関係があるのでしょうか？", "frame": "their_town", "about_acquisition": true}, {"step": 12, "from": "HH13", "role": "household", "name": "R13", "text": "J02さん、先月B社と共同浴場の登記について記事に出ていましたが、その後の進展はありますか？不動産仲介のB01さん、B02さんからも何か情報は得られていますか？", "frame": "their_town", "about_acquisition": true}, {"step": 12, "from": "HH16", "role": "household", "name": "R16", "text": "R04さん、B社のP11地区への動きと共同浴場の登記の関連について、G02さんが窓口対応を約束してくれたらしいですよ。不動産仲介の情報も踏まえて、一緒に調べてみませんか？ R11さん、B社の件でR04さんと少し話しますね。", "frame": "their_town", "about_acquisition": true}, {"step": 12, "from": "MD02", "role": "media", "name": "J02", "text": "共同浴場の登記の件、B社との関連について、もう少し詳しく伺ってもよろしいでしょうか？)", "frame": "their_town", "about_acquisition": true}, {"step": 12, "from": "MU01", "role": "municipality", "name": "G01", "text": "B社のP11地区への関心についてですね。共同浴場の登記の件と関連があるかは、まだ確定的な情報ではありません。あくまで耳にした話ですが、B社がP11地区に関心を持っているというのは事実です。P04の所有権については、私の方では個人的な取引履歴は把握しておりません。共同浴場の登記についても、現時点では特に進展はありません。", "frame": "their_town", "about_acquisition": true}, {"step": 12, "from": "MU02", "role": "municipality", "name": "G02", "text": "B社のP11地区への関心について、共同浴場の登記との関連が依然として不明瞭なままです。不動産仲介業者の方々にも、この件について直接お話を伺えればと考えています。", "frame": "their_town", "about_acquisition": true}, {"step": 12, "from": "BR01", "role": "broker", "name": "B01", "text": "B02さん、お忙しいところ恐縮ですが、近いうちにお会いできませんでしょうか。共同浴場登記とP11地区の件で、お話をお伺いしたいのですが。", "frame": "their_town", "about_acquisition": true}, {"step": 12, "from": "BR02", "role": "broker", "name": "B02", "text": "R01さん、ご自身の店舗もB社名義とのこと、承知いたしました。B社がP11地区でどのような活動をしているのか、そしてそれが共同浴場の登記とどう関連しているのか、引き続き情報収集に努めます。T01さん、B社からのP11地区への動きについて、何か追加の情報はありますでしょうか？", "frame": "their_town", "about_acquisition": true}, {"step": 12, "from": "BZ01", "role": "business", "name": "T01", "text": "R06さん、R07さん、B社のP11地区の件と共同浴場の登記について、何かご存知ですか？T03さんの店舗がB社名義という話も聞きましたが、その辺りの情報があれば教えてください。", "frame": "their_town", "about_acquisition": true}, {"step": 12, "from": function lineChart(svg,series,opts){

 const ys=v=>H-B-(H-T-B)*(v/ymax);
 let g=`<rect x="0" y="0" width="${W}" height="${H}" fill="#fff"/>`;
 for(let t=0;t<=4;t++){const v=ymax*t/4,y=ys(v);
  g+=`<line x1="${L}" y1="${y}" x2="${W-R}" y2="${y}" stroke="#E5E7EB"/>`
    +`<text x="${L-8}" y="${y+4}" text-anchor="end" font-size="11" fill="#6B7280">${opts.fmt(v)}</text>`;}
 for(let s=0;s<=nSteps;s+=Math.max(1,Math.round(nSteps/12)))
  g+=`<text x="${xs(s)}" y="${H-12}" text-anchor="middle" font-size="11" fill="#6B7280">${s}</text>`;
 (opts.marks||[]).forEach(mk=>{const x=xs(mk.step);
  g+=`<line x1="${x}" y1="${T}" x2="${x}" y2="${H-B}" stroke="${mk.color}" stroke-dasharray="4 3"/>`
    +`<text x="${x+4}" y="${T+12}" font-size="11" font-weight="700" fill="${mk.color}">${esc(mk.label)}</text>`;});
 series.forEach((s,si)=>{
  let d="",started=false;
  s.data.forEach((v,i)=>{ if(v==null)return; const x=xs(i+1),y=ys(v);
   d+=(started?"L":"M")+x+" "+y+" "; started=true;});
  g+=`<path d="${d}" fill="none" stroke="${s.color}" stroke-width="2.5"/>`
    +`<text x="${W-R+8}" y="${T+16+si*18}" font-size="12" font-weight="700" fill="${s.color}">${esc(s.label)}</text>`;});
 g+=`<line x1="${L}" y1="${H-B}" x2="${W-R}" y2="${H-B}" stroke="#111827"/>`
   +`<text x="${W-R}" y="${H-2}" text-anchor="end" font-size="11" fill="#6B7280">経過月</text>`;
 svg.innerHTML=g;
}

 {label:"営業中の店舗数",color:"#2563EB",data:D.kpi.map(r=>r.shops_occupied)},

],{fmt:v=>v.toFixed(0),marks});

/* ---------- クロニクル用: イベントの分類と要約 ---------- */
const CATS=[["deal","成約"],["nego","申し入れ"],["list","売出"],
 ["media","報道"],["gov","自治体"],["exit","退出・廃業"],["talk","発言"],
 ["fail","不成立"],["idle","静観"]];
function cat(e){
 if(!e.ok) return "fail";
 const o=e.outcome;
 if(o==="transfer") return "deal";
 if(o==="offer"||o==="counter"||o==="withdraw") return "nego";
 if(o==="listing"||o==="unlist") return "list";
 if(o==="rent_change"||o==="rent_negotiation"||o==="redevelop") return "rent";
 if(o==="publication") return "media";
 if(o==="ordinance"||o==="ordinance_study"||o==="request_report") return "gov";
 if(o==="move_out"||o==="business_closed"||o==="relocate") return "exit";
 if(e.action==="investigate"||e.action==="public_statement") return "gov";
 if(e.utterance) return "talk";
 return "idle";
}
const P=pid=>`<span class="pill" data-pid="${pid}">${pid}</span>`;
function summary(e){
 const t=e.target;
 switch(e.action){
  case "make_offer": return `${P(t)} に取得を申し入れ（名義「${esc(e.under_name||"—")}」）`;
  case "accept_offer": {
   const tr=(D.ledger||[]).find(r=>r.kind==="transfer"&&r.step===e.step&&r.offer_id===t);
   return tr?`${P(tr.parcel_id)} の名義を「${esc(tr.under_name)}」へ移した`
            :`申し入れ ${esc(t)} に応じた`;}

  case "reject_offer": return `申し入れ ${esc(t)} に応じなかった`;
  case "withdraw_offer": return `申し入れ ${esc(t)} を取り下げ`;

  case "unlist": return `${P(t)} の売り出しを取り下げ`;

  case "relocate": return `${P(t)} へ店を移す`;
  case "close_shop": return `<b>店を畳んだ</b>`;
  case "move_out": return `<b>この街から転出した</b>`;
  case "circulate_listing": return `${esc(nameOf[t]||t)} に売り情報を流す`;
  case "approach_owner": return `${esc(nameOf[t]||t)} に売却を打診`;
  case "publish": return `<b>記事を出した</b>`;
  case "investigate": return `登記簿を調べた`;
  case "silent": return `今月は書かなかった`;
  case "enact_ordinance": return `<b>条例を施行「${esc(t)}」</b>`;
  case "study_ordinance": return `規制の検討を進める`;
  case "request_report": return `${esc(nameOf[t]||t)} に説明を求めた`;
  case "public_statement": return `声明を出した`;
  case "monitor": case "hold": case "wait": case "continue": return `静観`;
  default: return esc(e.action);
 }
}
function beatHtml(e){
 const c=cat(e), label=(CATS.find(x=>x[0]===c)||["","?"])[1];
 let h=`<div class="beat" data-cat="${c}" data-id="${e.id}" data-step="${e.step}">`
  +`<span class="tag t-${c}">${label}</span><div class="bd">`
  +`<div class="hl"><span class="who">${esc(e.name)}</span>`
  +`<span class="small">（${esc(ROLEJA[e.role]||e.role)}）</span> ${summary(e)}</div>`;
 if(!e.ok) h+=`<div class="sub">→ 帳簿上は<b>不成立</b>（${esc(e.outcome)}${e.why?" / "+esc(e.why):""}）。コードは補正していない。</div>`;
 if(e.reasoning) h+=`<div class="sub">理由：${esc(e.reasoning)}</div>`;
 if(e.utterance) h+=`<div class="say ${e.ch==="public"?"pub":e.ch==="private"?"pri":""}">`
  +`${e.ch==="private"?"（"+esc(nameOf[e.to]||e.to)+"へ）":""}「${esc(e.utterance)}」</div>`;
 return h+`</div></div>`;
}

/* ---------- クロニクル ---------- */
let active=new Set(CATS.filter(c=>c[0]!=="idle").map(c=>c[0]));
$("#catbar").innerHTML='<span class="small">種別：</span>'
 +CATS.map(c=>`<button class="catb ${active.has(c[0])?"on":""}" data-c="${c[0]}">${c[1]}</button>`).join("")
 +'<button id="allcat">全部</button>';
function fillSel(sel,opts,ph){ sel.innerHTML=`<option value="">${ph}</option>`
 +opts.map(o=>`<option value="${o[0]}">${o[1]}</option>`).join(""); }
fillSel($("#asel"),D.agents.map(a=>[a.id,`${a.name}（${ROLEJA[a.role]||a.role}）`]),"すべて");
fillSel($("#psel2"),D.parcels.map(p=>[p.pid,`${p.pid}（${p.block}）`]),"すべて");
fillSel($("#msel"),Array.from({length:nSteps},(_,i)=>[i+1,`第${i+1}月`]),"全期間");
fillSel($("#psel"),D.parcels.map(p=>[p.pid,`${p.pid}（${p.block}・${p.use}）`]),"（区画を選ぶ）");
fillSel($("#tsel"),D.agents.map(a=>[a.id,`${a.name}（${ROLEJA[a.role]||a.role}）`]),"（選ぶ）");
function chronicle(){
 const aid=$("#asel").value, pid=$("#psel2").value, mo=$("#msel").value;
 const q=$("#q").value.trim();
 let rows=D.events.filter(e=>active.has(cat(e)));
 if(aid) rows=rows.filter(e=>e.id===aid);
 if(mo) rows=rows.filter(e=>e.step===+mo);
 if(pid){
  const offs=new Set((D.ledger||[]).filter(r=>r.parcel_id===pid&&r.offer_id).map(r=>r.offer_id));
  rows=rows.filter(e=>e.target===pid||offs.has(e.target)
   ||(e.utterance||"").includes(pid)||(e.reasoning||"").includes(pid));
 }
 if(q) rows=rows.filter(e=>(e.utterance+e.reasoning+e.name).includes(q));
 $("#cnt").textContent=`${rows.length} 件`;
 let h="",cur=-1;
 rows.forEach(e=>{ if(e.step!==cur){cur=e.step; h+=`<div class="mo">第${cur}月</div>`;} h+=beatHtml(e); });
 $("#chron").innerHTML=h||'<p class="small">条件に合う出来事がない。</p>';
}
$("#catbar").addEventListener("click",ev=>{
 const b=ev.target.closest("button"); if(!b)return;
 if(b.id==="allcat"){ active=new Set(CATS.map(c=>c[0]));
  document.querySelectorAll(".catb").forEach(x=>x.classList.add("on")); chronicle(); return; }
 const c=b.dataset.c; if(active.has(c)){active.delete(c);b.classList.remove("on");}
 else{active.add(c);b.classList.add("on");} chronicle();
});
["#asel","#psel2","#msel"].forEach(s=>$(s).addEventListener("change",chronicle));
$("#q").addEventListener("input",chronicle);
$("#reset").addEventListener("click",()=>{
 $("#asel").value="";$("#psel2").value="";$("#msel").value="";$("#q").value="";
 active=new Set(CATS.filter(c=>c[0]!=="idle").map(c=>c[0]));
 document.querySelectorAll(".catb").forEach(x=>x.classList.toggle("on",active.has(x.dataset.c)));
 chronicle();
});
document.addEventListener("click",ev=>{
 const p=ev.target.closest(".pill"); if(!p)return;
 selPid=p.dataset.pid; $("#psel").value=selPid; renderParcel(); draw(+slider.value);
 $("#psel").scrollIntoView({behavior:"smooth",block:"center"});
});

/* ---------- 区画の履歴 ---------- */
function renderParcel(){
 const pid=$("#psel").value;
 selPid=pid||null; draw(+slider.value);
 if(!pid){ $("#phist").innerHTML='<p class="small">マップの区画をクリックするか、上で区画を選ぶ。</p>';
  $("#pinfo").textContent=""; return; }
 const p=PARCEL[pid];
 const last=D.frames[D.frames.length-1];
 $("#pinfo").innerHTML=`${p.block}／用途 ${esc(last.use[pid])}`
  +`／最終の名義 <b>${esc(last.registered[pid])}</b>`;
 const offs=new Set((D.ledger||[]).filter(r=>r.parcel_id===pid&&r.offer_id).map(r=>r.offer_id));
 const recs=(D.ledger||[]).filter(r=>r.parcel_id===pid
   ||(r.offer_id&&offs.has(r.offer_id)));
 const rowFor=(r)=>{
  const who=nameOf[r.by||r.from_id||r.seller||r.agent_id]||r.by||r.from_id||"";
  switch(r.kind){
   case "offer": return [`申入`,`${esc(r.under_name)} 名義での取得の申し入れ（${r.offer_id}）`];
   case "consult": return [`相談`,`${esc(nameOf[r.by]||r.by)} が ${esc(nameOf[r.to]||r.to)} に相談（${r.consult_id}）`];
   case "advice": return [`回答`,`${esc(nameOf[r.by]||r.by)} が ${esc(nameOf[r.to]||r.to)} の相談に答えた（${r.consult_id}）`];
   case "keep": return [`応じない`,`${esc(nameOf[r.by]||r.by)} が申し入れに応じなかった（${r.offer_id}）`];
   case "hold": return [`保留`,`${esc(nameOf[r.by]||r.by)} は今月決めなかった（${r.offer_id}）`];
   case "transfer": return [`移転`,`${esc(nameOf[r.seller]||r.seller)} → 名義「${esc(r.under_name)}」`];
   case "unlist": return [`取下`,`${esc(who)} が売り出しを取り下げ`];

   case "tenancy_end": return [`退去`,`${esc(nameOf[r.tenant]||r.tenant)} が退去（${esc(r.reason)}）`];
   case "relocate": return [`入居`,`${esc(nameOf[r.agent_id]||r.agent_id)} が入居`];
   default: return null;
  }
 };
 let h='<table><thead><tr><th>月</th><th>種別</th><th>内容</th><th>そのときの言い分</th></tr></thead><tbody>';
 let n=0;
 recs.forEach(r=>{
  const rw=rowFor(r); if(!rw)return; n++;
  const actor=r.by||r.from_id||r.seller||r.agent_id||r.tenant;
  const e=D.events.find(x=>x.step===r.step&&x.id===actor);
  h+=`<tr><td>第${r.step}月</td><td><b>${rw[0]}</b></td><td>${rw[1]}</td>`
   +`<td class="small">${e&&e.reasoning?esc(e.reasoning):""}`
   +`${e&&e.utterance?"<br>「"+esc(e.utterance)+"」":""}</td></tr>`;
 });
 h+="</tbody></table>";
 $("#phist").innerHTML=n?h:'<p class="small">この区画には、期間中なにも起きなかった。</p>';
}
$("#psel").addEventListener("change",renderParcel);

/* ---------- エージェント別スレッド ---------- */
function renderThread(){
 const id=$("#tsel").value;
 if(!id){ $("#thread").innerHTML='<p class="small">エージェントを選ぶと、その1体の36か月が一本で読める。</p>';
  $("#tinfo").textContent=""; return; }
 let rows=D.events.filter(e=>e.id===id);
 if($("#thideidle").checked) rows=rows.filter(e=>cat(e)!=="idle");
 const acts={}; rows.forEach(e=>{acts[e.action]=(acts[e.action]||0)+1;});
 $("#tinfo").innerHTML=`${rows.length}か月ぶん ／ `
  +Object.entries(acts).sort((a,b)=>b[1]-a[1]).map(([a,c])=>`${esc(a)}×${c}`).join("、");
 let h="";
 rows.forEach(e=>{
  h+=`<div class="mo">第${e.step}月</div>`+beatHtml(e);
  if(e.memory) h+=`<div class="beat" style="border-bottom:none;padding-top:0;">`
   +`<span class="tag t-idle">記憶</span><div class="bd"><div class="mem">${esc(e.memory)}</div></div></div>`;
 });
 $("#thread").innerHTML=h||'<p class="small">該当なし。</p>';
}
$("#tsel").addEventListener("change",renderThread);
$("#thideidle").addEventListener("change",renderThread);

/* ---------- step 連動 ---------- */
const slider=$("#slider"); slider.max=nSteps; slider.value=nSteps;
function stepInfo(step){
 const r=D.kpi[step-1];
 if(!r) return "第0月（初期状態）";
 return `第${step}月 — 取得主体シェア <b>${pct(r.acquirer_share)}</b> ／ HHI ${r.hhi.toFixed(3)}`
  +` ／ 累計成約 ${r.transfers_cum} ／ 営業中の店 ${r.shops_occupied}/${r.shops_total}`
  +` ／ 転出率 ${pct(r.resident_outflow)}`;
}
function update(){
 const s=+slider.value;
 $("#stepnum").textContent=s===0?"第0月":"第"+s+"月";
 draw(s); $("#stepinfo").innerHTML=stepInfo(s);
}
slider.addEventListener("input",update);
let timer=null;
$("#play").addEventListener("click",()=>{
 if(timer){clearInterval(timer);timer=null;$("#play").textContent="▶ 再生";return;}
 if(+slider.value>=nSteps) slider.value=0;
 $("#play").textContent="⏸ 停止";
 timer=setInterval(()=>{ if(+slider.value>=nSteps){clearInterval(timer);timer=null;
  $("#play").textContent="▶ 再生";return;} slider.value=+slider.value+1; update(); },420);
});

/* ---------- 出来事 ---------- */
let ev="";
ev+="<h3>報道</h3>";
ev+=D.publications.length?D.publications.map(p=>
 `<div class="beat"><span class="tag t-media">第${p.step}月</span><div class="bd">
  <div class="hl">${esc(p.headline)}</div></div></div>`).join("")
 :"<p class='small'>期間中、この街のことは記事にならなかった。</p>";
ev+="<h3>規制</h3>";
ev+=D.ordinances.length?D.ordinances.map(o=>
 `<div class="beat"><span class="tag t-gov">第${o.step}月</span><div class="bd">
  <div class="hl">${esc(o.title)}</div><div class="sub">${esc(o.body)}</div></div></div>`).join("")
 :"<p class='small'>期間中、土地取引の規制は発動しなかった。</p>";
$("#events").innerHTML=ev;

update(); chronicle(); renderParcel(); renderThread();
</script></body></html>
