- id: N
  district: 中央駅前地区
  name: 線路沿いの持ち主さん
  kind: 個人
  role_label: 住民
  resident: true
  persona: '46歳。介護職。駅前の実家で父と暮らす。古い家の傷みと父の世話を同時に抱えている。

