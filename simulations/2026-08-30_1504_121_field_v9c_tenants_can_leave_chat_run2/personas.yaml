    '
- id: O
  district: 湾岸観光地区
  name: 岬道の持ち主さん
  kind: 個人
  role_label: 住民
  resident: true
  persona: '59歳。県外企業の支店勤務で、転勤の可能性がある。湾岸に住宅を持つ。

