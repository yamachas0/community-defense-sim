  persona: '35歳。大学の研究支援職。配偶者と2人暮らし。北部に移って6年。

    公開されている政策資料に仕事で接する。日常は勤務と家事が中心。

    '
- id: F
  district: 中央駅前地区
  name: 駅裏の持ち主さん
  kind: 個人
  role_label: 住民
  resident: true
  persona: '48歳。ホテルの予約部門で交代勤務。母と同居して介護をしている。

    相続した小区画の建物の維持に手が回らない。市内在住15年。

    '
- id: G
  district: 中央駅前地区
  name: 一番街の持ち主さん
  kind: 個人
  role_label: 住民
  resident: true
  persona: '61歳。自営の建築設備業。修繕の腕があり、商工会と町内会の付き合いが多い。

    家と資材置場を持つ。この町で二代目。

    '
- id: H
  district: 湾岸観光地区
  name: 潮見横丁の持ち主さん
  kind: 個人
  role_label: 住民
  resident: true
  persona: '31歳。県外から移住したリモートワーカー。在住3年。古い住宅を自分で改装して住んでいる。

