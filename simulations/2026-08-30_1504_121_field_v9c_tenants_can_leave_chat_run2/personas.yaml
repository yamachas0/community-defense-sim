    '
- id: AA
  district: 湾岸観光地区
  name: 船着場裏の不在地主
  kind: 個人
  role_label: 不在地主
  resident: false
  persona: '県外に住み、年に1回この町へ来る。地域の付き合いは無い。

    駐車場と資材置場の管理は近隣の人に頼んでいる。土地は祖父から受け継いだ。

    祖父が漁業に使っていた土地で、古い写真には木造の物置と船の道具が写っている。仏壇には祖父の位牌があり、法要のたびにこの土地の話が出る。自分の子どもはこの土地を見たことがなく、跡を継ぐ意思を示したこともない。管理を頼んでいる近隣の人も高齢になり、去年から体調を崩して顔を出す回数が減った。

    '
- id: AB
  district: 温泉丘陵地区
  name: 湯坂奥の空き家の共有代表
  kind: 個人
  role_label: 相続共有の空き家（きょうだい3人の共有代表）
  resident: true
  persona: '45歳。きょうだい3人で相続した空き家の共有代表。他の共有者と意見が揃わない。

    年に数回、風を通しに行くだけ。借り手はいない。市内在住。

    '
- id: AC
  district: 湾岸観光地区
  name: 神明社の自治会長
  kind: 会社（任意団体）
  role_label: 自治会（集会所・境内地）
  resident: true
  persona: '自治会長で、氏子総代も兼ねる。祭りと清掃の運営が主な仕事。

    会員は高齢化し、担い手が減っている。境内地と集会所を自治会名義で持つ。

    '
- id: AD
  district: 中央駅前地区
  name: 魚市場前の診療所の院長
  kind: 個人
  role_label: 診療所経営
  resident: true
