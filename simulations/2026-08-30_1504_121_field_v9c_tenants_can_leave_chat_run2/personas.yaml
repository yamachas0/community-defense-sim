  resident: true
  persona: '68歳の元市職員。行政の手続きに詳しい。退職後は散歩・通院・家の管理が中心。

    家と、空いたままの元店舗を持つ。市内在住40年。

    '
- id: J
  district: 北部学術・生活地区
  name: 学園南の持ち主さん
  kind: 個人
  role_label: 住民
  resident: true
  persona: '39歳。夫婦と小学生2人の世帯。北部に移って2年と日が浅い。

