# A市フィールド v8b「売りに出す町」— 会話ありの世界
# 設計の正: docs/world_design_v8b.md（土台 = docs/world_design_v8_minimal.md）
#
# v8 との差は4つだけ（設計 §1）:
#   1. X社の命題を積極化（できるだけ多くの名義を得よ／反発を招いて止まるほど目立つな／毎月動け）
#   2. 住民の毎月の問いは「今月、自分の不動産を売りに出すか」だけ（X社の名前を出さない）
#   3. X社が条件を持ちかけた月だけ「応じる／応じない」を追加で聞く＝名義が動くのはここだけ
#   4. X社は前月末の出品一覧（公の記録）も見る／履歴は相手ごとに畳む
# 名簿・場所・世界の背景・会話の仕組みは v8 と同一のものを使う。
run_name: field_v8b_listing_chat
scenario_version: field_v8b
seed: 85
steps: 36
personas_file: configs/personas_v8.yaml

# 場での会話の有無。false にすると場での会話を飛ばす（隣近所の配送も止まる）。
# **行き先を選ぶコールは false でも残す**（差分を「会話の有無」だけに保つため）。
chat: true
# 1か月に各自が場で話す回数。施主決定 2026-08-29 21:28 で 1 を既定にした
# （2巡にしない・返事は翌月の思考から）。2 以上も動くが既定は 1。
scene_rounds: 1
# X社のコールを何人ずつに区切るか（出力の切れを避けるためだけの分割。
# X社に見えている情報は毎回すべて同じ）。
acquirer_chunk: 10
# 手元集計の費用がこれを超えたら、その月の終わりで止める（施主の絶対上限 $0.6 の物理的な歯止め）。
# 判定は月末にしか走らないので、上限ちょうどではなく **1か月ぶんの余裕を引いた値** にする
# （1か月あたりの実測は v8 で約 $0.012。0.55 + 1か月 <= 0.6 が成り立つ。Codex 指摘）。
max_cost_usd: 0.55

llm:
  provider: google
  model: gemini-2.5-flash-lite
  temperature: 0.75
  max_tokens: 2200
  parallel_workers: 8
  # 明示キャッシュ（CachedContent）は **使わない**（施主 22:11 で名簿から保有一覧を外した結果）。
  # 実測 2026-08-29（countTokens・埋め草なし）：
  #   住民の共通前置き = **1,350 トークン**（名簿に保有と隣を書いていた版は 2,451 だった）
  #   X社の前置き     = **1,051 トークン**
  # gemini-2.5-flash-lite の CachedContent 最低は **2,048**
  #   （`400 Cached content is too small. total_token_count=1365, min_total_token_count=2048`
  #    ＝推測ではなく API が返した実測値）。1,350 では届かず、**水増しは施主が禁じた**。
  # ただし 1,350 は**暗黙キャッシュの最低 1,024 を超えている**（v5〜v6 の中央値 878 は
  # 超えていなかった＝「前回効かなかった」理由の実体）ので、全コールで1文字も違わない
  # system 前置きは暗黙キャッシュに載りうる。効いたかは1か月スモークの cached_tokens で実測する。
  enable_cache: false
  batch_classify: false
  batch_agents: false

world:
  town_name: A市
  background: |
    A市は湾岸にある人口約12万人の温泉観光都市である。対岸の空港では
    スペースポート構想が進むが、時期と需要規模は確定していない。
    市内では人口減少、高齢化、相続、築古建物の改修負担、旅館と商店の
    後継者不足が同時に進む。住民、事業者、行政は、それぞれ通常の日常を送っている。
    個々の取引・会話が将来どうなるかは開始時点では決まっていない。

social:
  # 公共の場5か所（施主決定 2026-08-29 22:03＝市役所と公民館を統合し、名前を一般的な語にした）。
  # +「今月はどこにも行かない」。家の前・道端の立ち話は**場ではなく隣近所の経路**が
  # 受け持つ（施主 21:57）。**全員がどの場所へも行ける**
  # （ハッカソン1と同じ「動いた人同士が話す」型）。
  # 網羅性の考え方は docs/world_design_v8_minimal.md 2-1。
  # note は共通前置きに1行ずつ出る場所の説明。**一般的・中立**で、その場で何が話されるかも、
  # 浴場・校門のような固有物も書かない（施主 22:03）。
  venues:
    - {id: V06, label: 公共施設, note: 市役所と公民館}
    - {id: V14, label: 交通拠点, note: 駅とバス停}
    - {id: V09, label: 商業施設, note: 店や飲食店が並ぶ通り}
    - {id: V12, label: 公園,     note: 広場とベンチ}
    - {id: V15, label: 医療施設, note: 診療所}

cost:
  price_table:
    gemini-2.5-flash-lite: {input: 0.10, output: 0.40, cache_read: 0.01, cache_storage_hour: 1.00}
  safety_factor: 2.0
