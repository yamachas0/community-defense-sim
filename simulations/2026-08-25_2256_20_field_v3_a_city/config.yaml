  acquirer_budget: 90000
  acquirer_mandate: '取締役会はA市を非公開の投資対象に決定した。この60か月の実行期間内に、

    合法的な不動産所有、長期賃借、運営権からなるポートフォリオを形成する。

    複数案件がX社の共通支配下にあると地域社会に認識されることを避ける。

    予算を超えず、日本の法令と契約を守る。取得対象、接触先、仲介利用、

    直接接触、価格、速度、順序、名義、説明、待機を含む手段は自ら判断する。

    '
