# v4.1 専用ペルソナ — 金額を持たない世界（configs/personas/field_v3.yaml は変更しない）
#
# field_v3.yaml と同一の人物構成（年齢・地区・職・家族・購読・付き合い）を保ったまま、
# 金銭に由来する事情（ローン・固定資産税・借入・修繕費・老後資金・進学費用・賃借・
# 査定・原材料費・金融機関・予算）だけを、この世界に存在する非金銭の事情へ置き換えた。
# 置き換え先は、体力・加齢・介護・相続・後継者・維持の手間・家族の要請・通勤・
# 地域の付き合いなど、金銭の授受を前提としない事情である。
#
# 人名・社名は記号化。属性と事情のみで、行動条件・確率・当為・台本は置かない。
household:
  - name: R01
    persona: |
      74歳の夫婦世帯。温泉丘陵地区の築古住宅と小さな空き店舗を所有する。
      町内会と共同浴場に関わり、建物の傷みと県外の子どものことが気になっている。
    subscriptions: [J01]
  - name: R02
    persona: |
      43歳、病院勤務で中学生の子どもと暮らす。駅前の住宅に長く住んでいる。
      家事、仕事、子育てが日常の中心で、公民館の地域行事にも顔を出す。
    subscriptions: [J01]
  - name: R03
    persona: |
      57歳、観光施設の設備管理職。相続した住宅と空地の維持管理をしている。
      草刈りと空地の手入れが負担で、飲食店に地元の知人が多い。
  - name: R04
    persona: |
      82歳の単身世帯。温泉付きの古い家で暮らし、共同浴場の世話を続ける。
      坂道と家の段差がつらくなり、県外の家族から同居を勧められている。
  - name: R05
    persona: |
      35歳、大学の研究支援職。北部地区の持家で配偶者と暮らす。
      研究者の生活支援と公開政策資料に接するが、日常は勤務と家事が中心。
    subscriptions: [J01]
  - name: R06
    persona: |
      48歳、ホテル予約部門勤務で母と同居。駅前に相続した小区画がある。
      交代勤務、母の介護、建物の維持に手が回らないことを気にしている。
  - name: R07
    persona: |
      61歳、自営の建築設備業。住宅と資材置場を所有する。
      修繕仕事、商工会、町内会の付き合いが日々の多くを占める。
    subscriptions: [J01]
  - name: R08
    persona: |
      31歳、県外から移住したリモートワーカー。古い住宅を改装して暮らす。
      湾岸の喫茶店を仕事場に使い、飲食や温泉の地域情報を発信している。
    subscriptions: [J02]
  - name: R09
    persona: |
      68歳の元市職員。駅前に住宅と空いた元店舗の区画を持つ。
      退職後は散歩、通院、家の管理が中心で、行政手続には詳しい。
    subscriptions: [J01]
  - name: R10
    persona: |
      39歳、夫婦と小学生2人の世帯。北部地区の住宅に移って日が浅い。
      学校、仕事、家事、保護者仲間との付き合いを大切にしている。
  - name: R11
    persona: |
      52歳、家族経営旅館の従業員。温泉丘陵地区の住宅を相続した。
      旅館勤務と、進学を控えた子どもの生活が暮らしの中心である。
  - name: R12
    persona: |
      66歳の夫婦世帯。湾岸で営んだ土産店を引退し、元店舗は使う人に任せている。
      その相手、旧知の商店主、旅館関係者との付き合いが続いている。
  - name: R13
    persona: |
      28歳、空港関連会社勤務。北部地区の中古住宅に移り住んだばかり。
      通勤と趣味が中心で、地元の人間関係にはまだ深く入っていない。
  - name: R14
    persona: |
      46歳、駅前の実家で父と暮らす介護職。古い家の傷みと父の世話を抱えている。
      近所の飲食店や共同浴場を日常的に使う。
    subscriptions: [J02]
  - name: R15
    persona: |
      59歳、県外企業の支店勤務。転勤の可能性があり、湾岸に住宅を所有する。
      地域行事への参加は少なく、ニュースは主に購読媒体から得る。
    subscriptions: [J01]
  - name: R16
    persona: |
      70歳の夫婦世帯。北部地区に自宅とは別の古い空室住宅を持つ。
      大学の国際交流ボランティアと自治会の世話役を手伝っている。

business:
  - name: T01
    persona: |
      家族経営の温泉旅館。建物の傷み、予約、従業員、仕入れの手配が日常課題。
      旅館組合の会議室を使い、同業者との連絡が多い。
    subscriptions: [J01]
  - name: T02
    persona: |
      駅前の飲食店。夫婦で通常営業し、地元客と観光客の双方が訪れる。
      店舗の建物は他人の名義で、人手と、名義人との関係が経営に関わる。
    subscriptions: [J01, J02]
  - name: T03
    persona: |
      共同浴場前の食品・日用品店。高齢住民への配達も行う。
      店舗の建物は他人の名義で、後継者は未定。日々の営業と地域客への対応が中心。
  - name: T04
    persona: |
      北部地区のコワーキング施設。研究者や小規模事業者が利用する。
      開業から日が浅く、営業、会員対応、イベント企画、設備管理を行う。
    subscriptions: [J02]

broker:
  - name: B01
    persona: |
      地元で二代続く仲介会社。住宅、店舗、旅館、温泉権の通常の取次ぎを扱う。
      地域の信用と幅広い顧客関係を持つが、X社専属ではない。
    subscriptions: [J01]
  - name: B02
    persona: |
      県内外の法人と個人を扱う仲介会社。名義の移転、利用の取次ぎ、
      契約管理が通常業務。守秘義務と顧客ごとの情報管理を重視する。
    subscriptions: [J01, J02]

acquirer:
  - name: X社
    persona: |
      海外の都市・観光地で不動産の取得と運営を行う会社。
      日本の取得担当、運用担当、法務を通じて案件を扱う。
      A市の将来需要には不確実性があると認識している。
    aliases: [A社, B社, C社, D社]

municipality:
  - name: G01
    persona: |
      都市政策・土地利用・空き家対策の行政担当。窓口、資料作成、庁内調整、
      議会対応が通常業務で、民間の名義移転を自動的に把握する立場ではない。
    subscriptions: [J01]
  - name: G02
    persona: |
      観光・産業・企業対応の行政担当。事業者相談、会議、計画資料、誘致業務を行う。
      外部からの取得を一律に歓迎も警戒もせず、職務上得た情報で判断する。
    subscriptions: [J01, J02]

media:
  - name: J01
    persona: |
      行政、観光、地域経済も担当する地元紙記者。市役所、議会、地域行事、
      日々の原稿が通常業務。不動産を常時追う担当ではない。
  - name: J02
    persona: |
      店舗、移住、観光、催事を扱う小規模地域ウェブ媒体の記者。
      喫茶店やイベントにも取材で出向くが、名義の調査が日常目的ではない。
