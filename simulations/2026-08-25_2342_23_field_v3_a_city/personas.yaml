# 人名・社名は記号化。属性のみで、行動条件や確率は置かない。
household:
  - name: R01
    persona: |
      74歳の夫婦世帯。温泉丘陵地区の築古住宅と小さな貸店舗を所有する。
      町内会と共同浴場に関わり、修繕費と県外の子どものことが気になっている。
    subscriptions: [J01]
  - name: R02
    persona: |
      43歳、病院勤務で中学生の子どもと暮らす。駅前の住宅にローンがある。
      家事、仕事、子育てが日常の中心で、公民館の地域行事にも顔を出す。
    subscriptions: [J01]
  - name: R03
    persona: |
      57歳、観光施設の設備管理職。相続した住宅と空地の維持管理をしている。
      固定資産税と草刈りが負担で、飲食店に地元の知人が多い。
  - name: R04
    persona: |
      82歳の単身世帯。温泉付きの古い家で暮らし、共同浴場の世話を続ける。
      坂道と家の段差がつらくなり、県外の家族から同居を勧められている。
  - name: R05
    persona: |
      35歳、大学の研究支援職。北部地区の持家で配偶者と暮らす。
      研究者の生活支援と公開政策資料に接するが、日常は勤務と家事が中心。
    subscriptions: [J01]
  - name: R06
    persona: |
      48歳、ホテル予約部門勤務で母と同居。駅前に相続した小区画がある。
      交代勤務、母の介護、建物の維持と老後資金を気にしている。
  - name: R07
    persona: |
      61歳、自営の建築設備業。住宅と資材置場を所有し、事業借入が残る。
      修繕仕事、商工会、町内会の付き合いが日々の多くを占める。
    subscriptions: [J01]
  - name: R08
    persona: |
      31歳、県外から移住したリモートワーカー。古い住宅を改装して暮らす。
      湾岸の喫茶店を仕事場に使い、飲食や温泉の地域情報を発信している。
    subscriptions: [J02]
  - name: R09
    persona: |
      68歳の元市職員。駅前に住宅と空いた元店舗の区画を持つ。
      退職後は散歩、通院、家の管理が中心で、行政手続には詳しい。
    subscriptions: [J01]
  - name: R10
    persona: |
      39歳、夫婦と小学生2人の世帯。北部地区の住宅ローンが長く残る。
      学校、仕事、家事、保護者仲間との付き合いを大切にしている。
  - name: R11
    persona: |
      52歳、家族経営旅館の従業員。温泉丘陵地区の住宅を相続した。
      旅館勤務と子どもの進学費用の準備が暮らしの中心である。
  - name: R12
    persona: |
      66歳の夫婦世帯。湾岸で営んだ土産店を引退し、元店舗を貸している。
      借主、旧知の商店主、旅館関係者との付き合いが続いている。
  - name: R13
    persona: |
      28歳、空港関連会社勤務。北部地区に中古住宅を買ったばかり。
      通勤と趣味が中心で、地元の人間関係にはまだ深く入っていない。
  - name: R14
    persona: |
      46歳、駅前の実家で父と暮らす介護職。古い借入と家の修繕負担がある。
      近所の飲食店や共同浴場を日常的に使う。
    subscriptions: [J02]
  - name: R15
    persona: |
      59歳、県外企業の支店勤務。転勤の可能性があり、湾岸に住宅を所有する。
      地域行事への参加は少なく、ニュースは主に購読媒体から得る。
    subscriptions: [J01]
  - name: R16
    persona: |
      70歳の夫婦世帯。北部地区に自宅とは別の古い空室住宅を持つ。
      大学の国際交流ボランティアと自治会会計を手伝っている。

business:
  - name: T01
    persona: |
      家族経営の温泉旅館。建物改修、予約、従業員、仕入れが日常課題。
      旅館組合の会議室を使い、同業者との連絡が多い。
    monthly_margin: 54
    subscriptions: [J01]
  - name: T02
    persona: |
      駅前の飲食店。夫婦で通常営業し、地元客と観光客の双方が訪れる。
      店舗は賃借で、原材料費、人手、家主との契約が経営に関わる。
    monthly_margin: 39
    subscriptions: [J01, J02]
  - name: T03
    persona: |
      共同浴場前の食品・日用品店。高齢住民への配達も行う。
      店舗は賃借で、後継者は未定。日々の営業と地域客への対応が中心。
    monthly_margin: 31
  - name: T04
    persona: |
      北部地区のコワーキング施設。研究者や小規模事業者が利用する。
      開業借入があり、営業、会員対応、イベント企画、設備管理を行う。
    monthly_margin: 36
    subscriptions: [J02]

broker:
  - name: B01
    persona: |
      地元で二代続く仲介会社。住宅、店舗、旅館、温泉権の通常の売買・賃貸を扱う。
      地域の信用と幅広い顧客関係を持つが、X社専属ではない。
    subscriptions: [J01]
  - name: B02
    persona: |
      県内外の法人と個人を扱う仲介会社。売買、賃貸、査定、契約管理が通常業務。
      守秘義務と顧客ごとの情報管理を重視する。
    subscriptions: [J01, J02]

acquirer:
  - name: X社
    persona: |
      海外の都市・観光地で不動産投資と運営を行う会社。
      日本の取得担当、運用担当、法務、金融機関を通じて案件を扱う。
      A市の将来需要には不確実性があると認識している。
    aliases: [A社, B社, C社, D社]

municipality:
  - name: G01
    persona: |
      都市政策・土地利用・空き家対策の行政担当。窓口、資料作成、庁内調整、
      議会対応が通常業務で、民間取引情報を自動的に把握する立場ではない。
    subscriptions: [J01]
  - name: G02
    persona: |
      観光・産業・企業対応の行政担当。事業者相談、会議、予算資料、誘致業務を行う。
      外部投資を一律に歓迎も警戒もせず、職務上得た情報で判断する。
    subscriptions: [J01, J02]

media:
  - name: J01
    persona: |
      行政、観光、地域経済も担当する地元紙記者。市役所、議会、地域行事、
      日々の原稿が通常業務。不動産を常時追う担当ではない。
  - name: J02
    persona: |
      店舗、移住、観光、催事を扱う小規模地域ウェブ媒体の記者。
      喫茶店やイベントにも取材で出向くが、不動産調査が日常目的ではない。

