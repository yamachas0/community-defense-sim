, "consult_id": "Q0001", "by": "BR01", "to": "BZ04", "reply": "T04様、駅周辺のコワーキングスペースや小規模事業者向け空き店舗についてですね。現在、駅前地区（P07など）にはいくつか店舗物件がございますが、具体的な活用については、個別の物件の状況やオーナー様の意向によります。情報収集を進め、より適した物件があればご連絡いたします。"}, {"step": 2, "kind": "advice", "consult_id": "Q0002", "by": "BR01", "to": "HH01", "reply": "R01様、築古住宅と空き店舗の活用についてですね。物件の具体的な場所や築年数、現在の状態、そしてR01様がどのような活用をイメージされているか、もう少し詳しくお聞かせいただけますでしょうか。それによって、より的確なアドバイスが可能になります。"}, {"step": 2, "kind": "advice", "consult_id": "Q0003", "by": "BR01", "to": "HH03", "reply": "R03様、湾岸地区の空地（P20）の活用についてですね。維持管理のご負担は大きいこととお察しいたします。売却、賃貸、あるいは資材置き場や駐車場としての活用など、様々な選択肢が考えられます。まずはお話を伺い、R03様の意向に沿ったご提案をさせていただきます。"}, {"step": 2, "kind": "advice", "consult_id": "Q0004", "by": "BR01", "to": "HH04", "reply": "R04様、自宅と土地の売却をご検討とのこと、承知いたしました。現在のA市の不動産市場の動向を踏まえ、相場感や一般的な売却手続きについてご説明いたします。まずは、対象物件の詳細をお伺いできれば幸いです。"}, {"step": 2, "kind": "advice", "consult_id": "Q0005", "by": "BR01", "to": "HH06", "reply": "R06様、駅前地区の店舗（P07）と住宅（P23）の活用・売却についてのご相談、ありがとうございます。建物の維持や介護、お仕事との両立でご負担とのこと、心中お察しいたします。まずはお話を伺い、R06様にとって最善の選択肢を一緒に考えさせていただければと思います。"}, {"step": 2, "kind": "advice", "consult_id": "Q0006", "by": "BR01", "to": "HH10", "reply": "R10様、北部地区の土地の利用状況や将来的な不動産価値についてですね。北部地区は学術・生活地区としての発展も期待されており、土地の利用状況は様々です。詳細な情報をご希望でしたら、具体的な場所をお知らせいただければ、登記情報などをもとに調査いたします。"}, {"step": 2, "kind": "consult", "consult_id": "Q0013", "by": "BZ01", "to": "BR01", "question": "「一定面積以上の土地取得に関する届出制度」が施行されましたが、最近の不動産市場の動向にどのような影響がありますか？特に、旅館や事業用物件の取引について、何か変化は感じられますでしょうか。"}, {"step": 2, "kind": "consult", "consult_id": "Q0014", "by": "BZ04", "to": "BR01", "question": "駅前地区でコワーキングスペースの会員獲得に繋がりそうな空き店舗や遊休不動産はありますでしょうか。また、100㎡以上の土地取得に関する条例施行について、不動産取引への影響はどのように考えられますか。"}, {"step": 2, "kind": "consult", "consult_id": "Q0015", "by": "HH01", "to": "BR01", "question": "所有しているP02（店舗、90㎡）とP18（住宅、90㎡）の現在の市場価値と、今後の活用方法について相談したいです。特に、P18への取得申し入れについて、条例施行を踏まえてどのように対応すべきかアドバイスをいただきたいです。"}, {"step": 2, "kind": "consult", "consult_id": "Q0016", "by": "HH03", "to": "BR01", "question": "先月P20の件で相談しましたが、まだ回答がありません。今月から土地取得に関する条例が施行されたようですが、P20の件に影響はありますか？"}, {"step": 2, "kind": "consult", "consult_id": "Q0017", "by": "HH05", "to": "BR01", "question": "This month, a regulation requiring pre-notification for land acquisition of 100㎡ or more comes into effect. How does this regulation impact properties of this size, particularly regarding acquisition processes and potential delays?"}, {"step": 2, "kind": "consult", "consult_id": "Q0018", "by": "HH06", "to": "BR01", "question": "P07（店舗）とP23（住宅）の活用方法について情報収集をお願いしたいです。特に、第2月から施行される「一定面積以上の土地取得に関する届出制度」の影響も考慮した上で、売却や賃貸の可能性について、相場や手続きなどを教えていただけますでしょうか。"}, {"step": 2, "kind": "consult", "consult_id": "Q0019", "by": "HH08", "to": "BR01", "question": "第2月より施行される「一定面積以上の土地取得に関する届出制度」について、この制度が不動産取引にどのような影響を与えるとお考えでしょうか？また、仲介業者として、今後どのように対応していくご予定ですか？"}, {"step": 2, "kind": "consult", "consult_id": "Q0020", "by": "HH09", "to": "BR01", "question": "私の所有物件（P10, P26, P42）の活用方法について、一般的なアドバイスをいただけますでしょうか。"}, {"step": 2, "kind": "consult", "consult_id": "Q0021", "by": "HH10", "to": "BR01", "question": "100㎡を超える土地の取得に関する届出制度について、私の所有物件（110㎡）に影響はありますか？また、この制度について詳しく教えていただけますか？"}, {"step": 2, "kind": "consult", "consult_id": "Q0022", "by": "HH13", "to": "BR01", "question": "第1月にお伺いした件ですが、100㎡超の土地取得に関する条例が今月から施行されました。私の所有物件（P14, P30, P46）も対象となります。この条例施行を踏まえ、私の物件（特に店舗物件P14, P30）の活用法について、具体的なアドバイスをいただけますでしょうか。また、住宅物件（P46）の購入や売却についても、現在の市場動向と合わせてご相談させてください。"}, {"step": 2, "kind": "consult", "consult_id": "Q0023", "by": "HH16", "to": "BR01", "question": "先月相談した空き家P17（70㎡）について、条例施行（100㎡超の土地取得に関する1か月の届出遅延）も踏まえ、売却または有効活用について、より具体的なアドバイスをいただけますでしょうか。"}, {"step": 2, "kind": "investigate", "by": "MD01", "note": "corporate_records"}, {"step": 2, "kind": "investigate", "by": "MU01", "note": "land_registry"}, {"step": 2, "kind": "public_statement", "by": "MU02", "note": "第2月施行「一定面積以上の土地取得に関する届出制度」について、現時点での適用実績は0件であることを公表します。"}, {"step": 2, "kind": "hold", "offer_id": "O0001", "parcel_id": "P18", "by": "HH01"}, {"step": 2, "kind": "hold", "offer_id": "O0002", "parcel_id": "P19", "by": "HH02"}, {"step": 2, "kind": "hold", "offer_id": "O0003", "parcel_id": "P20", "by": "HH03"}, {"step": 2, "kind": "hold", "offer_id": "O0004", "parcel_id": "P21", "by": "HH04"}, {"step": 2, "kind": "hold", "offer_id": "O0005", "parcel_id": "P23", "by": "HH06"}, {"step": 2, "kind": "hold", "offer_id": "O0006", "parcel_id": "P24", "by": "HH07"}, {"step": 3, "kind": "advice_rejected", "consult_id": "MSG-M02-BR01-BR02", "by": "BR02", "reason": "no_such_consultation"}, {"step": 3, "kind": "consult", "consult_id": "Q0024", "by": "BZ01", "to": "BR01", "question": "先月お願いした件、条例施行後の不動産市場の動向について、もう少し詳しくお伺いしたいのですが。"}, {"step": 3, "kind": "consult", "consult_id": "Q0025", "by": "BZ03", "to": "BR01", "question": "先月施行された「一定面積以上の土地取得に関する届出制度」について、最近の不動産取引の動向にどのような影響がありますか？"}, {"step": 3, "kind": "consult", "consult_id": "Q0026", "by": "BZ04", "to": "BR01", "question": "第2月にお願いした駅前地区のコワーキングスペースや小規模事業者向けの空き店舗の情報について、何か進捗はありますでしょうか。また、先日施行された「一定面積以上の土地取得に関する届出制度」ですが、現時点での不動産取引への影響について、B01さんの見解をお聞かせいただけますか。もし、条例施行後も取引に影響がないような物件があれば、ぜひご紹介いただきたいです。"}, {"step": 3, "kind": "consult", "consult_id": "Q0027", "by": "HH01", "to": "BR01", "question": "P18（住宅、90㎡）のX社からの取得申し入れについて、返答期限が近づいています。100㎡未満の物件ですが、新しい届出制度の影響も含め、P18およびP02（空き店舗、90㎡）の活用と売却について、具体的なアドバイスをお願いします。売却する場合の適正価格や、活用する場合の renters の見込みなども含めてご教示ください。"}, {"step": 3, "kind": "consult", "consult_id": "Q0028", "by": "HH03", "to": "BR01", "question": "先月P20の件で相談させていただきましたが、その後いかがでしょうか。また、今月から施行された「一定面積以上の土地取得に関する届出制度」がP20に影響するかどうか、ご存知でしたら教えていただけますでしょうか。"}, {"step": 3, "kind": "consult", "consult_id": "Q0029", "by": "HH06", "to": "BR01", "question": "駅前地区の店舗（P07）と住宅（P23）の活用・売却について相談したいです。第2月より施行された「一定面積以上の土地取得に関する届出制度」が、これらの物件の取引にどのような影響を与えるか、また、R06にとって最善の活用・売却方法についてアドバイスをいただけますでしょうか。"}, {"step": 3, "kind": "consult", "consult_id": "Q0030", "by": "HH08", "to": "BR01", "question": "100㎡以上の土地取得に関する新条例について、不動産取引への影響と、仲介業者としての対応について教えてください。"}, {"step": 3, "kind": "consult", "consult_id": "Q0031", "by": "HH10", "to": "BR01", "question": "先月ご相談させていただいた北部地区の土地（P27, P43）の件について、追加でお伺いしたいことがあります。施行された「一定面積以上の土地取得に関する届出制度」について、私の所有物件は110㎡が3つありますが、この制度の適用対象となる可能性について、現時点での見解をお聞かせいただけますでしょうか。また、B01様からいただいた北部地区の土地利用に関する情報も踏まえ、今後の不動産価値についてもお伺いできれば幸いです。"}, {"step": 3, "kind": "consult", "consult_id": "Q0032", "by": "HH11", "to": "BR01", "question": "先月相談した件について、まだ回答がありません。第2月施行の「一定面積以上の土地取得に関する届出制度」が私の所有物件（P12, P28, P44）にどのような影響を与えるか、また、P44の空地の活用や売却について、特にこの制度との関連で懸念しています。見解をお聞かせください。"}, {"step": 3, "kind": "consult", "consult_id": "Q0033", "by": "HH13", "to": "BR01", "question": "第2月施行「一定面積以上の土地取得に関する届出制度」について、また私の所有物件（P14, P30, P46）の活用法、特に店舗物件の活用や住宅物件の購入・売却について具体的なアドバイスをください。"}, {"step": 3, "kind": "consult", "consult_id": "Q0034", "by": "HH15", "to": "BR01", "question": "先月依頼した土地の件について、何か進展はありましたでしょうか？"}, {"step": 3, "kind": "consult", "consult_id": "Q0035", "by": "HH16", "to": "BR01", "question": "第2月施行の「一定面積以上の土地取得に関する届出制度」について、100㎡超の土地取得に1か月の遅延が生じるとのことですが、この制度を踏まえたP17（70㎡の空地）の売却または活用について、具体的なアドバイスをいただけますでしょうか。"}, {"step": 3, "kind": "investigate", "by": "MD01", "note": "corporate_records"}, {"step": 3, "kind": "publication", "by": "MD01", "headline": "【特集】A市不動産市場の動向：海外投資ファンドの影か", "body": "【特集】A市不動産市場の動向：海外投資ファンドの影か\nA市では、第2月より施行された「一定面積以上の土地取得に関する届出制度」の適用実績が、現時点で0件であることが市から発表された。一方で、公開法人記録を調査したところ、市内最大の土地所有者であるR07（1350㎡）の背後に、海外の不動産投資・運営会社であるX社、およびその関連会社であるA社、B社、D社が存在する可能性が浮上した。これらの企業は、香港法人S投資控股との関連が深く、大規模な不動産投資スキームの一部である可能性も否定できない。今後のA市の土地利用や開発に、海外資本がどのように関わってくるのか、引き続き注視していく必要がある。", "about_acquisition": true}, {"step": 3, "kind": "investigate", "by": "MU01", "note": "land_registry"}, {"step": 3, "kind": "public_statement", "by": "MU02", "note": "「一定面積以上の土地取得に関する届出制度」は、現在までに該当する名義移転がなく、施行状況に特筆すべき事項はありません。引き続き、制度の周知に努めてまいります。"}, {"step": 3, "kind": "ordinance", "by": "MU02", "title": "一定面積以上の土地取得に関する届出制度", "body": "1件あたり100㎡を超える土地の取得には、届出が必要です。届出後1ヶ月の待機期間を経て所有権移転が成立します。", "threshold_sqm": 100, "delay_months": 1, "effective_step": 4}, {"step": 3, "kind": "hold", "offer_id": "O0001", 1", "question": "第3月にお送りした不動産市場の動向に関するご質問ですが、その後いかがでしょうか。特に、海外投資ファンドの動向と、新条例施行後の影響について、現地の不動産業者の見解をお聞かせいただけますと幸いです。"}, {"step": 5, "kind": "consult", "consult_id": "Q0049", "by": "BZ03", "to": "BR01", "question": "先月ご相談させていただいた件、まだお返事をいただけていないのですが、先日告示された「一定面積以上の土地取得に関する届出制度」について、特に100㎡超の土地取引が1ヶ月遅れて成立するという点について、今後の不動産市場にどのような影響があるとお考えでしょうか？また、この制度について何か追加の情報があれば教えていただけますでしょうか。"}, {"step": 5, "kind": "consult", "consult_id": "Q0050", "by": "BZ04", "to": "BR01", "question": "前回の相談（Q0014, Q0026, Q0038）への回答はまだでしょうか。また、第5月から施行された「一定面積以上の土地取得に関する届出制度」について、告示では100㎡超の取得は1か月遅れて成立するとありますが、行政発表では適用実績0件とのこと、この食い違いについてご説明いただけますでしょうか。制度施行後の不動産市場への影響、特に駅前地区での物件の動きについて、何か情報があればお聞かせください。"}, {"step": 5, "kind": "consult", "consult_id": "Q0051", "by": "HH01", "to": "BR01", "question": "第2月にお願いしたP18とP02の活用について、まだお返事をいただけていないのですが、X社からのP18の取得申し入れについて、そろそろ返答の時期が迫ってきております。つきましては、P18の取得申し入れへの対応と、P18・P02の今後の活用について、改めてご相談させていただけないでしょうか。併せて、第5月から施行される「一定面積以上の土地取得に関する届出制度」が、私の所有物件にどのような影響を与える可能性があるか、専門的な見地からご教示いただけますと幸いです。"}, {"step": 5, "kind": "consult", "consult_id": "Q0052", "by": "HH03", "to": "BR01", "question": "第4月にお願いしたP20の件ですが、まだご回答をいただけておりません。今月から施行された「一定面積以上の土地取得に関する届出制度」について、私のP20への影響はあるのでしょうか？状況を教えていただけますでしょうか。"}, {"step": 5, "kind": "consult", "consult_id": "Q0053", "by": "HH06", "to": "BR01", "question": "第5月より施行された「一定面積以上の土地取得に関する届出制度」が、私の所有するP07（320㎡）およびP23（320㎡）の活用・売却に与える具体的な影響について、見解をお聞かせください。また、この制度を考慮した上での、P07とP23の活用・売却に関する具体的な提案をお願いいたします。"}, {"step": 5, "kind": "consult", "consult_id": "Q0054", "by": "HH08", "to": "BR01", "question": "第5月度より施行された「一定面積以上の土地取得に関する届出制度」について、現時点での貴社の対応状況や、この条例が不動産取引に与える影響について、どのように分析されているかお伺いしたいです。また、今後の見通しについてもご教示いただければ幸いです。"}, {"step": 5, "kind": "consult", "consult_id": "Q0055", "by": "HH10", "to": "BR01", "question": "先月からの未回答の件に加え、「一定面積以上の土地取得に関する届出制度」について、私の所有物件（P11, P27, P43）が対象となるか、また制度施行による土地取引への影響について伺いたいです。"}, {"step": 5, "kind": "consult", "consult_id": "Q0056", "by": "HH11", "to": "BR01", "question": "「一定面積以上の土地取得に関する届出制度」の施行に伴い、私の所有物件（P12, P28, P44）への具体的な影響について、特にP44の空地について、仲介業者としての見解をお聞かせください。"}, {"step": 5, "kind": "consult", "consult_id": "Q0057", "by": "HH13", "to": "BR01", "question": "第5月から施行される「一定面積以上の土地取得に関する届出制度」について、私の所有物件（全て240㎡）への影響と、この制度下での店舗物件（P14, P30）および住宅物件（P46）の活用・売買戦略について、具体的なアドバイスをいただきたいです。特に、制度による成立遅延が取引に与える影響と、それを有利に進める方法があれば教えてください。"}, {"step": 5, "kind": "consult", "consult_id": "Q0058", "by": "HH15", "to": "BR01", "question": "第3月から相談している件について、まだ回答がないのですが、現在の状況はいかがでしょうか。また、今月施行された「一定面積以上の土地取得に関する届出制度」について、私の物件（450㎡）への影響と、海外資本の動向を踏まえた上での売却可能性について、ご意見をお聞かせください。"}, {"step": 5, "kind": "consult", "consult_id": "Q0059", "by": "HH16", "to": "BR01", "question": "P17の活用について、事業用としての可能性と、現在施行されている「一定面積以上の土地取得に関する届出制度」がP17の取得に与える影響について、改めてご相談させてください。特に、100㎡超の土地取得における1か月の遅延について、具体的な手続きや影響を教えていただけますでしょうか。"}, {"step": 5, "kind": "publication", "by": "MD01", "headline": "【不動産投資】海外ファンドのA市土地保有実態と新条例の波紋", "body": "【不動産投資】海外ファンドのA市土地保有実態と新条例の波紋\nA市における大規模な土地保有の背景に、海外からの投資ファンドが関与している可能性が浮上した。法人記録によると、市内に1350㎡の土地を保有するR07の名義は、X社、A社、B社、D社、そして香港法人S投資控股といった組織と関連が深いことが示唆されている。これらの組織は、海外での不動産投資・運営を主軸としており、A市の不動産市場への影響が懸念される。\n\n一方、今月より施行された「一定面積以上の土地取得に関する届出制度」は、100㎡を超える土地の取得に対し、成立を1ヶ月遅延させるものだ。R07の土地保有はこの制度の対象となりうる。制度施行後、現時点での適用実績は0件との行政発表もあるが、この制度が海外からの不動産投資を抑制する効果を持つのか、今後の動向が注目される。本紙は、引き続きA市の不動産市場と海外からの投資動向を注視していく。", "about_acquisition": true}, {"step": 5, "kind": "investigate", "by": "MU01", "note": "land_registry"}, {"step": 5, "kind": "investigate", "by": "MU02", "note": "corporate_records"}, {"step": 5, "kind": "public_statement", "by": "MU02", "note": "今月も、施行中の「一定面積以上の土地取得に関する届出制度」について、現時点では条例に該当する名義移転がないことを公表します。また、条例の周知に努めます。"}, {"step": 5, "kind": "ordinance", "by": "MU02", "title": "一定面積以上の土地取得に関する届出制度", "body": "1件あたり100㎡を超える土地の取得は、届出により1ヶ月遅れて成立する。", "threshold_sqm": 100, "delay_months": 1, "effective_step": 6}, {"step": 5, "kind": "hold", "offer_id": "O0001", "parcel_id": "P18", "by": "HH01"}, {"step": 5, "kind": "hold", "offer_id": "O0002", "parcel_id": "P19", "by": "HH02"}, {" 43。いずれも110㎡）がこの制度の対象となるか、また、制度施行が今後の土地取引にどのような影響を与えるかについて、ご見解をお聞かせください。"}, {"step": 6, "kind": "consult", "consult_id": "Q0067", "by": "HH11", "to": "BR01", "question": "私の所有するP44（北部学術・生活地区、空地、140㎡）について、「一定面積以上の土地取得に関する届出制度」の影響を確認したい。この制度では100㎡超の土地取得は1ヶ月遅れて成立すると伺っているが、P44のような空地の場合、取得の申し入れがあった場合、具体的にどのような影響があるのか？また、取得の遅延についても、詳細を伺いたい。"}, {"step": 6, "kind": "consult", "consult_id": "Q0068", "by": "HH13", "to": "BR01", "question": "第6月より施行された「一定面積以上の土地取得に関する届出制度」について、私の所有物件（P14, P30, P46）は全て100㎡超であり、この制度の対象となります。この制度が物件の売買や活用にどのような影響を与えるか、また、この状況下での店舗物件（P14, P30）の活用、住宅物件（P46）の売買について、具体的なアドバイスをいただけますでしょうか。"}, {"step": 6, "kind": "consult", "consult_id": "Q0069", "by": "HH15", "to": "BR01", "question": "第3月から継続して相談している件について、未だ回答がありません。今月も回答がない場合、BR02への相談を検討しますが、まずはBR01からの回答をお待ちしております。また、今月施行された「一定面積以上の土地取得に関する届出制度」について、私の所有物件（P16, P32、各450㎡）が対象となるかと思いますが、この制度への対応と、海外資本の動向を踏まえた私の物件の売却可能性について、ご意見を伺いたいです。"}, {"step": 6, "kind": "consult", "consult_id": "Q0070", "by": "HH16", "to": "BR01", "question": "P17の活用について、具体的な提案をいただけますでしょうか。また、現在施行されている「一定面積以上の土地取得に関する届出制度」により、100㎡超の土地取得には1ヶ月の遅延が生じるとのことですが、この制度がP17の活用に与える影響についてもご教示いただけますと幸いです。"}, {"step": 6, "kind": "publication", "by": "MD01", "headline": "【特集】海外ファンドがA市不動産を席巻？ \"一定面積以上の土地取得に関する届出制度\"の適用は？", "body": "【特集】海外ファンドがA市不動産を席巻？ \"一定面積以上の土地取得に関する届出制度\"の適用は？\nA市では、湾岸のスペースポート構想を背景に、海外からの不動産投資への関心が高まっています。しかし、その実態は不透明な部分も少なくありません。この度、本紙の調査により、R07（1350㎡）を含む市内の広大な土地が、X社、A社、B社、D社、S投資控股といった海外の企業グループによって所有されている可能性が高いことが判明しました。これらの企業は、不動産投資や資産運用を主たる事業としており、その所有形態は複雑です。\n\n市では、こうした動きに対応するため、「一定面積以上の土地取得に関する届出制度」を今月より施行しました。この条例は、1件あたり100㎡を超える土地の取得に対し、届出を義務付け、成立を1ヶ月遅延させるものです。R07の土地もこの制度の対象となるはずですが、現時点では条例が実際に適用された事例は", "about_acquisition": true}, {"step": 6, "kind": "investigate", "by": "MU01", "note": "land_registry"}, {"step": 6, "kind": "public_statement", "by": "MU01", "note": "今月も、施行中の「一定面積以上の土地取得に関する届出制度」について、現時点では条例に該当する名義移転がないことを公表します。また、条例の周知に努めます。"}, {"step": 6, "kind": "investigate", "by": "MU02", "note": "corporate_records"}, {"step": 6, "kind": "public_statement", "by": "MU02", "note": "「一定面積以上の土地取得に関する届出制度」について、施行初月（第6月）の適用実績は0件でした。今後も制度の周知に努め、A市の健全な不動産市場の維持・発展に寄興してまいります。"}, {"step": 6, "kind": "ordinance", "by": "MU02", "title": "一定面積以上の土地取得に関する届出制度", "body": "100㎡を超える土地の取得は、届出のため1ヶ月遅れて成立する。", "threshold_sqm": 100, "delay_months": 1, "effective_step": 7}, {"step": 6, "kind": "hold", "offer_id": "O0001", "parcel_id": "P18", "by": "HH01"}, {"step": 6, "kind": "hold", "offer_id": "O0002", "parcel_id": "P19", "by": "HH02"}, {"step": 6, "kind": "hold", "offer_id": "O0003", "parcel_id": "P20", "by": "HH03"}, {"step": 6, "kind": "hold", "offer_id": "O0004", "parcel_id": "P21", "by": "HH04"}, {"step": 6, "kind": "hold", "offer_id": "O0005", "parcel_id": "P23", "by": "HH06"}, {"step": 6, "kind": "hold", "offer_id": "O0006", "parcel_id": "P24", "by": "HH07"}, {"step": 7, "kind": "consult", "consult_id": "Q0071", "by": "BZ03", "to": "BR01", "question": "「一定面積以上の土地取得に関する届出制度」施行後の市場動向、特に100㎡超の土地取得に関する遅延が取引に与える影響、そして長期的な不動産市場の見通しについて、具体的な取引事例を交えながらお聞かせいただけますでしょうか。"}, {"step": 7, "kind": "consult", "consult_id": "Q0072", "by": "BZ04", "to": "BR01", "question": "第5月にお伺いした件ですが、その後いかがでしょうか。また、第7月より施行された「一定面積以上の土地取得に関する届出制度」について、告示（ORD-MU02-M06）では「100㎡を超える土地の取得は、届出のため1ヶ月遅れて成立する」とありますが、行政発表（GOV-MU01-M06, GOV-MU02-M06）では該当する名義移転がないとのことです。この食い違いについて、仲介業者様の見解をお聞かせいただけますでしょうか。もし、この条例施行により、影響を受けている、あるいは今後影響が出そうな物件がございましたら、その状況についても教えていただけますと幸いです。"}, {"step": 7, "kind": "consult", "consult_id": "Q0073", "by": "HH01", "to": "BR01", "question": "P18の取得申し入れへの対応状況と、P18・P02の活用について、早急に具体的な提案をお願いします。また、P44の空地の面積について、改めて確認していただけますでしょうか。"}, {"step": 7, "kind": "consult", "consult_id": "Q0074", "by": "HH03", "to": "BR01", "question": "先月ご相談させていただいたP20の件について、まだお返事をいただけておりません。また、今月から施行された「一定面積以上の土地取得に関する届出制度」について、私のP20（140㎡）もこの制度の対象になるか、また、その影響についてご教示いただけますでしょうか。"}, {"step": 7, "kind": "consult", "consult_id": "Q0075", "by": "HH06", "to": "BR01", "question": "第7月より施行された「一定面積以上の土地取得に関する届出制度」が、私の所有物件（P07, P23）の活用・売却に具体的 y"}, {"step": 7, "kind": "investigate", "by": "MU01", "note": "land_registry"}, {"step": 7, "kind": "ordinance", "by": "MU01", "title": "一定面積以上の土地取得に関する届出制度", "body": "1件あたり100㎡を超える土地の取得に対し、届出を義務付け、成立を1ヶ月遅延させる。", "threshold_sqm": 100, "delay_months": 1, "effective_step": 8}, {"step": 7, "kind": "investigate", "by": "MU02", "note": "corporate_records"}, {"step": 7, "kind": "public_statement", "by": "MU02", "note": "今月施行された「一定面積以上の土地取得に関する届出制度」について、現時点では条例に該当する名義移転の届出および登記の遅延は確認されておりません。条例の周知に引き続き努めてまいります。"}, {"step": 7, "kind": "ordinance_same_step_conflict", "by": "MU02", "other": "MU01", "superseded": "一定面積以上の土地取得に関する届出制度", "effective": "一定面積以上の土地取得に関する届出制度"}, {"step": 7, "kind": "ordinance", "by": "MU02", "title": "一定面積以上の土地取得に関する届出制度", "body": "1件あたり100㎡を超える土地の取得に対し、届出を義務付け、成立を1ヶ月遅延させる。", "threshold_sqm": 100, "delay_months": 1, "effective_step": 8}, {"step": 7, "kind": "hold", "offer_id": "O0001", "parcel_id": "P18", "by": "HH01"}, {"step": 7, "kind": "hold", "offer_id": "O0002", "parcel_id": "P19", "by": "HH02"}, {"step": 7, "kind": "hold", "offer_id": "O0003", "parcel_id": "P20", "by": "HH03"}, {"step": 7, "kind": "transfer", "offer_id": "O0004", "parcel_id": "P21", "seller": "HH04", "buyer": "AQ01", "under_name": "X社"}, {"step": 7, "kind": "hold", "offer_id": "O0005", "parcel_id": "P23", "by": "HH06"}, {"step": 7, "kind": "hold", "offer_id": "O0006", "parcel_id": "P24", "by": "HH07"}, {"step": 8, "kind": "advice", "consult_id": "Q0081", "by": "BR02", "to": "HH15", "reply": "R15様、ご相談ありがとうございます。「一定面積以上の土地取得に関する届出制度」につきまして、現時点（第8月）では、条例に該当する名義移転の届出や登記の遅延は確認されておりません。しかしながら、一部報道では、海外の不動産投資ファンドが市内複数区画の土地と関連している可能性が示唆されております。この制度は100㎡超の土地取得を1ヶ月遅延させるため、今後の動向が注目されます。お客様の所有物件（P16, P32）の売却可能性については、現時点では具体的な影響は不明ですが、制度の施行状況や海外資本の動向を注視し、新たな情報が入り次第、速やかにご報告させていただきます。"}, {"step": 8, "kind": "consult", "consult_id": "Q0083", "by": "BZ03", "to": "BR01", "question": "条例施行後の市場動向、特に100㎡超の土地取得に関する遅延が取引に与える影響、そして長期的な不動産市場の見通しについて、具体的な取引事例を交えてご教示ください。"}, {"step": 8, "kind": "consult", "consult_id": "Q0084", "by": "BZ04", "to": "BR01", "question": "第5月にお送りした相談（Q0050）の進捗状況をお伺いしたいです。また、今月施行された「一定面積以上の土地取得に関する届出制度」について、告示（ORD-MU02-M07）と行政発表（G02）の食い違いについて、BR01さんの見解をお聞かせください。この制度による不動産取引への具体的な影響、特に駅前地区でコワーキングスペースの会員獲得につながりそうな空き店舗や遊休不動産の情報があれば、併せてお教えいただけますでしょうか。"}, {"step": 8, "kind": "consult", "consult_id": "Q0085", "by": "HH01", "to": "BR01", "question": "P18の取得申し入れ（O0001）への対応状況について、具体的な提案をお聞かせください。また、P02の活用についても併せてご相談させてください。最近の報道で海外ファンドによる大規模土地取得の可能性が示唆されていますが、それに関する情報があればお聞かせいただけますでしょうか。"}, {"step": 8, "kind": "consult", "consult_id": "Q0086", "by": "HH03", "to": "BR01", "question": "第7月にお送りしたP20の売却に関するご相談の件ですが、まだお返事をいただけておりません。今月から施行された「一定面積以上の土地取得に関する届出制度」の影響も踏まえ、状況をお聞かせいただけますでしょうか。"}, {"step": 8, "kind": "consult", "consult_id": "Q0087", "by": "HH06", "to": "BR01", "question": "第8月より施行された「一定面積以上の土地取得に関する届出制度」が、P07およびP23の活用・売却に具体的にどのような影響を与えるか、また、それらを踏まえた上での活用・売却に関する具体的な提案を改めてお聞かせください。"}, {"step": 8, "kind": "consult", "consult_id": "Q0088", "by": "HH08", "to": "BR01", "question": "第8月より施行された「一定面積以上の土地取得に関する届出制度」について、仲介業者の視点から、この条例が不動産市場、特にA市の取引にどのような影響を与えると見ていますか？また、100㎡超の取引における1ヶ月の遅延は、実際の取引プロセスにどのような変化をもたらすとお考えでしょうか？"}, {"step": 8, "kind": "consult", "consult_id": "Q0089", "by": "HH11", "to": "BR01", "question": "第8月施行の「一定面積以上の土地取得に関する届出制度」により、私の所有するP44（空地、140㎡）の取得はどのように遅延しますか？"}, {"step": 8, "kind": "consult", "consult_id": "Q0090", "by": "HH12", "to": "BR01", "question": "第8月施行の「一定面積以上の土地取得に関する届出制度」について、100㎡超の土地取得における1ヶ月の成立遅延が、今後の不動産取引に具体的にどのような影響を与えるか、また、この条例施行後のA市不動産市場の見通しについて、専門的な見解をお聞かせください。特に、私の所有物件（P13, P29, P45）への影響についてもご教示いただけますと幸いです。"}, {"step": 8, "kind": "consult", "consult_id": "Q0091", "by": "HH13", "to": "BR01", "question": "第8月より施行された「一定面積以上の土地取得に関する届出制度」により、私の所有物件（P14, P30, P46）は全て100㎡超のため、取得成立が1ヶ月遅延することになります。この制度施行が、これらの物件の活用、特に店舗物件の運用や住宅物件の売買にどのような影響を与えるか、具体的なアドバイスをいただけますでしょうか。また、この遅延を逆手に取った活用方法などがあれば、併せてご教示ください。"}, {"step": 8, "kind": "consult", "consult_id": "Q0092", "by": "HH15", "to": "BR02", "question": "「一定面積以上の土地取得に関する届出制度」の実際の適用状況について、現状を教えてください。また、海外資本の動向を踏まえ、私の所有物件（P16:450㎡、P32:450㎡）の売却可能性について、ご見解をお聞かせください。"}, {"step": 8, "kind": "consult", "consult_id": "Q0093", "by": "HH16", "to": "BR01", "question": "P17の活用方法について、条例施行による1ヶ月の遅延を踏まえた上で再度相談します。具体的にどのような活用が考えられますでしょうか。"}, {"step": 8, "kind": "publication", "by": "MD01", "headline": "【海外不動産投資ファンドへの注意喚起】新条例施行も、一部届出遅延確認されず", "body": "【海外不動産投資ファンドへの注意喚起】新条例施行も、一部届出遅延確認されず\n第8月より施行された「一定面積以上の土地取得に関する届出制度」は、1件あたり100㎡を超える土地の取得に対し、届出を義務付け、成立を1ヶ月遅延させるものです。この制度は、市内における大規模な土地取得の実態把握と、無秩序な不動産投資の抑制を目的としています。しかし、施行初月である今月、条例に該当する名義移転の届出および登記の遅延は確認されておりません。市当局は条例の周知に引き続き努めるとのことですが、一部で海外の不動産投資ファンドによる大規模な土地取得の動きが指摘されており、注意が必要です。特にR07が所有する1350㎡の土地についても、この制度の対象となるはずですが、現時点での動きは不透明です。市民の皆様におかれましても、土地の購入・売却の際には、制度の内容を十分に理解し、不明な点があれば市役所にご確認ください。", "about_acquisition": true}, {"step": 8, "kind": "investigate", "by": "MD02", "note": "land_registry"}, {"step": 8, "kind": "investigate", "by": "MU01", "note": "land_registry"}, {"step": 8, "kind": "ordinance", "by": "MU01", "title": "一定面積以上の土地取得に関する届出制度", "body": "1件あたり100㎡を超える土地の取得に対し、届出を義務付け、成立を1ヶ月遅延させる。", "threshold_sqm": 100, "delay_months": 1, "effective_step": 9}, {"step": 8, "kind": "public_statement", "by": "MU02", "note": "第8月施行「一定面積以上の土地取得に関する届出制度」について、現時点で条例の適用実績（届出による遅延成立）はありません。市内の不動産取引は通常通り行われています。"}, {"step": 8, "kind": "hold", "offer_id": "O0001", "parcel_id": "P18", "by": "HH01"}, {"step": 8, "kind": "hold", "offer_id": "O0002", "parcel_id": "P19", "by": "HH02"}, {"step": 8, "kind": "hold", "offer_id": "O0003", "parcel_id": "P20", "by": "HH03"}, {"step": 8, "kind": "hold", "offer_id": "O0005", "parcel_id": "P23", "by": "HH06"}, {"step": 8, "kind": "hold", "offer_id": "O0006", "parcel_id": "P24", "by": "HH07"}, {"step": 9, "kind": "advice", "consult_id": "Q0092", "by": "BR02", "to": "HH15", "reply": "R15様\n「一定面積以上の土地取得に関する届出制度」につきまして、第8月時点では、条例に該当する届出や登記の遅延は確認されておりません。行政発表によりますと、市内の不動産取引は通常通り行われているとのことです。しかしながら、一部報道では、海外の不動産投資ファンドによる大規模な土地取得の動きが指摘されており、注意が必要です。特にR07区画（1350㎡）についても、この制度の対象となるはずですが、現時点での動きは不透明な状況です。\n\nご所有の物件（P16:450㎡、P32:450㎡）の売却可能性については、現時点では制度による直接的な遅延は確認されておりませんが、海外資本の動向は今後の市場に影響を与える可能性がございます。引き続き、行政の発表や市場の動向を注視し、最新の情報が入り次第、速やかにご報告いたします。ご不明な点がございましたら、お気軽にお問い合わせください。"}, {"step": 9, "kind": "consult", "consult_id": "Q0094", "by": "BZ03", "to": "BR01", "question": "第8月施行「一定面積以上の土地取得に関する届出制度」について、回答ありがとうございます。条例施行後、特に100㎡超の土地取得に関する遅延が実際の取引にどのような影響を与えているか、具体的な事例があれば教えていただけますでしょうか。また、中長期的な不動産市場の見通しについても、ご意見を伺えると幸いです。"}, {"step": 9, "kind": "consult", "consult_id": "Q0095", "by": "BZ04", "to": "BR01", "question": "第9月施行の「一定面積以上の土地取得に関する届出制度」について、告示と行政発表の食い違いが気になっています。この条例施行が不動産取引にどのような影響を与えているか、また、もし何か動きがあれば教えていただけますでしょうか？"}, {"step": 9, "kind": "consult", "consult_id": "Q0096", "by": "HH01", "to": "BR01", "question": "P18の取得申し入れ（O0001）への対応状況と、P18およびP02の活用について、具体的な提案をいただけますでしょうか。また、海外ファンドによる土地取得の動きについて、何か情報をお持ちでしたらお聞かせください。"}, {"step": 9, "kind": "consult", "consult_id": "Q0097", "by": "HH03", "to": "BR01", "question": "先月相談したP20の件について、回答を催促します。また、今月から施行された「一定面積以上の土地取得に関する届出制度」が、この件にどのような影響を与えるか、特に遅延の有無について確認させてください。"}, {"step": 9, "kind": "consult", "consult_id": "Q0098", "by": "HH06", "to": "BR01", "question": "第9月より施行された「一定面積以上の土地取得に関する届出制度」が、私の所有するP07とP23の土地の活用・売却に具体的にどのような影響を与えるか、また、それらを踏まえた具体的な提案をお聞かせください。"}, {"step": 9, "kind": "consult", "consult_id": "Q0099", "by": "HH08", "to": "BR01", "question": "第9月施行の「一定面積以上の土地取得に関する届出制度」について、仲介業者の視点から見た市場への影響と、今後の取引の見通しについて具体的に教えてください。"}, {"step": 9, "kind": "consult", "consult_id": "Q0100", "by": "HH11", "to": "BR01", "question": "第9月施行の「一定面積以上の土地取得に関する届出制度」について、私の所有するP44（空地、140㎡）の取得にどのような影響がありますか？また、市役所発表の「現時点で条例の適用実績はない」という情報は、私のP44の取得遅延にどう関係しますか？"}, {"step": 9, "kind": "consult", "consult_id": "Q0101", "by": "HH12", "to": "BR01", "question": "第9月施行の「一定面積以上の土地取得に関する届出制度」について、私の所有物件（180㎡）への具体的な影響と、今後の不動産市場の見通しについて、見解をお聞かせください。特に、この制度が取引に与える遅延や、将来的な価格への影響について懸念しています。"}, {"step": 9, "kind": "consult", "consult_id": "Q0102", "by": "HH13", "to": "BR01", "question": "第9月より施行された「一定面積以上の土地取得に関する届出制度」について、私の所有物件（P14, P30, P46）は全て100㎡超ですが、この制度が今後の取引や活用にどのような影響を与えるか、具体的なアドバイスをいただけますでしょうか。特に、店舗物件の活用や住宅物件の売買について、この遅延をどのように見れば良いか、あるいは活用できる余地があるかを知りたいです。"}, {"step": 9, "kind": "consult", "consult_id": "Q0103", "by": "HH15", "to": "BR02", "question": "第9月より施行されている「一定面積以上の土地取得に関する届出制度」について、実際の運用状況を教えてください。特に、私の所有物件（P16, P32）の売却可能性にどのような影響があるか、また海外の不動産投資ファンドの動向と合わせてご見解をお聞かせください。"}, {"step": 9, "kind": "consult", "consult_id": "Q0104", "by": "HH16", "to": "BR01", "question": "P17（70㎡の空地）の活用方法について、第9月施行の「一定面積以上の土地取得に関する届出制度」が周辺の土地取引に与える間接的な影響も踏まえて、改めてご相談させてください。"}, {"step": 9, "kind": "publication", "by": "MD01", "headline": "【続報】「一定面積以上の土地取得に関する届出制度」活用は？　高額不動産取得への影響と海外投資の実態", "body": "【続報】「一定面積以上の土地取得に関する届出制度」活用は？　高額不動産取得への影響と海外投資の実態\n先月施行された「一定面積以上の土地取得に関する届出制度」について、現時点での適用実績は確認されていない。この制度は100㎡超の土地取得に対し、届出を義務付け、成立を1ヶ月遅延させるものだが、市内の不動産取引は通常通り行われているという。しかし、本紙が前月より追跡しているR07氏名義の1350㎡の土地取得案件においては、登記統計と公開法人記録から、海外の不動産投資ファンドによる取得の可能性が依然として高いと見られる。これらのファンドは、S投資控股を親会社とするA社、B社、D社、そしてX社などが含まれる。これらの取得が制度の対象となるか、今後の動向を注視していく必要がある。制度の趣旨は、こうした高額不動産取得に対する透明性の確保と、地域経済への影響を考慮したものである。市民への制度周知と、海外か", "about_acquisition": true}, {"step": 9, "kind": "investigate", "by": "MD02", "note": "land_registry"}, {"step": 9, "kind": "investigate", "by": "MU01", "note": "land_registry"}, {"step": 9, "kind": "investigate", "by": "MU02", "note": "land_registry"}, {"step": 9, "kind": "public_statement", "by": "MU02", "note": "第9月、一定面積以上の土地取得に関する届出制度の施行初月において、条例に該当する名義移転の遅延は確認されませんでした。引き続き、制度の周知に努めてまいります。"}, {"step": 9, "kind": "hold", "offer_id": "O0001", "parcel_id": "P18", "by": "HH01"}, {"step": 9, "kind": "hold", "offer_id": "O0002", "parcel_id": "P19", "by": "HH02"}, {"step": 9, "kind": "hold", "offer_id": "O0003", "parcel_id": "P20", "by": "HH03"}, {"step": 9, "kind": "hold", "offer_id": "O0005", "parcel_id": "P23", "by": "HH06"}, {"step": 9, "kind": "hold", "offer_id": "O0006", "parcel_id": "P24", "by": "HH07"}, {"step": 10, "kind": "advice", "consult_id": "Q0103", "by": "BR02", "to": "HH15", "reply": "R15様\n\n第9月より施行されております「一定面積以上の土地取得に関する届出制度」につきまして、現時点（第10月）での運用状況をご報告いたします。\n\n行政（G02）からの発表によりますと、施行初月である第9月において、この制度に該当する名義移転の遅延は確認されておりません。取引は通常通り行われているとのことです。\n\n一方で、一部報道（J01）では、海外の不動産投資ファンドによる市内複数区画の土地取得の可能性が報じられております。特にR07区画に関する案件について、海外ファンド（S投資控股関連のA社、B社、D社、X社など）による取得の可能性が依然として指摘されています。これらの取得が制度の対象となるか、今後の動向が注視されております。\n\nお客様の所有物件（P16, P32）につきましては、現時点ではこの制度による直接的な売却への影響はございません。しかしながら、海外ファンドの動向によっては、"}, {"step": 10, "kind": "consult", "consult_id": "Q0105", "by": "BZ02", "to": "BR01", "question": "先月施行された「一定面積以上の土地取得に関する届出制度」について、施行初月に遅延が確認されなかったという報道がありますが、実際の運用状況はどうなっていますでしょうか。また、R07氏名義の1350㎡の土地取得案件についても、何かご存知でしたらお聞かせください。"}, {"step": 10, "kind": "consult", "consult_id": "Q0106", "by": "BZ03", "to": "BR01", "question": "条例施行後の市場動向、特に100㎡超の土地取得に関する遅延が取引に与える影響、そして長期的な不動産市場の見通しについて、具体的な取引事例などを交えてご意見を伺いたいです。"}, {"step": 10, "kind": "consult", "consult_id": "Q0107", "by": "BZ04", "to": "BR01", "question": "第8月にお送りした相談（Q0050）について、ご回答はいただけていますでしょうか。また、先日施行された「一定面積以上の土地取得に関する届出制度」について、条例では100㎡超の土地取得に1ヶ月の遅延が生じるとされていますが、行政発表では遅延は確認されていないとのこと、この食い違いについてご存知のことがあれば教えていただけますでしょうか。もし、駅前地区などで会員獲得につながりそうな物件があれば、その状況についても併せてお伺いできれば幸いです。"}, {"step": 10, "kind": "consult", "consult_id": "Q0108", "by": "HH01", "to": "BR01", "question": "P18の取得申し入れ（O0001）への対応状況について、具体的な提案をお聞かせください。また、最近報道されている海外ファンドによる土地取得の動向について、何か情報をお持ちでしたらお教えいただけますでしょうか。P02の活用についても、併せてご相談させてください。"}, {"step": 10, "kind": "consult", "consult_id": "Q0109", "by": "HH06", "to": "BR01", "question": "第9月施行の「一定面積以上の土地取得に関する届出制度」について、現時点で条例の適用実績（届出による遅延成立）はありません。市内の不動産取引は通常通り行われています。この状況を踏まえ、BR01に条例施行によるP07とP23への具体的な影響と、それらを踏まえた活用・売却の提案を再度求める。"}, {"step": 10, "kind": "consult", "consult_id": "Q0110", "by": "HH08", "to": "BR01", "question": "第9月施行の「一定面積以上の土地取得に関する届出制度」について、実際の不動産取引への影響と、仲介業者としての見解をお聞かせください。"}, {"step": 10, "kind": "consult", "consult_id": "Q0111", "by": "HH10", "to": "BR01", "question": "一定面積以上の土地取得に関する届出制度の施行状況と、それが地域経済や土地取引に与える具体的な影響について教えてください。"}, {"step": 10, "kind": "consult", "consult_id": "Q0112", "by": "HH11", "to": "BR01", "question": "第9月施行の「一定面積以上の土地取得に関する届出制度」について、貴社では条例適用による取得遅延の事例は確認されておりますでしょうか。市役所発表では延期事例なしとのことですが、私の所有するP44（空地、140㎡）の取得に影響はありますでしょうか。"}, {"step": 10, "kind": "consult", "consult_id": "Q0113", "by": "HH12", "to": "BR01", "question": "第9月施行の「一定面積以上の土地取得に関する届出制度」について、私の所有物件（P13, P29, P45）への具体的な影響と、今後の不動産取引への見通しについて、改めてご教示いただけますでしょうか。特に、取得届出による取引の遅延の可能性について懸念しております。"}, {"step": 10, "kind": "consult", "consult_id": "Q0114", "by": "HH13", "to": "BR01", "question": "第9月施行の「一定面積以上の土地取得に関する届出制度」について、行政からの情報では施行初月に名義移転の遅延は確認されていないとのことですが、私の所有物件（P14, P30, P46）は全て100㎡超であり、制度上は成立が1ヶ月遅延するはずだと理解していました。この状況について、制度の実際の運用状況と、私の物件への影響を詳しく教えていただけますでしょうか。また、この遅延がない（または異なる）状況下で、私の店舗物件（P14, P30）や住宅物件（P46）の活用や売買について、どのような戦略が考えられるか、具体的なアドバイスをお願いします。"}, {"step": 10, "kind": "consult", "consult_id": "Q0115", "by": "HH15", "to": "BR02", "question": "第9月施行の「一定面積以上の土地取得に関する届出制度」について、施行から1ヶ月が経過した現時点での市場の動向、特に海外ファンドの具体的な動きや、それらが私の物件（P16, P32）に与えうる影響について、より詳細な見解をお聞かせください。また、R07氏名義の土地取得案件の進捗状況と、それが私の物件周辺地域に与える影響についてもご教示いただけますでしょうか。"}, {"step": 10, "kind": "consult", "consult_id": "Q0116", "by": "HH16", "to": "BR01", "question": "P17（70㎡）の活用について、第9月施行の「一定面積以上の土地取得に関する届出制度」の施行状況や、間接的な影響についてご意見を伺いたいです。"}, {"step": 10, "kind": "investigate", "by": "MD01", "note": "land_registry"}, {"step": 10, "kind": "publication", "by": "MD01", "headline": "【続報】「一定面積以上の土地取得に関する届出制度」施行初月の動向", "body": "【続報】「一定面積以上の土地取得に関する届出制度」施行初月の動向\n第9月より施行された「一定面積以上の土地取得に関する届出制度」について、施行初月である第9月において、条例に該当する名義移転の遅延は確認されませんでした。本制度は100㎡超の土地取得に対し、成立を1ヶ月遅延させるものですが、現状、その効果が期待通りに現れていない可能性があります。特に、大規模な土地保有が続くR07（1350㎡）の動向には引き続き注目が必要です。海外からの不動産投資による影響も懸念される中、制度の実効性について更なる検証が求められます。", "about_acquisition": true}, {"step": 10, "kind": "investigate", "by": "MD02", "note": "land_registry"}, {"step": 10, "kind": "investigate", "by": "MU02", "note": "land_registry"}, {"step": 10, "kind": "public_statement", "by": "MU02", "note": "「一定面積以上の土地取得に関する届出制度」について、施行初月（第9月）において、届出による成立の遅延は確認されませんでした。引き続き、制度の周知と適正な運用に努めてまいります。"}, {"step": 10, "kind": "hold", "offer_id": "O0001", "parcel_id": "P18", "by": "HH01"}, {"step": 10, "kind": "hold", "offer_id": "O0002", "parcel_id": "P19", "by": "HH02"}, {"step": 10, "kind": "hold", "offer_id": "O0003", "parcel_id": "P20", "by": "HH03"}, {"step": 10, "kind": "hold", "offer_id": "O0005", "parcel_id": "P23", "by": "HH06"}, {"step": 10, "kind": "hold", "offer_id": "O0006", "parcel_id": "P24", "by": "HH07"}, {"step": 11, "kind": "advice", "consult_id": "Q0105", "by": "BR01", "to": "BZ02", "reply": "T02様、お問い合わせありがとうございます。「一定面積以上の土地取得に関する届出制度」の施行初月（第9月）において、報道や行政発表では名義移転の遅延は確認されていないとのことですが、これはあくまで公式発表上の話であり、実際の取引プロセスにおいては、届出の提出や確認に一定の時間を要している可能性が考えられます。また、R07氏名義の1350㎡の土地取得案件につきましては、現時点で公開されている登記情報からは具体的な進展は確認できておりません。今後の動向を注視してまいります。"}, {"step": 11, "kind": "advice", "consult_id": "Q0106", "by": "BR01", "to": "BZ03", "reply": "T03様、ご質問ありがとうございます。条例施行後の市場動向についてですが、100㎡超の土地取得における1ヶ月の遅延という告示にも関わらず、施行初月（第9月）においては遅延が確認されていないという報道が多く見られます。この乖離は、制度の周知期間や、実際の届出件数、行政の審査体制など、様々な要因が考えられます。現時点では、取引スピードに顕著な影響が出ているというよりは、むしろ制度の実効性そのものが問われている状況と言えるかもしれません。長期的な不動産市場の見通しについては、今後の条例の運用状況や、海外からの投資動向なども注視しながら、慎重に見極めていく必要があります。"}, {"step": 11, "kind": "advice", "consult_id": "Q0107", "by": "BR01", "to": "BZ04", "reply": "T04様、第8月のご相談（Q0050）につきましては、確認いたします。また、「一定面積以上の土地取得に関する届出制度」の行政発表と条例の規定との食い違いについてですが、これは制度施行初期によく見られる現象です。条例では100㎡超の土地取得に1ヶ月の遅延が規定されていますが、行政発表で遅延が確認されていないというのは、現時点では該当する届出がまだ処理段階にあるか、あるいは何らかの理由で遅延が発生していないケースがあることを示唆しています。駅前地区での物件情報については、現在も継続して収集しております。何か具体的な条件があれば、お聞かせください。"}, {"step": 11, "kind": "advice", "consult_id": "Q0108", "by": "BR01", "to": "HH01", "reply": "R01様、P18の取得申し入れ（O0001）への対応状況について、詳細な提案を検討しております。少々お時間をいただけますでしょうか。海外ファンドによる土地取得の動向については、報道で一部見聞きしておりますが、具体的な案件や規模については、現時点では確かな情報がございません。今後の動向を注視してまいります。P02の活用についても、併せて検討させていただきます。"}, {"step": 11, "kind": "advice", "consult_id": "Q0109", "by": "BR01", "to": "HH06", "reply": "R06様、第9月施行の「一定面積以上の土地取得に関する届出制度」について、現時点で条例の適用実績（届出による遅延成立）がないという状況は承知しております。この状況を踏まえ、P07とP23への具体的な影響としては、現時点では取引が通常通り行われているため、直接的な影響は限定的と考えられます。しかし、制度の趣旨や今後の運用によっては、状況が変わる可能性もございます。活用・売却の提案については、引き続き検討させていただきます。"}, {"step": 11, "kind": "advice", "consult_id": "Q0110", "by": "BR01", "to": "HH08", "reply": "R08様、第9月施行の「一定面積以上の土地取得に関する届出制度」について、実際の不動産取引への影響は、現時点では報道や行政発表を見る限り、顕著な遅延は確認されていないようです。しかし、制度の趣旨である「1ヶ月の遅延」が、今後の取引プロセスにどのように影響していくかは注視が必要です。仲介業者としては、お客様への正確な情報提供と、円滑な取引のサポートに努めてまいります。"}, {"step": 11, "kind": "advice", "consult_id": "Q0115", "by": "BR02", "to": "HH15", "reply": "R15様、第10月のご相談についてご回答いたします。第9月より施行されております「一定面積以上の土地取得に関する届出制度」につきまして、施行初月（第9月）における条例に該当する名義移転の遅延は、現時点では確認されておりません。これは、行政発表（G02）および報道（J01）でも同様に報告されております。海外ファンドの具体的な動きにつきましては、現時点では弊社の把握している範囲や公開されている情報からは、具体的な動きを特定することは困難でございます。R07氏名義の土地取得案件につきましても、公開されている登記情報以上の進捗は把握しておりません。お客様の物件（P16、P32）への直接的な影響は、現時点では制度による遅延などはございませんが、今後の海外資本の動向によっては、不動産市場全体に影響が出る可能性もございます。引き続き、市場の動向を注視してまいります。"}, {"step": 11, "kind": "consult", "consult_id": "Q0117", "by": "BZ03", "to": "BR01", "question": "「一定面積以上の土地取得に関する届出制度」施行後の市場動向、特に100㎡超の土地取得に関する遅延が取引に与える影響、そして長期的な不動産市場の見通しについて、具体的な事例があれば教えていただきたいです。"}, {"step": 11, "kind": "consult", "consult_id": "Q0118", "by": "BZ04", "to": "BR01", "question": "第8月にお送りしたQ0050のご回答はまだでしょうか。また、第9月施行の「一定面積以上の土地取得に関する届出制度」について、条例では100㎡超の土地取得に1ヶ月の遅延が生じるとされていますが、行政発表では適用実績がないとのこと、この食い違いについてご存知でしたら教えていただけますでしょうか。もし、駅前地区などで会員獲得につながりそうな物件がございましたら、その詳細もお伺いできれば幸いです。"}, {"step": 11, "kind": "consult", "consult_id": "Q0119", "by": "HH01", "to": "BR01", "question": "P18の取得申し入れへの対応状況と、P18およびP02の活用について、具体的な提案を改めて求めたい。また、報道されている海外ファンドの動向についても、もし情報を掴んでいれば教えてほしい。"}, {"step": 11, "kind": "consult", "consult_id": "Q0120", "by": "HH06", "to": "BR01", "question": "第9月施行の「一定面積以上の土地取得に関する届出制度」について、P07およびP23への影響と、それらを踏まえた活用・売却の提案について、改めてご相談させてください。施行初月の遅延は確認されていないとのことですが、今後の運用について懸念しております。P23への取得申し入れ(O0005)は引き続き「hold」を継続いたします。"}, {"step": 11, "kind": "consult", "consult_id": "Q0121", "by": "HH08", "to": "BR01", "question": "第9月から相談している「一定面積以上の土地取得に関する届出制度」について、施行から数ヶ月経ちましたが、仲介業者の視点から見て、実際の不動産取引にどのような影響が出ているか、具体的な見解を伺えますでしょうか。特に、私の所有物件（P09, P25, P41）のようなケースで、取得希望があった場合に、この制度がどのように作用するのかを知りたいです。"}, {"step": 11, "kind": "consult", "consult_id": "Q0122", "by": "HH10", "to": "BR01", "question": "「一定面積以上の土地取得に関する届出制度」施行後、数ヶ月経過しましたが、実際の不動産取引において、制度による遅延や取引条件への影響など、具体的な変化は観測されていますでしょうか？"}, {"step": 11, "kind": "consult", "consult_id": "Q0123", "by": "HH11", "to": "BR01", "question": "第9月施行の「一定面積以上の土地取得に関する届出制度」について、市役所（G02）の発表では施行初月において成立の遅延は確認されなかったとのことですが、私の所有するP44（空地、140㎡）は制度の対象であり、本来なら取得が1ヶ月遅延するはずでした。この制度の適用状況と、私のP44の取得への影響について、改めてご教示いただけますでしょうか。"}, {"step": 11, "kind": "consult", "consult_id": "Q0124", "by": "HH12", "to": "BR02", "question": "9月から施行された「一定面積以上の土地取得に関する届出制度」について、私の所有する180㎡の住宅用地への影響と、この制度下での不動産取引の一般的な流れや注意点について教えてください。"}, {"step": 11, "kind": "consult", "consult_id": "Q0125", "by": "HH13", "to": "BR01", "question": "「一定面積以上の土地取得に関する届出制度」について、施行初月（第9月）において、届出による成立の遅延が確認されていないとのことですが、私の所有物件（P14, P30, P46）は全て100㎡超であり、本来なら1ヶ月の遅延が発生するはずでした。この制度の実際の運用状況と、私の物件への具体的な影響、そして今後の活用戦略について、改めてご教示いただけますでしょうか。"}, {"step": 11, "kind": "consult", "consult_id": "Q0126", "by": "HH15", "to": "BR02", "question": "第9月より施行されております「一定面積以上の土地取得に関する届出制度」につきまして、施行から1ヶ月以上経過した現時点（第11月）での市場の動向、特に海外ファンドの具体的な動きや、それらが私の物件（P16, P32）に与えうる影響について、より踏み込んだ見解をお聞かせいただけますでしょうか。また、R07氏名義の土地取得案件の進捗状況と、それが私の物件の周辺地域に与える影響についても確認したいです。"}, {"step": 11, "kind": "consult", "consult_id": "Q0127", "by": "HH16", "to": "BR01", "question": "P17（70㎡）の活用について、第9月施行の「一定面積以上の土地取得に関する届出制度」の施行状況を踏まえ、改めてご相談させていただけますでしょうか。条例施行による間接的な影響も考慮して、今後の活用方法についてアドバイスを頂戴できれば幸いです。"}, {"step": 11, "kind": "investigate", "by": "MD01", "note": "land_registry"}, {"step": 11, "kind": "publication", "by": "MD01", "headline": "【A市】「一定面積以上の土地取得に関する届出制度」の現状と海外投資への懸念", "body": "【A市】「一定面積以上の土地取得に関する届出制度」の現状と海外投資への懸念\n第9月より施行された「一定面積以上の土地取得に関する届出制度」について、施行初月である第10月において、制度による成立の遅延は確認されませんでした。しかし、一定規模以上の土地取得を対象とする本制度が、海外からの不動産投資の抑制にどの程度寄与しているかについては、依然として不透明な部分が残されています。特に、R07氏が所有する1350㎡の土地をはじめ、海外法人名義での保有面積の動向には引き続き注視が必要です。制度の抜け穴や、制度施行前の駆け込み的な取得がないか、今後も登記情報の詳細な分析が求められます。市民の皆様におかれましても、本制度の趣旨をご理解いただき、地域経済への影響について関心をお寄せいただければ幸いです。本紙では、引き続き制度の運用状況と、海外からの不動産投資動向について取材してまいります。", "about_acquisition": true}, {"step": 11, "kind": "investigate", "by": "MD02", "note": "land_registry"}, {"step": 11, "kind": "investigate", "by": "MU02", "note": "land_registry"}, {"step": 11, "kind": "public_statement", "by": "MU02", "note": "第9月施行「一定面積以上の土地取得に関する届出制度」の適用状況について、施行初月（第9月）において、条例に該当する名義移転の遅延は確認されませんでした。引き続き、制度の実効性について注視してまいります。"}, {"step": 11, "kind": "hold", "offer_id": "O0001", "parcel_id": "P18", "by": "HH01"}, {"step": 11, "kind": "hold", "offer_id": "O0002", "parcel_id": "P19", "by": "HH02"}, {"step": 11, "kind": "hold", "offer_id": "O0003", "parcel_id": "P20", "by": "HH03"}, {"step": 11, "kind": "hold", "offer_id": "O0005", "parcel_id": "P23", "by": "HH06"}, {"step": 11, "kind": "hold", "offer_id": "O0006", "parcel_id": "P24", "by": "HH07"}, {"step": 12, "kind": "advice", "consult_id": "Q0126", "by": "BR02", "to": "HH15", "reply": "R15様\n\n第9月より施行されております「一定面積以上の土地取得に関する届出制度」につきまして、お問い合わせいただきありがとうございます。施行から1ヶ月以上経過した現時点（第11月）での市場の動向について、ご説明いたします。\n\nまず、施行初月（第10月）において、条例に該当する名義移転の遅延は確認されておりません。これは、G02行政からの発表およびJ01記者の報道でも示されている通りです。海外ファンドの具体的な動きについては、現時点では公開されている登記情報や、私どもの仲介業者の範囲では、具体的な把握には至っておりません。R07氏名義の土地取得案件につきましても、公開されている登記情報以上の進捗は把握しておりません。\n\nお客様の物件（P16, P32）への直接的な影響は、本制度による取引の遅延等はないものと考えられます。しかしながら、海外資本の動向は市場全体に影響を与える可能性がございます"}, {"step": 12, "kind": "advice", "consult_id": "Q0124", "by": "BR02", "to": "HH12", "reply": "R12様\n\n「一定面積以上の土地取得に関する届出制度」についてお問い合わせいただき、ありがとうございます。お客様の所有する180㎡の住宅用地への影響についてご説明いたします。\n\n本制度の対象は1件100㎡超の土地取得となりますので、お客様の180㎡の住宅用地も制度の対象となります。取引の際には、所定の届出が必要となります。\n\n不動産取引の一般的な流れとしては、売買契約締結後、買主様が一定面積以上の土地を取得する場合、所定の届出書を行政へ提出していただきます。届出を受けた行政は、その内容を審査し、必要に応じて助言等を行います。届出の成立をもって、登記手続きに進むことができます。\n\n注意点としましては、届出書類に不備がないよう正確に記載すること、そして届出の受付・審査に時間を要する可能性があることを念頭に置いていただくことです。取引の際には、事前に不動産仲介業者にご相談いただくことをお勧めいた"}, {"step": 12, "kind": "consult", "consult_id": "Q0128", "by": "BZ01", "to": "BR01", "question": "第2月にお伺いしたP02の产权に関する件ですが、その後いかがでしょうか。進展がございましたらご教示いただけますと幸いです。"}, {"step": 12, "kind": "consult", "consult_id": "Q0129", "by": "BZ04", "to": "BR01", "question": "第8月のご相談（Q0050）への回答状況と、9月施行の「一定面積以上の土地取得に関する届出制度」における条例規定と行政発表の食い違いについての見解、および駅前地区でコワーキングスペース事業展開に適した物件（空き店舗、遊休不動産等）の情報について、詳細をお聞かせください。"}, {"step": 12, "kind": "consult", "consult_id": "Q0130", "by": "HH01", "to": "BR01", "question": "P18の取得申し入れ（O0001）について、具体的な提案と回答期限についてお伺いします。また、P02の活用についても、具体的な提案をお願いします。最近の海外ファンドの動向について、何か掴んでいる情報があればお教えください。"}, {"step": 12, "kind": "consult", "consult_id": "Q0131", "by": "HH04", "to": "BR02", "question": "自宅P05の売却について相談したいのですが、可能でしょうか。"}, {"step": 12, "kind": "consult", "consult_id": "Q0132", "by": "HH06", "to": "BR01", "question": "第9月施行の「一定面積以上の土地取得に関する届出制度」について、現時点での条例適用実績（届出による遅延成立）がない状況を踏まえ、P07とP23への具体的な影響と、引き続き検討いただいている活用・売却の提案について、改めてご意見をお聞かせいただけますでしょうか。"}, {"step": 12, "kind": "consult", "consult_id": "Q0133", "by": "HH08", "to": "BR01", "question": "第9月施行の「一定面積以上の土地取得に関する届出制度」について、実際の不動産取引への影響や、仲介業者としての見解をお聞かせください。施行から数ヶ月経ちましたが、制度による遅延や、今後の取引プロセスへの影響など、具体的な情報があれば幸いです。"}, {"step": 12, "kind": "consult", "consult_id": "Q0134", "by": "HH10", "to": "BR01", "question": "「一定面積以上の土地取得に関する届出制度」施行から数ヶ月経過しましたが、仲介業者として、この制度が実際の不動産取引にどのような影響を与えていると感じていますか？特に、名義移転の遅延や、取引件数への影響など、具体的な事例があれば教えていただきたいです。また、制度施行後の物件価格への影響についても、見解があればお聞かせください。"}, {"step": 12, "kind": "consult", "consult_id": "Q0135", "by": "HH11", "to": "BR01", "question": "第9月施行の「一定面積以上の土地取得に関する届出制度」について、市役所発表では9月中の届出による遅延は確認されなかったとのことですが、私の所有するP44（空地、140㎡）は100㎡超の取得に該当し、本来であれば取得が1ヶ月遅延するはずです。この制度の適用状況と、私のP44の取得への影響について、改めてご教示いただけますでしょうか。"}, {"step": 12, "kind": "consult", "consult_id": "Q0136", "by": "HH13", "to": "BR01", "question": "第9月施行「一定面積以上の土地取得に関する届出制度」について、行政発表と私の理解との間に乖離があるように感じています。制度の実際の運用状況、私の物件（P14, P30, P46）への具体的な影響、そして今後の活用戦略について、詳細なご説明とアドバイスをいただけますでしょうか。"}, {"step": 12, "kind": "consult", "consult_id": "Q0137", "by": "HH16", "to": "BR01", "question": "P17（70㎡、空地、湾岸観光地区）の活用について、具体的な事業提案や活用方法について、より詳細なアドバイスをいただけますでしょうか。以前から相談させていただいていますが、進展がないため、貴社から具体的なご提案をいただけると幸いです。"}, {"step": 12, "kind": "investigate", "by": "MD01", "note": "land_registry"}, {"step": 12, "kind": "publication", "by": "MD01", "headline": "【A市】「一定面積以上の土地取得に関する届出制度」の実効性に疑問符 制度適用外での取引か", "body": "【A市】「一定面積以上の土地取得に関する届出制度」の実効性に疑問符 制度適用外での取引か\n第9月より施行された「一定面積以上の土地取得に関する届出制度」について、その実効性が問われている。本制度は100㎡超の土地取得に対し、1か月の届出期間による成立の遅延を設けているが、施行から3か月が経過した現在も、条例に該当する名義移転の遅延は確認されていない。特に、条例対象となりうる1350㎡の土地（R07）の所有権に変動が見られないことは、当初懸念されていた海外の不動産投資ファンドによる土地取得が、制度の抜け穴を突く形で行われた、あるいは制度適用外での取引が行われた可能性を示唆している。今後も制度の実効性について注視するとともに、海外からの不動産投資に対する透明性の確保が求められる。", "about_acquisition": true}, {"step": 12, "kind": "investigate", "by": "MD02", "note": "land_registry"}, {"step": 12, "kind": "public_statement", "by": "MU01", "note": "第9月より施行された「一定面積以上の土地取得に関する届出制度」について、施行から2ヶ月が経過しましたが、現在まで条例に該当する名義移転の遅延は確認されておりません。本制度は、一定面積以上の土地取得を対象としており、地域経済への影響を考慮したものです。引き続き、制度の実効性について注視してまいります。"}, {"step": 12, "kind": "investigate", "by": "MU02", "note": "land_registry"}, {"step": 12, "kind": "public_statement", "by": "MU02", "note": "第12月において、「一定面積以上の土地取得に関する届出制度」に基づく名義移転の遅延は確認されませんでした。今後も制度の運用状況を注視してまいります。"}, {"step": 12, "kind": "hold", "offer_id": "O0001", "parcel_id": "P18", "by": "HH01"}, {"step": 12, "kind": "hold", "offer_id": "O0002", "parcel_id": "P19", "by": "HH02"}, {"step": 12, "kind": "filing_required", "offer_id": "O0003", "parcel_id": "P20", "by": "HH03", "buyer": "AQ01", "due_step": 13, "ordinance": "一定面積以上の土地取得に関する届出制度"}, {"step": 12, "kind": "hold", "offer_id": "O0005", "parcel_id": "P23", "by": "HH06"}, {"step": 12, "kind": "hold", "offer_id": "O0006", "parcel_id": "P24", "by": "HH07"}], "agents": [{"id": "HH01", "name": "R01", "role": "household"}, {"id": "HH02", "name": "R02", "role": "household"}, {"id": "HH03", "name": "R03", "role": "household"}, {"id": "HH04", "name": "R04", "role": "household"}, {"id": "HH05", "name": "R05", "role": "household"}, {"id": "HH06", "name": "R06", "role": "household"}, {"id": "HH07", " function lineChart(svg,series,opts){
 const W=900,H=260,L=54,R=168,T=18,B=34;
 const xs=i=>L+(W-L-R)*(nSteps<=1?0:i/nSteps);
 const ymax=opts.ymax!=null?opts.ymax:Math.max(0.0001,...series.flatMap(s=>s.data.filter(v=>v!=null)));
 const ys=v=>H-B-(H-T-B)*(v/ymax);
 let g=`<rect x="0" y="0" width="${W}" height="${H}" fill="#fff"/>`;
 for(let t=0;t<=4;t++){const v=ymax*t/4,y=ys(v);
  g+=`<line x1="${L}" y1="${y}" x2="${W-R}" y2="${y}" stroke="#E5E7EB"/>`
    +`<text x="${L-8}" y="${y+4}" text-anchor="end" font-size="11" fill="#6B7280">${opts.fmt(v)}</text>`;}
 for(let s=0;s<=nSteps;s+=Math.max(1,Math.round(nSteps/12)))
  g+=`<text x="${xs(s)}" y="${H-12}" text-anchor="middle" font-size="11" fill="#6B7280">${s}</text>`;
 (opts.marks||[]).forEach(mk=>{const x=xs(mk.step);
  g+=`<line x1="${x}" y1="${T}" x2="${x}" y2="${H-B}" stroke="${mk.color}" stroke-dasharray="4 3"/>`
    +`<text x="${x+4}" y="${T+12}" font-size="11" font-weight="700" fill="${mk.color}">${esc(mk.label)}</text>`;});
 series.forEach((s,si)=>{
  let d="",started=false;
  s.data.forEach((v,i)=>{ if(v==null)return; const x=xs(i+1),y=ys(v);
   d+=(started?"L":"M")+x+" "+y+" "; started=true;});
  g+=`<path d="${d}" fill="none" stroke="${s.color}" stroke-width="2.5"/>`
    +`<text x="${W-R+8}" y="${T+16+si*18}" font-size="12" font-weight="700" fill="${s.color}">${esc(s.label)}</text>`;});
 g+=`<line x1="${L}" y1="${H-B}" x2="${W-R}" y2="${H-B}" stroke="#111827"/>`
   +`<text x="${W-R}" y="${H-2}" text-anchor="end" font-size="11" fill="#6B7280">経過月</text>`;
 svg.innerHTML=g;
}

],{ymax:1,fmt:v=>(v*100).toFixed(0)+"%",marks});
lineChart($("#ch2"),[
 {label:"③ 誘発売却(累積)",color:"#059669",data:D.kpi.map(r=>r.cascade_induced)},
 {label:"営業中の店舗数",color:"#2563EB",data:D.kpi.map(r=>r.shops_occupied)},

],{fmt:v=>v.toFixed(0),marks});

/* ---------- クロニクル用: イベントの分類と要約 ---------- */
const CATS=[["deal","成約"],["nego","申し入れ"],["list","売出"],
 ["media","報道"],["gov","自治体"],["exit","退出・廃業"],["talk","発言"],
 ["fail","不成立"],["idle","静観"]];
function cat(e){
 if(!e.ok) return "fail";
 const o=e.outcome;
 if(o==="transfer") return "deal";
 if(o==="offer"||o==="counter"||o==="withdraw") return "nego";
 if(o==="listing"||o==="unlist") return "list";
 if(o==="rent_change"||o==="rent_negotiation"||o==="redevelop") return "rent";
 if(o==="publication") return "media";
 if(o==="ordinance"||o==="ordinance_study"||o==="request_report") return "gov";
 if(o==="move_out"||o==="business_closed"||o==="relocate") return "exit";
 if(e.action==="investigate"||e.action==="public_statement") return "gov";
 if(e.utterance) return "talk";
 return "idle";
}
const P=pid=>`<span class="pill" data-pid="${pid}">${pid}</span>`;
function summary(e){
 const t=e.target;
 switch(e.action){
  case "make_offer": return `${P(t)} に取得を申し入れ（名義「${esc(e.under_name||"—")}」）`;
  case "accept_offer": {
   const tr=(D.ledger||[]).find(r=>r.kind==="transfer"&&r.step===e.step&&r.offer_id===t);
   return tr?`${P(tr.parcel_id)} の名義を「${esc(tr.under_name)}」へ移した`
            :`申し入れ ${esc(t)} に応じた`;}

  case "reject_offer": return `申し入れ ${esc(t)} に応じなかった`;
  case "withdraw_offer": return `申し入れ ${esc(t)} を取り下げ`;

  case "unlist": return `${P(t)} の売り出しを取り下げ`;

  case "relocate": return `${P(t)} へ店を移す`;
  case "close_shop": return `<b>店を畳んだ</b>`;
  case "move_out": return `<b>この街から転出した</b>`;
  case "circulate_listing": return `${esc(nameOf[t]||t)} に売り情報を流す`;
  case "approach_owner": return `${esc(nameOf[t]||t)} に売却を打診`;
  case "publish": return `<b>記事を出した</b>`;
  case "investigate": return `登記簿を調べた`;
  case "silent": return `今月は書かなかった`;
  case "enact_ordinance": return `<b>条例を施行「${esc(t)}」</b>`;
  case "study_ordinance": return `規制の検討を進める`;
  case "request_report": return `${esc(nameOf[t]||t)} に説明を求めた`;
  case "public_statement": return `声明を出した`;
  case "monitor": case "hold": case "wait": case "continue": return `静観`;
  default: return esc(e.action);
 }
}
function beatHtml(e){
 const c=cat(e), label=(CATS.find(x=>x[0]===c)||["","?"])[1];
 let h=`<div class="beat" data-cat="${c}" data-id="${e.id}" data-step="${e.step}">`
  +`<span class="tag t-${c}">${label}</span><div class="bd">`
  +`<div class="hl"><span class="who">${esc(e.name)}</span>`
  +`<span class="small">（${esc(ROLEJA[e.role]||e.role)}）</span> ${summary(e)}</div>`;
 if(!e.ok) h+=`<div class="sub">→ 帳簿上は<b>不成立</b>（${esc(e.outcome)}${e.why?" / "+esc(e.why):""}）。コードは補正していない。</div>`;
 if(e.reasoning) h+=`<div class="sub">理由：${esc(e.reasoning)}</div>`;
 if(e.utterance) h+=`<div class="say ${e.ch==="public"?"pub":e.ch==="private"?"pri":""}">`
  +`${e.ch==="private"?"（"+esc(nameOf[e.to]||e.to)+"へ）":""}「${esc(e.utterance)}」</div>`;
 return h+`</div></div>`;
}

/* ---------- クロニクル ---------- */
let active=new Set(CATS.filter(c=>c[0]!=="idle").map(c=>c[0]));
$("#catbar").innerHTML='<span class="small">種別：</span>'
 +CATS.map(c=>`<button class="catb ${active.has(c[0])?"on":""}" data-c="${c[0]}">${c[1]}</button>`).join("")
 +'<button id="allcat">全部</button>';
function fillSel(sel,opts,ph){ sel.innerHTML=`<option value="">${ph}</option>`
 +opts.map(o=>`<option value="${o[0]}">${o[1]}</option>`).join(""); }
fillSel($("#asel"),D.agents.map(a=>[a.id,`${a.name}（${ROLEJA[a.role]||a.role}）`]),"すべて");
fillSel($("#psel2"),D.parcels.map(p=>[p.pid,`${p.pid}（${p.block}）`]),"すべて");
fillSel($("#msel"),Array.from({length:nSteps},(_,i)=>[i+1,`第${i+1}月`]),"全期間");
fillSel($("#psel"),D.parcels.map(p=>[p.pid,`${p.pid}（${p.block}・${p.use}）`]),"（区画を選ぶ）");
fillSel($("#tsel"),D.agents.map(a=>[a.id,`${a.name}（${ROLEJA[a.role]||a.role}）`]),"（選ぶ）");
function chronicle(){
 const aid=$("#asel").value, pid=$("#psel2").value, mo=$("#msel").value;
 const q=$("#q").value.trim();
 let rows=D.events.filter(e=>active.has(cat(e)));
 if(aid) rows=rows.filter(e=>e.id===aid);
 if(mo) rows=rows.filter(e=>e.step===+mo);
 if(pid){
  const offs=new Set((D.ledger||[]).filter(r=>r.parcel_id===pid&&r.offer_id).map(r=>r.offer_id));
  rows=rows.filter(e=>e.target===pid||offs.has(e.target)
   ||(e.utterance||"").includes(pid)||(e.reasoning||"").includes(pid));
 }
 if(q) rows=rows.filter(e=>(e.utterance+e.reasoning+e.name).includes(q));
 $("#cnt").textContent=`${rows.length} 件`;
 let h="",cur=-1;
 rows.forEach(e=>{ if(e.step!==cur){cur=e.step; h+=`<div class="mo">第${cur}月</div>`;} h+=beatHtml(e); });
 $("#chron").innerHTML=h||'<p class="small">条件に合う出来事がない。</p>';
}
$("#catbar").addEventListener("click",ev=>{
 const b=ev.target.closest("button"); if(!b)return;
 if(b.id==="allcat"){ active=new Set(CATS.map(c=>c[0]));
  document.querySelectorAll(".catb").forEach(x=>x.classList.add("on")); chronicle(); return; }
 const c=b.dataset.c; if(active.has(c)){active.delete(c);b.classList.remove("on");}
 else{active.add(c);b.classList.add("on");} chronicle();
});
["#asel","#psel2","#msel"].forEach(s=>$(s).addEventListener("change",chronicle));
$("#q").addEventListener("input",chronicle);
$("#reset").addEventListener("click",()=>{
 $("#asel").value="";$("#psel2").value="";$("#msel").value="";$("#q").value="";
 active=new Set(CATS.filter(c=>c[0]!=="idle").map(c=>c[0]));
 document.querySelectorAll(".catb").forEach(x=>x.classList.toggle("on",active.has(x.dataset.c)));
 chronicle();
});
document.addEventListener("click",ev=>{
 const p=ev.target.closest(".pill"); if(!p)return;
 selPid=p.dataset.pid; $("#psel").value=selPid; renderParcel(); draw(+slider.value);
 $("#psel").scrollIntoView({behavior:"smooth",block:"center"});
});

/* ---------- 区画の履歴 ---------- */
function renderParcel(){
 const pid=$("#psel").value;
 selPid=pid||null; draw(+slider.value);
 if(!pid){ $("#phist").innerHTML='<p class="small">マップの区画をクリックするか、上で区画を選ぶ。</p>';
  $("#pinfo").textContent=""; return; }
 const p=PARCEL[pid];
 const last=D.frames[D.frames.length-1];
 $("#pinfo").innerHTML=`${p.block}／用途 ${esc(last.use[pid])}`
  +`／最終の名義 <b>${esc(last.registered[pid])}</b>`;
 const offs=new Set((D.ledger||[]).filter(r=>r.parcel_id===pid&&r.offer_id).map(r=>r.offer_id));
 const recs=(D.ledger||[]).filter(r=>r.parcel_id===pid
   ||(r.offer_id&&offs.has(r.offer_id)));
 const rowFor=(r)=>{
  const who=nameOf[r.by||r.from_id||r.seller||r.agent_id]||r.by||r.from_id||"";
  switch(r.kind){
   case "offer": return [`申入`,`${esc(r.under_name)} 名義での取得の申し入れ（${r.offer_id}）`];
   case "consult": return [`相談`,`${esc(nameOf[r.by]||r.by)} が ${esc(nameOf[r.to]||r.to)} に相談（${r.consult_id}）`];
   case "advice": return [`回答`,`${esc(nameOf[r.by]||r.by)} が ${esc(nameOf[r.to]||r.to)} の相談に答えた（${r.consult_id}）`];
   case "keep": return [`応じない`,`${esc(nameOf[r.by]||r.by)} が申し入れに応じなかった（${r.offer_id}）`];
   case "hold": return [`保留`,`${esc(nameOf[r.by]||r.by)} は今月決めなかった（${r.offer_id}）`];
   case "transfer": return [`移転`,`${esc(nameOf[r.seller]||r.seller)} → 名義「${esc(r.under_name)}」`];
   case "unlist": return [`取下`,`${esc(who)} が売り出しを取り下げ`];

   case "tenancy_end": return [`退去`,`${esc(nameOf[r.tenant]||r.tenant)} が退去（${esc(r.reason)}）`];
   case "relocate": return [`入居`,`${esc(nameOf[r.agent_id]||r.agent_id)} が入居`];
   default: return null;
  }
 };
 let h='<table><thead><tr><th>月</th><th>種別</th><th>内容</th><th>そのときの言い分</th></tr></thead><tbody>';
 let n=0;
 recs.forEach(r=>{
  const rw=rowFor(r); if(!rw)return; n++;
  const actor=r.by||r.from_id||r.seller||r.agent_id||r.tenant;
  const e=D.events.find(x=>x.step===r.step&&x.id===actor);
  h+=`<tr><td>第${r.step}月</td><td><b>${rw[0]}</b></td><td>${rw[1]}</td>`
   +`<td class="small">${e&&e.reasoning?esc(e.reasoning):""}`
   +`${e&&e.utterance?"<br>「"+esc(e.utterance)+"」":""}</td></tr>`;
 });
 h+="</tbody></table>";
 $("#phist").innerHTML=n?h:'<p class="small">この区画には、期間中なにも起きなかった。</p>';
}
$("#psel").addEventListener("change",renderParcel);

/* ---------- エージェント別スレッド ---------- */
function renderThread(){
 const id=$("#tsel").value;
 if(!id){ $("#thread").innerHTML='<p class="small">エージェントを選ぶと、その1体の36か月が一本で読める。</p>';
  $("#tinfo").textContent=""; return; }
 let rows=D.events.filter(e=>e.id===id);
 if($("#thideidle").checked) rows=rows.filter(e=>cat(e)!=="idle");
 const acts={}; rows.forEach(e=>{acts[e.action]=(acts[e.action]||0)+1;});
 $("#tinfo").innerHTML=`${rows.length}か月ぶん ／ `
  +Object.entries(acts).sort((a,b)=>b[1]-a[1]).map(([a,c])=>`${esc(a)}×${c}`).join("、");
 let h="";
 rows.forEach(e=>{
  h+=`<div class="mo">第${e.step}月</div>`+beatHtml(e);
  if(e.memory) h+=`<div class="beat" style="border-bottom:none;padding-top:0;">`
   +`<span class="tag t-idle">記憶</span><div class="bd"><div class="mem">${esc(e.memory)}</div></div></div>`;
 });
 $("#thread").innerHTML=h||'<p class="small">該当なし。</p>';
}
$("#tsel").addEventListener("change",renderThread);
$("#thideidle").addEventListener("change",renderThread);

/* ---------- step 連動 ---------- */
const slider=$("#slider"); slider.max=nSteps; slider.value=nSteps;
function stepInfo(step){
 const r=D.kpi[step-1];
 if(!r) return "第0月（初期状態）";
 return `第${step}月 — 取得主体シェア <b>${pct(r.acquirer_share)}</b> ／ HHI ${r.hhi.toFixed(3)}`
  +` ／ 累計成約 ${r.transfers_cum} ／ 営業中の店 ${r.shops_occupied}/${r.shops_total}`
  +` ／ 転出率 ${pct(r.resident_outflow)}`;
}
function update(){
 const s=+slider.value;
 $("#stepnum").textContent=s===0?"第0月":"第"+s+"月";
 draw(s); $("#stepinfo").innerHTML=stepInfo(s);
}
slider.addEventListener("input",update);
let timer=null;
$("#play").addEventListener("click",()=>{
 if(timer){clearInterval(timer);timer=null;$("#play").textContent="▶ 再生";return;}
 if(+slider.value>=nSteps) slider.value=0;
 $("#play").textContent="⏸ 停止";
 timer=setInterval(()=>{ if(+slider.value>=nSteps){clearInterval(timer);timer=null;
  $("#play").textContent="▶ 再生";return;} slider.value=+slider.value+1; update(); },420);
});

/* ---------- 出来事 ---------- */
let ev="";
ev+="<h3>報道</h3>";
ev+=D.publications.length?D.publications.map(p=>
 `<div class="beat"><span class="tag t-media">第${p.step}月</span><div class="bd">
  <div class="hl">${esc(p.headline)}</div></div></div>`).join("")
 :"<p class='small'>期間中、この街のことは記事にならなかった。</p>";
ev+="<h3>規制</h3>";
ev+=D.ordinances.length?D.ordinances.map(o=>
 `<div class="beat"><span class="tag t-gov">第${o.step}月</span><div class="bd">
  <div class="hl">${esc(o.title)}</div><div class="sub">${esc(o.body)}</div></div></div>`).join("")
 :"<p class='small'>期間中、土地取引の規制は発動しなかった。</p>";
$("#events").innerHTML=ev;

update(); chronicle(); renderParcel(); renderThread();
</script></body></html>
