on": "A市の不動産市場の現状について教えていただけますか？特に、相続や空き家問題について、どのような動きがありますでしょうか。"}, {"step": 1, "kind": "consult", "consult_id": "Q0007", "by": "HH14", "to": "BR01", "question": "温泉丘陵地区の住宅（P31）と空地（P47）について、売却や活用方法について相談したいです。建物の修繕や相続についても含めて、どのような選択肢があるか教えていただけますでしょうか。"}, {"step": 1, "kind": "consult", "consult_id": "Q0008", "by": "HH15", "to": "BR01", "question": "現在所有している住宅（P16, P32）の売却や賃貸の可能性について相談したい。特に、P16は駅前、P32は温泉地という立地を活かせるか知りたい。"}, {"step": 1, "kind": "consult", "consult_id": "Q0009", "by": "HH16", "to": "BR01", "question": "現在所有している空き家（P17、湾岸地区、70㎡）について、活用方法や売却の可能性について情報提供をお願いできますでしょうか。"}, {"step": 1, "kind": "investigate", "by": "MD01", "note": "land_registry"}, {"step": 1, "kind": "investigate", "by": "MD02", "note": "land_registry"}, {"step": 1, "kind": "publication", "by": "MD02", "headline": "A市土地所有権動向調査：第1月", "body": "A市土地所有権動向調査：第1月\n今月よりA市土地登記の月次統計調査を開始しました。初期データでは、特定の個人や法人による広範囲な土地所有は確認されず、分散した所有形態が見られます。今後、この統計を継続的に観測することで、土地所有権の変動、相続による名義変更、あるいは新たな開発の兆候などを捉え、地域経済や住民生活への影響について報道してまいります。", "about_acquisition": true}, {"step": 1, "kind": "investigate", "by": "MU01", "note": "land_registry"}, {"step": 1, "kind": "investigate", "by": "MU02", "note": "land_registry"}, {"step": 1, "kind": "hold", "offer_id": "O0001", "parcel_id": "P05", "by": "HH04"}, {"step": 1, "kind": "hold", "offer_id": "O0002", "parcel_id": "P06", "by": "HH05"}, {"step": 1, "kind": "hold", "offer_id": "O0003", "parcel_id": "P08", "by": "HH07"}, {"step": 1, "kind": "hold", "offer_id": "O0004", "parcel_id": "P13", "by": "HH12"}, {"step": 1, "kind": "hold", "offer_id": "O0005", "parcel_id": "P14", "by": "HH13"}, {"step": 1, "kind": "hold", "offer_id": "O0006", "parcel_id": "P16", "by": "HH15"}, {"step": 2, "kind": "advice", "consult_id": "Q0001", "by": "BR01", "to": "HH03", "reply": "P20（湾岸観光地区の空地140㎡）についてですね。湾岸地区はスペースポート構想の恩恵を受ける可能性があり、将来的な需要が見込めます。現状では、一時的な駐車場やイベントスペースとしての活用、あるいは小規模な商業施設の誘致などが考えられます。温泉観光地区という特性を活かすなら、休憩所や土産物店なども良いかもしれません。まずはどのような事業を想定されているか、もう少し詳しくお聞かせいただけますでしょうか。"}, {"step": 2, "kind": "advice", "consult_id": "Q0002", "by": "BR01", "to": "HH04", "reply": "自宅の売却をご検討とのこと、承知いたしました。まずは物件の所在地や種別、おおよその築年数や広さなど、詳細をお聞かせいただけますでしょうか。それによって、どのような売却戦略が考えられるか、より具体的なアドバイスができるかと思います。"}, {"step": 2, "kind": "advice", "consult_id": "Q0003", "by": "BR01", "to": "HH06", "reply": "駅前の店舗用土地（P07）の売却についてですね。駅前という立地は非常に魅力的で、常に一定の需要が見込めます。現在の市場価値については、近隣の取引事例や公示価格などを参考に算出いたします。売却の可能性は高いと考えられますが、具体的な価格設定やターゲットとする購入層によって、売却までの期間も変わってきます。一度、物件の詳細をお聞かせいただけますでしょうか。"}, {"step": 2, "kind": "advice", "consult_id": "Q0004", "by": "BR01", "to": "HH09", "reply": "湾岸地区の店舗（P10）の市場動向とスペースポート構想の影響ですね。湾岸地区は、スペースポート構想により、将来的には交通インフラの整備やそれに伴う経済活動の活発化が期待されています。現在、店舗としての利用状況や、どのような業種が入居しているかによっても市場価値は変動します。スペースポート構想の影響については、現時点では不確定要素も多いですが、関連産業の集積による需要増加は見込まれます。詳細な物件情報があれば、より具体的な分析が可能です。"}, {"step": 2, "kind": "advice", "consult_id": "Q0005", "by": "BR01", "to": "HH10", "reply": "北部学術・生活地区の物件P27（店舗/110㎡）の活用方法と市場動向ですね。この地区は学術機関や生活圏が近いため、学生や地域住民向けの店舗、例えばカフェ、書店、学習塾などが考えられます。また、近隣の商業施設との連携も有効かもしれません。不動産市場としては、安定した需要が見込める一方で、新たな開発の余地も探る必要があるでしょう。物件の詳細な状況をお聞かせいただければ、より具体的な活用法をご提案できます。"}, {"step": 2, "kind": "advice", "consult_id": "Q0006", "by": "BR01", "to": "HH11", "reply": "A市の不動産市場の現状、特に相続や空き家問題についてですね。全体としては、人口減少と高齢化が進む中で、相続による物件の分散や、管理が行き届かない空き家の増加が課題となっています。これにより、物件によっては市場価格が下落する傾向も見られますが、一方で、立地条件の良い物件や、リノベーションによる付加価値向上で需要が見込めるケースもあります。具体的な地域や物件種別によって状況は異なりますので、もしご関心のあるエリアがあれば、さらに詳しくお調べします。"}, {"step": 2, "kind": "consult", "consult_id": "Q0010", "by": "BZ02", "to": "BR01", "question": "私の店舗が入っている建物の名義人R02との関係性、および将来的な建物の扱いについて、仲介の立場からどのようなアドバイスが可能か。"}, {"step": 2, "kind": "consult", "consult_id": "Q0011", "by": "BZ04", "to": "BR01", "question": "A市の土地所有権の動向について、高齢化や後継者不足といった市内の課題と関連付けて、どのような傾向が見られるか、また今後どのような動きが予想されるかについて、専門的な見地から教えていただけますでしょうか。"}, {"step": 2, "kind": "consult", "consult_id": "Q0012", "by": "HH04", "to": "BR02", "question": "自宅の売却を検討しています。現在の市場価値や、売却の手続きについてお伺いしたいです。"}, {"step": 2, "kind": "consult", "consult_id": "Q0013", "by": "HH06", "to": "BR01", "question": "駅前の店舗用土地（P07、320㎡）の売却について、現在の市場での可能性と、おおよその相場をお聞かせください。"}, {"step": 2, "kind": "consult", "consult_id": "Q0014", "by": "HH09", "to": "BR01", "question": "第1月にお伺いしたP10（湾岸地区の店舗）の件ですが、何か新しい情報や、将来的な見通しについてご存知でしたら教えていただけますでしょうか。特にスペースポート構想との関連で、どのような可能性があるか気になっています。"}, {"step": 2, "kind": "consult", "consult_id": "Q0015", "by": "HH10", "to": "BR01", "question": "P27（北部学術・生活地区の店舗）の活用方法について、具体的な提案をいただきたいです。また、P11（湾岸観光地区の店舗）についても、この地区の特性を活かした活用法があれば教えてください。北部地区と湾岸地区の不動産市場の動向についても、もし情報があればお聞かせ願えますでしょうか。"}, {"step": 2, "kind": "consult", "consult_id": "Q0016", "by": "HH11", "to": "BR01", "question": "所有している北部学術・生活地区の空地（P44）について、現在の市場での評価や、将来的な活用方法についてアドバイスをいただけますでしょうか。"}, {"step": 2, "kind": "consult", "consult_id": "Q0017", "by": "HH14", "to": "BR01", "question": "前回相談した件について、状況はいかがでしょうか。特に温泉丘陵地区の物件について、今後の見通しや活用方法についてご意見を伺いたいです。"}, {"step": 2, "kind": "consult", "consult_id": "Q0018", "by": "HH15", "to": "BR01", "question": "P32（温泉丘陵地区）の物件についても、購入希望者の有無や適した活用方法についてご相談させてください。先月P16について相談させていただきましたが、こちらも含めて検討したいと考えております。"}, {"step": 2, "kind": "investigate", "by": "MD01", "note": "corporate_records"}, {"step": 2, "kind": "investigate", "by": "MD02", "note": "corporate_records"}, {"step": 2, "kind": "investigate", "by": "MU01", "note": "land_registry"}, {"step": 2, "kind": "investigate", "by": "MU02", "note": "corporate_records"}, {"step": 2, "kind": "hold", "offer_id": "O0001", "parcel_id": "P05", "by": "HH04"}, {"step": 2, "kind": "hold", "offer_id": "O0002", "parcel_id": "P06", "by": "HH05"}, {"step": 2, "kind": "hold", "offer_id": "O0003", "parcel_id": "P08", "by": "HH07"}, {"step": 2, "kind": "hold", "offer_id": "O0004", "parcel_id": "P13", "by": "HH12"}, {"step": 2, "kind": "hold", "offer_id": "O0005", "parcel_id": "P14", "by": "HH13"}, {"step": 2, "kind": "hold", "offer_id": "O0006", "parcel_id": "P16", "by": "HH15"}, {"step": 3, "kind": "advice", "consult_id": "Q0012", "by": "BR02", "to": "HH04", "reply": "R04様、ご自宅の売却をご検討とのこと、承知いたしました。売却の手続きにつきましては、まず物件の査定を行い、市場の動向を踏まえた上で販売戦略を立てていくことになります。詳細な手続きや、現在の市場価値についてご説明させていただきますので、一度事務所にお越しいただけますでしょうか。"}, {"step": 3, "kind": "consult", "consult_id": "Q0019", "by": "BZ01", "to": "BR01", "question": "最近のA市の不動産市場の動向について、特にスペースポート構想の影響を踏まえた土地の取引状況について教えていただけますでしょうか。"}, {"step": 3, "kind": "consult", "consult_id": "Q0020", "by": "BZ04", "to": "BR01", "question": "街の不動産所有権の動向と、それが高齢化や後継者不足とどう関連しているかについて、詳しく教えてください。"}, {"step": 3, "kind": "consult", "consult_id": "Q0021", "by": "HH04", "to": "BR02", "question": "自宅の売却を検討しています。P05とP21の2つの物件をまとめて売却した場合の市場価値、およびそれに伴う手続きについて、ご相談させていただけますでしょうか。また、売却にあたって、どのような点に注意すべきかアドバイスをいただけますと幸いです。"}, {"step": 3, "kind": "consult", "consult_id": "Q0022", "by": "HH06", "to": "BR01", "question": "駅前の店舗用土地（P07）の売却について、購入希望者の層、おおよその売却可能時期と価格帯について、具体的な情報があればお教えください。年内売却希望です。"}, {"step": 3, "kind": "consult", "consult_id": "Q0023", "by": "HH09", "to": "BR01", "question": "P10（湾岸地区の店舗）の市場動向について、スペースポート構想の進展と合わせて、より詳細な分析と将来的な見通しを教えていただけますでしょうか。特に、構想が実現した場合のP10の賃料や売買価格への影響について、具体的なデータがあれば幸いです。"}, {"step": 3, "kind": "consult", "consult_id": "Q0024", "by": "HH10", "to": "BR01", "question": "先月ご相談させていただいたP27（店舗/北部学術・生活地区）について、いただいたアドバイスを参考に、学生や地域住民向けのカフェや学習塾といった活用を具体的に検討したいと考えております。特に、収益性や運営モデルについて、さらに詳細なご意見を伺えますでしょうか。また、P11（店舗/湾岸観光地区）についても、湾岸観光地区という立地を活かせるような活用法（例：観光客向けテナント、イベントスペースなど）があれば、併せてご提案いただけますと幸いです。"}, {"step": 3, "kind": "consult", "consult_id": "Q0025", "by": "HH11", "to": "BR01", "question": "P44の空地の用途や将来性について、具体的な情報を教えていただけますでしょうか。また、A市の不動産市場全体についても、今後の見通しなど、より詳細な情報があれば伺いたいです。"}, {"step": 3, "kind": "consult", "consult_id": "Q0026", "by": "HH14", "to": "BR01", "question": "先月ご相談させていただいた不動産（P15, P31, P47）について、その後の状況をお伺いしたくご連絡いたしました。特にP15（駅前の店舗）は、現在の介護との両立が難しく、何か打開策があればご相談させていただけますでしょうか。"}, {"step": 3, "kind": "consult", "consult_id": "Q0027", "by": "HH15", "to": "BR01", "question": "P16の件ですが、まだ回答をお待ちしております。また、P32についても相談させていただけますでしょうか？"}, {"step": 3, "kind": "investigate", "by": "MD01", "note": "corporate_records"}, {"step": 3, "kind": "investigate", "by": "MD02", "note": "corporate_records"}, {"step": 3, "kind": "publication", "by": "MD02", "headline": "A市土地所有の偏り：海外資本の影", "body": "A市土地所有の偏り：海外資本の影\n先月実施した土地登記統計調査により、R07が市内の土地の約14.9%を単独で所有していることが判明した。今月の法人記録調査の結果、A社、B社、D社といった市内の法人（またはそれらに関連する法人）は、海外の不動産投資・運営会社であるX社、さらには香港のS投資控股と深く関連していることが明らかになった。特にX社はS投資控股の連結対象として開示されており、A社、B社、D社も間接的にS投資控股の傘下にある可能性が高い。このことは、A市における広大な土地所有の背景に、海外資本が存在する可能性を示唆している。今後の調査で、これらの法人が具体的にどの区画を所有し、どのような目的で利用しているのかを明らかにしていきたい。", "about_acquisition": true}, {"step": 3, "kind": "investigate", "by": "MU01", "note": "land_registry"}, {"step": 3, "kind": "investigate", "by": "MU02", "note": "land_registry"}, {"step": 3, "kind": "hold", "offer_id": "O0001", "parcel_id": "P05", "by": "HH04"}, {"step": 3, "kind": "keep", "offer_id": "O0002", "parcel_id": "P06", "by": "HH05"}, {"step": 3, "kind": "hold", "offer_id": "O0003", "parcel_id": "P08", "by": "HH07"}, {"step": 3, "kind": "hold", "offer_id": "O0004", "parcel_id": "P13", "by": "HH12"}, {"step": 3, "kind": "hold", "offer_id": "O0005", "parcel_id": "P14", "by": "HH13"}, {"step": 3, "kind": "hold", "offer_id": "O0006", "parcel_id": "P16", "by": "HH15"}, {"step": 4, "kind": "advice", "consult_id": "Q0021", "by": "BR02", "to": "HH04", "reply": "R04様、自宅の売却のご相談ありがとうございます。P05とP21の2つの物件をまとめて売却される場合、市場価値は物件の状態、立地、周辺の需要など多くの要因によって変動いたします。一般的には、まとめることで買い手にとって魅力が増し、個別に売却するよりも有利な条件で取引できる可能性がございます。具体的な市場価値の算定には、物件の詳細な調査が必要となります。手続きにつきましては、まず売買契約書の作成、法務局への所有権移転登記、そして買主様への物件引き渡しが主な流れとなります。仲介業者として、これらの手続きを円滑に進めるためのサポートをさせていただきます。売却にあたっての注意点としては、物件の清掃や修繕、必要書類の準備、そして買い手様との条件交渉などが挙げられます。ご不明な点やご要望がございましたら、お気軽にご相談ください。"}, {"step": 4, "kind": "consult", "consult_id": "Q0028", "by": "BZ04", "to": "BR01", "question": "A市における土地所有権の動向について、特に高齢化や後継者不足との関連性、および海外資本の関与について、より詳細な情報があればお教えいただけますでしょうか。"}, {"step": 4, "kind": "consult", "consult_id": "Q0029", "by": "HH03", "to": "BR01", "question": "P20の空地活用について、休憩所や土産物店のような小規模商業施設の誘致を考えております。スペースポート構想の発展も見据え、観光客の増加も見込めるかと存じます。具体的なご提案があれば、ぜひお聞かせください。"}, {"step": 4, "kind": "consult", "consult_id": "Q0030", "by": "HH06", "to": "BR01", "question": "第3月にお伺いした駅前の土地（P07）の売却について、改めてご相談させてください。売却の意思は固まっております。いつ頃までに売却したいか、また、BR01様がどのような購入層にアプローチ可能か、具体的なご見解をお聞かせいただけますでしょうか？"}, {"step": 4, "kind": "consult", "consult_id": "Q0031", "by": "HH09", "to": "BR01", "question": "P10（湾岸地区の店舗）の市場動向とスペースポート構想の影響について、より具体的な情報を求む。特に、スペースポート構想がP10の将来性にどう影響するか、具体的なデータや分析を提示してほしい。"}, {"step": 4, "kind": "consult", "consult_id": "Q0032", "by": "HH10", "to": "BR01", "question": "P27（北部学術・生活地区の店舗）について、先月いただいたフィードバック（カフェ、書店、学習塾など）を踏まえ、学術機関や地域住民をターゲットにした場合の具体的な収益性や運営モデルについて、より詳細なご提案をいただけますでしょうか。また、P11（湾岸観光地区の店舗）についても、観光客向けテナントやイベントスペースとしての活用法など、立地を活かした具体的な活用法についてご相談させてください。"}, {"step": 4, "kind": "consult", "consult_id": "Q0033", "by": "HH11", "to": "BR01", "question": "P44の空地の用途や将来性について、前月ご相談した件の回答をお願いいたします。"}, {"step": 4, "kind": "consult", "consult_id": "Q0034", "by": "HH12", "to": "BR01", "question": "P13の土地の現在の市場価値と、スペースポート構想が将来的にこの地域の不動産価値に与える影響について、専門的な見解をお聞かせいただけますでしょうか。"}, {"step": 4, "kind": "consult", "consult_id": "Q0035", "by": "HH14", "to": "BR01", "question": "先月相談した件について、進捗状況をお伺いしたいです。"}, {"step": 4, "kind": "consult", "consult_id": "Q0036", "by": "HH15", "to": "BR01", "question": "P32について相談したいのですが、P16への申し入れへの返答を保留している状況も踏まえて、アドバイスをいただけますでしょうか。"}, {"step": 4, "kind": "investigate", "by": "MD01", "note": "corporate_records"}, {"step": 4, "kind": "investigate", "by": "MD02", "note": "corporate_records"}, {"step": 4, "kind": "publication", "by": "MD02", "headline": "A市、広大な土地所有の背景に海外資本か", "body": "A市、広大な土地所有の背景に海外資本か\n先月発表したA市内の土地所有面積統計において、R07氏が1350㎡（14.9%）と最も広大な土地を所有していることが判明した。今月の公開法人記録の調査により、この広大な土地の所有権が、海外資本を背景とした法人にある可能性が浮上した。A社、B社、D社は、不動産投資・運営会社であるX社と関連があり、X社はさらに香港に拠点を置くS投資控股と連結していることが確認された。S投資控股がX社を連結対象としていることから、A社、B社、D社も間接的にS投資控股の傘下にあると推測される。A市の土地所有の実態が、海外の投資動向に影響を受けている可能性について、今後も取材を続ける。", "about_acquisition": true}, {"step": 4, "kind": "investigate", "by": "MU01", "note": "land_registry"}, {"step": 4, "kind": "investigate", "by": "MU02", "note": "land_reg 1", "question": "P20の活用についてですが、温泉観光地という立地を活かし、観光客向けの休憩所や土産物店などの小規模商業施設を誘致できればと考えております。また、将来的なスペースポート構想による地域経済の活性化も見据え、長期的な視点での活用も視野に入れております。"}, {"step": 6, "kind": "consult", "consult_id": "Q0050", "by": "HH04", "to": "BR02", "question": "来月お伺いするにあたり、事前にいくつかお伺いしたいことがあります。まず、現在の市場状況を踏まえ、私の自宅（P05, P21）の売却希望価格について、おおよその目安をお教えいただけますでしょうか。また、売却が完了するまでのおおよその期間や、仲介手数料についてもお教えいただけますと幸いです。"}, {"step": 6, "kind": "consult", "consult_id": "Q0051", "by": "HH05", "to": "BR01", "question": "P06（店舗）とP22（住宅）の将来的な価値、およびA市の人口減少・高齢化が不動産市場に与える影響について、専門的な見解を伺いたいです。また、これらの物件の売却や活用についても相談させてください。"}, {"step": 6, "kind": "consult", "consult_id": "Q0052", "by": "HH06", "to": "BR01", "question": "駅前土地P07の売却について、改めて相談させてください。売却の意思は固いのですが、希望売却時期や、どのような購入層にアプローチ可能か、具体的な見通しをお聞かせいただけますでしょうか。前回ご相談してから時間が経っておりますので、状況に進展がないか、あるいは売却自体に難しさがあるのか、正直なところをお伺いしたいです。"}, {"step": 6, "kind": "consult", "consult_id": "Q0053", "by": "HH09", "to": "BR01", "question": "スペースポート構想とP10（湾岸地区の店舗）の将来性について、より具体的なデータや分析を求めます。特に、湾岸地区の土地利用や開発計画、関連する事業者の動向について、最新の情報や予測があればご教示ください。"}, {"step": 6, "kind": "consult", "consult_id": "Q0054", "by": "HH10", "to": "BR01", "question": "P27（北部学術・生活地区の店舗）について、先月のフィードバック（カフェ、書店、学習塾など）を元に、学術機関や地域住民をターゲットとした場合の収益性や具体的な運営モデルについて、より詳細な検討をお願いします。また、P11（湾岸観光地区の店舗）についても、立地を活かした観光客向けテナントやイベントスペースとしての活用法について、ご提案いただけますでしょうか。"}, {"step": 6, "kind": "consult", "consult_id": "Q0055", "by": "HH11", "to": "BR01", "question": "P44の空き地について、前月よりご相談させていただいておりますが、何か進展はございましたでしょうか。引き続き、用途や将来性について情報があればお伺いしたいです。"}, {"step": 6, "kind": "consult", "consult_id": "Q0056", "by": "HH12", "to": "BR01", "question": "旧店舗（P13）の現在の市場価値と、スペースポート構想が将来的に店舗物件の価値に与える影響について、専門的な見解をお聞かせください。"}, {"step": 6, "kind": "consult", "consult_id": "Q0057", "by": "HH13", "to": "BR01", "question": "温泉丘陵地区の店舗(P30)と住宅(P46)の将来的な活用方法について、専門的なアドバイスをいただけますでしょうか。特に、現在のA市の状況や今後の見通しを踏まえて、どのような選択肢があるか知りたいです。"}, {"step": 6, "kind": "consult", "consult_id": "Q0058", "by": "HH14", "to": "BR01", "question": "先日ご相談させていただいた駅前の店舗（P15）の活用について、現在の私の状況（父の介護との両立の難しさ）を考慮した上で、何か良い打開策や、活用方法についてご提案いただけないでしょうか。また、先月ご相談した内容について、何か進展はありましたでしょうか。"}, {"step": 6, "kind": "consult", "consult_id": "Q0059", "by": "HH15", "to": "BR01", "question": "P32（住宅/温泉丘陵地区）の将来性について、どのような売却戦略が考えられますか？"}, {"step": 6, "kind": "investigate", "by": "MD01", "note": "corporate_records"}, {"step": 6, "kind": "publication", "by": "MD02", "headline": "【A市土地所有の実態】海外資本との関連が疑われる法人名義の土地保有", "body": "【A市土地所有の実態】海外資本との関連が疑われる法人名義の土地保有\n\n先月の調査により、A市内の複数の土地が、国内連絡先を東京都に置くA社、B社、D社といった法人名義で保有されていることが明らかになりました。これらの法人は、香港に本社を置くS投資控股と連結しており、さらにX社（海外の不動産投資・運営会社）もS投資控股を連結対象として開示しています。特に、R07区画（1350㎡、市全体の14.9%を占める）は、これらの海外資本を背景とした法人によって所有されている可能性が濃厚です。A市の土地所有のあり方について、さらなる取材を進めてまいります。", "about_acquisition": true}, {"step": 6, "kind": "investigate", "by": "MU01", "note": "land_registry"}, {"step": 6, "kind": "investigate", "by": "MU02", "note": "land_registry"}, {"step": 6, "kind": "hold", "offer_id": "O0001", "parcel_id": "P05", "by": "HH04"}, {"step": 6, "kind": "hold", "offer_id": "O0004", "parcel_id": "P13", "by": "HH12"}, {"step": 6, "kind": "hold", "offer_id": "O0005", "parcel_id": "P14", "by": "HH13"}, {"step": 6, "kind": "hold", "offer_id": "O0006", "parcel_id": "P16", "by": "HH15"}, {"step": 7, "kind": "advice", "consult_id": "Q0049", "by": "BR01", "to": "HH03", "reply": "R03様。P20の活用について、温泉観光地としての立地を活かし、観光客向けの休憩所や土産物店といった小規模商業施設の誘致は、非常に有望な選択肢だと考えます。スペースポート構想による地域経済の活性化も見据え、長期的な視点での活用は、将来的な資産価値向上にも繋がるでしょう。具体的なテナント候補や、地域との連携についても、今後検討を進めていきましょう。"}, {"step": 7, "kind": "advice", "consult_id": "Q0051", "by": "BR01", "to": "HH05", "reply": "R05様。P06（店舗）とP22（住宅）の将来的な価値について、A市の人口減少・高齢化は、不動産市場全体に影響を与えますが、立地や物件の特性によってその影響は異なります。P06については、駅前の利便性や、今後どのような業態が入るかによって価値が変動する可能性があります。P22についても、住宅としての需要は根強いですが、維持管理コストなども考慮が必要です。売却や活用については、これらの点を踏まえ、個別にご相談させていただければと存じます。"}, {"step": 7, "kind": "advice", "consult_id": "Q0052", "by": "BR01", "to": "HH06", "reply": "R06様。駅前土地P07の売却について、ご意思は固いとのこと承知いたしました。現在の市場状況を踏まえると、駅前の好立地であるため、店舗や事務所、あるいは飲食施設などを求める事業者からの関心が期待できます。具体的な売却時期については、市場の動向を見ながら調整していくことになりますが、年内売却をご希望でしたら、早めの準備が肝要です。購入層へのアプローチについては、弊社ネットワークを最大限に活用し、最適な買い手を見つけ出すよう努めます。詳細な見通しについては、改めてお打ち合わせさせていただけますでしょうか。"}, {"step": 7, "kind": "advice", "consult_id": "Q0053", "by": "BR01", "to": "HH09", "reply": "R09様。スペースポート構想とP10（湾岸地区の店舗）の将来性について、構想の進展に伴い、湾岸地区への注目度が高まることが予想されます。開発計画や関連事業者の動向については、引き続き注視してまいります。現時点では、構想が実現した場合、物流や観光関連の需要増加が見込まれるため、P10の賃料や売買価格も上昇する可能性があります。詳細なデータについては、現在収集・分析を進めておりますので、今しばらくお待ちください。"}, {"step": 7, "kind": "advice", "consult_id": "Q0054", "by": "BR01", "to": "HH10", "reply": "R10様。P27（北部学術・生活地区の店舗）について、学術機関や地域住民をターゲットとしたカフェ、書店、学習塾といった活用は、非常に理にかなっていると考えます。収益性や運営モデルについては、具体的な事業計画を策定する段階で、より詳細なシミュレーションを行うことが可能です。P11（湾岸観光地区の店舗）については、湾岸地区の景観や、観光客のニーズに合わせたテナント、例えば土産物店やカフェ、あるいはイベントスペースとしての活用が考えられます。両地区の不動産市場の動向については、スペースポート構想の影響も踏まえ、注視していく必要があります。"}, {"step": 7, "kind": "advice", "consult_id": "Q0055", "by": "BR01", "to": "HH11", "reply": "R11様。P44の空き地について、用途や将来性については、周辺環境や今後の開発計画によって大きく左右されます。現時点では、具体的な進展はございませんが、近隣の土地利用の動向や、スペースポート構想による湾岸地区への影響などを考慮しながら、最適な活用方法を検討していくことが重要です。A市の不動産市場全体としては、高齢化や後継者不足による物件の流動性が高まる一方で、スペースポート構想のような将来的な開発計画が、一部地域には新たな価値をもたらす可能性も秘めております。"}, {"step": 7, "kind": "advice", "consult_id": "Q0050", "by": "BR02", "to": "HH04", "reply": "R04様、来月のご来訪に先立ち、ご質問いただいた件について、現時点での回答を申し上げます。P05、P21の土地につきましては、現在の市場状況を鑑み、おおよその売却希望価格の目安は〇〇円から〇〇円程度かと存じます。売却完了までの期間は、買主様との交渉状況にもよりますが、通常3ヶ月から6ヶ月程度を見込んでおります。仲介手数料につきましては、売買成立価格の〇〇%（上限〇〇円）が標準的な料率となります。詳細につきましては、来月改めて事務所にてご説明させていただきます。"}, {"step": 7, "kind": "consult", "consult_id": "Q0060", "by": "BZ02", "to": "BR01", "question": "R07区画の土地所有に関する報道について、何か情報をお持ちですか？"}, {"step": 7, "kind": "consult", "consult_id": "Q0061", "by": "BZ03", "to": "BR01", "question": "店舗の建物（P04）の名義人であるR03さんが後継者を決めていないこと、そして将来的に建物をどうしていくか、という点について相談したいです。"}, {"step": 7, "kind": "consult", "consult_id": "Q0062", "by": "BZ04", "to": "BR01", "question": "NEWS-MD02-M06で報じられている、香港のS投資控股と関連のある国内法人によるA市内の土地保有について、特にR07区画に関して、どのような情報をお持ちですか？"}, {"step": 7, "kind": "consult", "consult_id": "Q0063", "by": function lineChart(svg,series,opts){
 const W=900,H=260,L=54,R=168,T=18,B=34;
 const xs=i=>L+(W-L-R)*(nSteps<=1?0:i/nSteps);
 const ymax=opts.ymax!=null?opts.ymax:Math.max(0.0001,...series.flatMap(s=>s.data.filter(v=>v!=null)));
 const ys=v=>H-B-(H-T-B)*(v/ymax);
 let g=`<rect x="0" y="0" width="${W}" height="${H}" fill="#fff"/>`;
 for(let t=0;t<=4;t++){const v=ymax*t/4,y=ys(v);
  g+=`<line x1="${L}" y1="${y}" x2="${W-R}" y2="${y}" stroke="#E5E7EB"/>`
    +`<text x="${L-8}" y="${y+4}" text-anchor="end" font-size="11" fill="#6B7280">${opts.fmt(v)}</text>`;}
 for(let s=0;s<=nSteps;s+=Math.max(1,Math.round(nSteps/12)))
  g+=`<text x="${xs(s)}" y="${H-12}" text-anchor="middle" font-size="11" fill="#6B7280">${s}</text>`;
 (opts.marks||[]).forEach(mk=>{const x=xs(mk.step);
  g+=`<line x1="${x}" y1="${T}" x2="${x}" y2="${H-B}" stroke="${mk.color}" stroke-dasharray="4 3"/>`
    +`<text x="${x+4}" y="${T+12}" font-size="11" font-weight="700" fill="${mk.color}">${esc(mk.label)}</text>`;});
 series.forEach((s,si)=>{
  let d="",started=false;
  s.data.forEach((v,i)=>{ if(v==null)return; const x=xs(i+1),y=ys(v);
   d+=(started?"L":"M")+x+" "+y+" "; started=true;});
  g+=`<path d="${d}" fill="none" stroke="${s.color}" stroke-width="2.5"/>`
    +`<text x="${W-R+8}" y="${T+16+si*18}" font-size="12" font-weight="700" fill="${s.color}">${esc(s.label)}</text>`;});
 g+=`<line x1="${L}" y1="${H-B}" x2="${W-R}" y2="${H-B}" stroke="#111827"/>`
   +`<text x="${W-R}" y="${H-2}" text-anchor="end" font-size="11" fill="#6B7280">経過月</text>`;
 svg.innerHTML=g;
}

const CATS=[["deal","成約"],["nego","申し入れ"],["list","売出"],
 ["media","報道"],["gov","自治体"],["exit","退出・廃業"],["talk","発言"],
 ["fail","不成立"],["idle","静観"]];
function cat(e){
 if(!e.ok) return "fail";
 const o=e.outcome;
 if(o==="transfer") return "deal";
 if(o==="offer"||o==="counter"||o==="withdraw") return "nego";
 if(o==="listing"||o==="unlist") return "list";
 if(o==="rent_change"||o==="rent_negotiation"||o==="redevelop") return "rent";
 if(o==="publication") return "media";
 if(o==="ordinance"||o==="ordinance_study"||o==="request_report") return "gov";
 if(o==="move_out"||o==="business_closed"||o==="relocate") return "exit";
 if(e.action==="investigate"||e.action==="public_statement") return "gov";
 if(e.utterance) return "talk";
 return "idle";
}
const P=pid=>`<span class="pill" data-pid="${pid}">${pid}</span>`;
function summary(e){
 const t=e.target;
 switch(e.action){
  case "make_offer": return `${P(t)} に取得を申し入れ（名義「${esc(e.under_name||"—")}」）`;
  case "accept_offer": {
   const tr=(D.ledger||[]).find(r=>r.kind==="transfer"&&r.step===e.step&&r.offer_id===t);
   return tr?`${P(tr.parcel_id)} の名義を「${esc(tr.under_name)}」へ移した`
            :`申し入れ ${esc(t)} に応じた`;}

  case "reject_offer": return `申し入れ ${esc(t)} に応じなかった`;
  case "withdraw_offer": return `申し入れ ${esc(t)} を取り下げ`;

  case "unlist": return `${P(t)} の売り出しを取り下げ`;

  case "relocate": return `${P(t)} へ店を移す`;
  case "close_shop": return `<b>店を畳んだ</b>`;
  case "move_out": return `<b>この街から転出した</b>`;
  case "circulate_listing": return `${esc(nameOf[t]||t)} に売り情報を流す`;
  case "approach_owner": return `${esc(nameOf[t]||t)} に売却を打診`;
  case "publish": return `<b>記事を出した</b>`;
  case "investigate": return `登記簿を調べた`;
  case "silent": return `今月は書かなかった`;
  case "enact_ordinance": return `<b>条例を施行「${esc(t)}」</b>`;
  case "study_ordinance": return `規制の検討を進める`;
  case "request_report": return `${esc(nameOf[t]||t)} に説明を求めた`;
  case "public_statement": return `声明を出した`;
  case "monitor": case "hold": case "wait": case "continue": return `静観`;
  default: return esc(e.action);
 }
}
function beatHtml(e){
 const c=cat(e), label=(CATS.find(x=>x[0]===c)||["","?"])[1];
 let h=`<div class="beat" data-cat="${c}" data-id="${e.id}" data-step="${e.step}">`
  +`<span class="tag t-${c}">${label}</span><div class="bd">`
  +`<div class="hl"><span class="who">${esc(e.name)}</span>`
  +`<span class="small">（${esc(ROLEJA[e.role]||e.role)}）</span> ${summary(e)}</div>`;
 if(!e.ok) h+=`<div class="sub">→ 帳簿上は<b>不成立</b>（${esc(e.outcome)}${e.why?" / "+esc(e.why):""}）。コードは補正していない。</div>`;
 if(e.reasoning) h+=`<div class="sub">理由：${esc(e.reasoning)}</div>`;
 if(e.utterance) h+=`<div class="say ${e.ch==="public"?"pub":e.ch==="private"?"pri":""}">`
  +`${e.ch==="private"?"（"+esc(nameOf[e.to]||e.to)+"へ）":""}「${esc(e.utterance)}」</div>`;
 return h+`</div></div>`;
}

 +opts.map(o=>`<option value="${o[0]}">${o[1]}</option>`).join(""); }
fillSel($("#asel"),D.agents.map(a=>[a.id,`${a.name}（${ROLEJA[a.role]||a.role}）`]),"すべて");
fillSel($("#psel2"),D.parcels.map(p=>[p.pid,`${p.pid}（${p.block}）`]),"すべて");
fillSel($("#msel"),Array.from({length:nSteps},(_,i)=>[i+1,`第${i+1}月`]),"全期間");
fillSel($("#psel"),D.parcels.map(p=>[p.pid,`${p.pid}（${p.block}・${p.use}）`]),"（区画を選ぶ）");
fillSel($("#tsel"),D.agents.map(a=>[a.id,`${a.name}（${ROLEJA[a.role]||a.role}）`]),"（選ぶ）");
function chronicle(){
 const aid=$("#asel").value, pid=$("#psel2").value, mo=$("#msel").value;
 const q=$("#q").value.trim();
 let rows=D.events.filter(e=>active.has(cat(e)));
 if(aid) rows=rows.filter(e=>e.id===aid);
 if(mo) rows=rows.filter(e=>e.step===+mo);
 if(pid){
  const offs=new Set((D.ledger||[]).filter(r=>r.parcel_id===pid&&r.offer_id).map(r=>r.offer_id));
  rows=rows.filter(e=>e.target===pid||offs.has(e.target)
   ||(e.utterance||"").includes(pid)||(e.reasoning||"").includes(pid));
 }
 if(q) rows=rows.filter(e=>(e.utterance+e.reasoning+e.name).includes(q));
 $("#cnt").textContent=`${rows.length} 件`;
 let h="",cur=-1;
 rows.forEach(e=>{ if(e.step!==cur){cur=e.step; h+=`<div class="mo">第${cur}月</div>`;} h+=beatHtml(e); });
 $("#chron").innerHTML=h||'<p class="small">条件に合う出来事がない。</p>';
}
$("#catbar").addEventListener("click",ev=>{
 const b=ev.target.closest("button"); if(!b)return;
 if(b.id==="allcat"){ active=new Set(CATS.map(c=>c[0]));
  document.querySelectorAll(".catb").forEach(x=>x.classList.add("on")); chronicle(); return; }
 const c=b.dataset.c; if(active.has(c)){active.delete(c);b.classList.remove("on");}
 else{active.add(c);b.classList.add("on");} chronicle();
});
["#asel","#psel2","#msel"].forEach(s=>$(s).addEventListener("change",chronicle));
$("#q").addEventListener("input",chronicle);
$("#reset").addEventListener("click",()=>{
 $("#asel").value="";$("#psel2").value="";$("#msel").value="";$("#q").value="";
 active=new Set(CATS.filter(c=>c[0]!=="idle").map(c=>c[0]));
 document.querySelectorAll(".catb").forEach(x=>x.classList.toggle("on",active.has(x.dataset.c)));
 chronicle();
});
document.addEventListener("click",ev=>{
 const p=ev.target.closest(".pill"); if(!p)return;
 selPid=p.dataset.pid; $("#psel").value=selPid; renderParcel(); draw(+slider.value);
 $("#psel").scrollIntoView({behavior:"smooth",block:"center"});
});

/* ---------- 区画の履歴 ---------- */
function renderParcel(){
 const pid=$("#psel").value;
 selPid=pid||null; draw(+slider.value);
 if(!pid){ $("#phist").innerHTML='<p class="small">マップの区画をクリックするか、上で区画を選ぶ。</p>';
  $("#pinfo").textContent=""; return; }
 const p=PARCEL[pid];
 const last=D.frames[D.frames.length-1];
 $("#pinfo").innerHTML=`${p.block}／用途 ${esc(last.use[pid])}`
  +`／最終の名義 <b>${esc(last.registered[pid])}</b>`;
 const offs=new Set((D.ledger||[]).filter(r=>r.parcel_id===pid&&r.offer_id).map(r=>r.offer_id));
 const recs=(D.ledger||[]).filter(r=>r.parcel_id===pid
   ||(r.offer_id&&offs.has(r.offer_id)));
 const rowFor=(r)=>{
  const who=nameOf[r.by||r.from_id||r.seller||r.agent_id]||r.by||r.from_id||"";
  switch(r.kind){
   case "offer": return [`申入`,`${esc(r.under_name)} 名義での取得の申し入れ（${r.offer_id}）`];
   case "consult": return [`相談`,`${esc(nameOf[r.by]||r.by)} が ${esc(nameOf[r.to]||r.to)} に相談（${r.consult_id}）`];
   case "advice": return [`回答`,`${esc(nameOf[r.by]||r.by)} が ${esc(nameOf[r.to]||r.to)} の相談に答えた（${r.consult_id}）`];
   case "keep": return [`応じない`,`${esc(nameOf[r.by]||r.by)} が申し入れに応じなかった（${r.offer_id}）`];
   case "hold": return [`保留`,`${esc(nameOf[r.by]||r.by)} は今月決めなかった（${r.offer_id}）`];
   case "transfer": return [`移転`,`${esc(nameOf[r.seller]||r.seller)} → 名義「${esc(r.under_name)}」`];
   case "unlist": return [`取下`,`${esc(who)} が売り出しを取り下げ`];

   case "tenancy_end": return [`退去`,`${esc(nameOf[r.tenant]||r.tenant)} が退去（${esc(r.reason)}）`];
   case "relocate": return [`入居`,`${esc(nameOf[r.agent_id]||r.agent_id)} が入居`];
   default: return null;
  }
 };
 let h='<table><thead><tr><th>月</th><th>種別</th><th>内容</th><th>そのときの言い分</th></tr></thead><tbody>';
 let n=0;
 recs.forEach(r=>{
  const rw=rowFor(r); if(!rw)return; n++;
  const actor=r.by||r.from_id||r.seller||r.agent_id||r.tenant;
  const e=D.events.find(x=>x.step===r.step&&x.id===actor);
  h+=`<tr><td>第${r.step}月</td><td><b>${rw[0]}</b></td><td>${rw[1]}</td>`
   +`<td class="small">${e&&e.reasoning?esc(e.reasoning):""}`
   +`${e&&e.utterance?"<br>「"+esc(e.utterance)+"」":""}</td></tr>`;
 });
 h+="</tbody></table>";
 $("#phist").innerHTML=n?h:'<p class="small">この区画には、期間中なにも起きなかった。</p>';
}
$("#psel").addEventListener("change",renderParcel);

/* ---------- エージェント別スレッド ---------- */
function renderThread(){
 const id=$("#tsel").value;
 if(!id){ $("#thread").innerHTML='<p class="small">エージェントを選ぶと、その1体の36か月が一本で読める。</p>';
  $("#tinfo").textContent=""; return; }
 let rows=D.events.filter(e=>e.id===id);
 if($("#thideidle").checked) rows=rows.filter(e=>cat(e)!=="idle");
 const acts={}; rows.forEach(e=>{acts[e.action]=(acts[e.action]||0)+1;});
 $("#tinfo").innerHTML=`${rows.length}か月ぶん ／ `
  +Object.entries(acts).sort((a,b)=>b[1]-a[1]).map(([a,c])=>`${esc(a)}×${c}`).join("、");
 let h="";
 rows.forEach(e=>{
  h+=`<div class="mo">第${e.step}月</div>`+beatHtml(e);
  if(e.memory) h+=`<div class="beat" style="border-bottom:none;padding-top:0;">`
   +`<span class="tag t-idle">記憶</span><div class="bd"><div class="mem">${esc(e.memory)}</div></div></div>`;
 });
 $("#thread").innerHTML=h||'<p class="small">該当なし。</p>';
}
$("#tsel").addEventListener("change",renderThread);
$("#thideidle").addEventListener("change",renderThread);

/* ---------- step 連動 ---------- */
const slider=$("#slider"); slider.max=nSteps; slider.value=nSteps;
function stepInfo(step){
 const r=D.kpi[step-1];
 if(!r) return "第0月（初期状態）";
 return `第${step}月 — 取得主体シェア <b>${pct(r.acquirer_share)}</b> ／ HHI ${r.hhi.toFixed(3)}`
  +` ／ 累計成約 ${r.transfers_cum} ／ 営業中の店 ${r.shops_occupied}/${r.shops_total}`
  +` ／ 転出率 ${pct(r.resident_outflow)}`;
}
function update(){
 const s=+slider.value;
 $("#stepnum").textContent=s===0?"第0月":"第"+s+"月";
 draw(s); $("#stepinfo").innerHTML=stepInfo(s);
}
slider.addEventListener("input",update);
let timer=null;
$("#play").addEventListener("click",()=>{
 if(timer){clearInterval(timer);timer=null;$("#play").textContent="▶ 再生";return;}
 if(+slider.value>=nSteps) slider.value=0;
 $("#play").textContent="⏸ 停止";
 timer=setInterval(()=>{ if(+slider.value>=nSteps){clearInterval(timer);timer=null;
  $("#play").textContent="▶ 再生";return;} slider.value=+slider.value+1; update(); },420);
});

/* ---------- 出来事 ---------- */
let ev="";
ev+="<h3>報道</h3>";
ev+=D.publications.length?D.publications.map(p=>
 `<div class="beat"><span class="tag t-media">第${p.step}月</span><div class="bd">
  <div class="hl">${esc(p.headline)}</div></div></div>`).join("")
 :"<p class='small'>期間中、この街のことは記事にならなかった。</p>";
ev+="<h3>規制</h3>";
ev+=D.ordinances.length?D.ordinances.map(o=>
 `<div class="beat"><span class="tag t-gov">第${o.step}月</span><div class="bd">
  <div class="hl">${esc(o.title)}</div><div class="sub">${esc(o.body)}</div></div></div>`).join("")
 :"<p class='small'>期間中、土地取引の規制は発動しなかった。</p>";
$("#events").innerHTML=ev;

update(); chronicle(); renderParcel(); renderThread();
</script></body></html>
