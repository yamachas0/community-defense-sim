て言うんだけど、この共同浴場の世話だけは、まだ続けたいんだよなあ。"}, {"step": 1, "from": "HH05", "role": "household", "name": "駅裏の大家さん", "text": "皆さん、おはようございます。今日も野菜が新鮮ですね。"}, {"step": 1, "from": "HH06", "role": "household", "name": "線路沿いの持ち主さん", "text": "大家さん、いつもお世話になります。駅前の土地のことなんですが、少しご相談したいことがありまして。今度の町内会で少しお時間いただけますでしょうか？"}, {"step": 1, "from": "HH07", "role": "household", "name": "東団地の持ち主さん", "text": "おはようございます。今日はどちらへ？"}, {"step": 1, "from": "HH09", "role": "household", "name": "灯台下の持ち主さん", "text": "いやはや、今日もよく温まる湯ですな。湾岸大通りの店さん、駅前通りの持ち主さん、いつもありがとうございます。ところで、駅前通りの持ち主さんのところ、最近何か変わったことでもありましたか？"}, {"step": 1, "from": "HH10", "role": "household", "name": "魚市場前の持ち主さん", "text": "こんにちは。うち、最近越してきた魚市場前の持ち主です。子どもが同じ小学校で。よろしくお願いします。"}, {"step": 1, "from": "HH11", "role": "household", "name": "波止場通りの持ち主さん", "text": "おはようございます。今日も早いですね。"}, {"step": 1, "from": "HH12", "role": "household", "name": "本町通りの持ち主さん", "text": "皆さん、こんにちは。うちの旧店舗の賃借人から、改装したいと相談があったのですが、費用面で難航しているようです。商店街のためにも何とかしたいのですが、何かご存知でしたら教えていただけますか？"}, {"step": 1, "from": "HH14", "role": "household", "name": "商店街はずれの持ち主さん", "text": "おはようございます。今日もいいお湯ですね。湯坂の古家、また少し傷みが進んだように見えますが、あれはどうするんでしょうね。"}, {"step": 1, "from": "HH16", "role": "household", "name": "岬道の持ち主さん", "text": "おはようございます。今日はいい天気ですね。"}, {"step": 1, "from": "MD01", "role": "media", "name": "地域紙の記者さん", "text": "皆さん、おはようございます。今日も活気がありますね。最近、何か面白い話題はありますか？"}, {"step": 1, "from": "MD02", "role": "media", "name": "地域ウェブの記者さん", "text": "皆さん、おはようございます。今日も早いですね。最近、商店街の方で何か動きはありますか？"}, {"step": 1, "from": "MU01", "role": "municipality", "name": "市役所のまちづくり担当さん", "text": "こんにちは。最近の観光客の入り具合はいかがですか？地域事業者さんから何かお話は伺っていますか？"}, {"step": 1, "from": "MU02", "role": "municipality", "name": "市役所の観光産業担当さん", "text": "おはようございます。今日は早いですね。何か市民の方からご相談事でもありましたか？"}, {"step": 1, "from": "BR02", "role": "broker", "name": "駅前の仲介さん", "text": "そうですね、最近は空き家や空き店舗の相談が増えているような気がします。皆さん、何か気になる物件とかありますか？"}, {"step": 1, "from": "BZ02", "role": "business", "name": "潮見横丁の店さん", "text": "皆さん、おはようございます。今日も変わらず、というところでしょうか。面白い話は特にありませんが、皆さんの取材のおかげで、街も少しは賑わっているように見えます。"}, {"step": 1, "from": "HH01", "role": "household", "name": "浜町の大家さん", "text": "ええ、ええ、もちろんですわ。町内会、お待ちしておりますわ。"}, {"step": 1, "from": "HH02", "role": "household", "name": "潮見横丁の大家さん", "text": "おはようございます。今日も新鮮ですね。"}, {"step": 1, "from": "HH03", "role": "household", "name": "湾岸大通りの大家さん", "text": "皆さん、今日も暑いですね。うちの空き地の草が伸びてきて、手入れが大変で困っています。"}, {"step": 1, "from": "HH04", "role": "household", "name": "駅前通りの持ち主さん", "text": "いやあ、灯台下の持ち主さん、お気遣いありがとう。最近どうも体のあちこちがね、坂道なんかもつらくて。この共同浴場の世話だけは、もうしばらく続けたいんだが、家のこともそろそろ考えんと、とは思うんだがね。商店街はずれの持ち主さんが言ってた湯坂の古家も、まあ、うちのことなんだがね。県外の子供たちも、そろそろこっちを出ていけって言うしね。"}, {"step": 1, "from": "HH05", "role": "household", "name": "駅裏の大家さん", "text": "そうですね。それにしても、最近空き家が増えたように感じませんか？"}, {"step": 1, "from": "HH07", "role": "household", "name": "東団地の持ち主さん", "text": "旧店舗の件、改装費用ですか。うちでもいくつか資材を融通できるかもしれませんが、まずは見積もりを見せていただかないと。商店街が賑わうのは良いことです。"}, {"step": 1, "from": "HH08", "role": "household", "name": "船着場裏の持ち主さん", "text": "おはようございます。"}, {"step": 1, "from": "HH09", "role": "household", "name": "灯台下の持ち主さん", "text": "そうなんですね。共同浴場の世話は、地域の財産ですからね。湯坂の古家も気になりますが、まずはご自身の体調が第一ですよ。"}, {"step": 1, "from": "HH10", "role": "household", "name": "魚市場前の持ち主さん", "text": "改めて、ご挨拶させてください。うちの子がそちらのお子さんと同級生と聞いて、心強く思っています。この辺りは初めてで、まだ勝手がわからないのですが、何か気をつけることなどありますか？"}, {"step": 1, "from": "HH11", "role": "household", "name": "波止場通りの持ち主さん", "text": "そうなんですね、こちらこそよろしくお願いします。うちも子どもがこの小学校に通っていて。来月、町内会があるのですが、ご都合が合えばぜひ参加してください。"}, {"step": 1, "from": "HH12", "role": "household", "name": "本町通りの持ち主さん", "text": "そうなんですよ。商店街のためにも、うまくいくといいのですが。どなたか、何かご存知でしたら。"}, {"step": 1, "from": "HH14", "role": "household", "name": "商店街はずれの持ち主さん", "text": "そうですね、湯坂の古家、放っておくわけにもいかないんですが、なかなか手が回らなくて。父のこともありますし…。町内会で何か良い話が出るといいんですが。"}, {"step": 1, "from": "HH15", "role": "household", "name": "宮の下の持ち主さん", "text": "皆さん、おはようございます。"}, {"step": 1, "from": "HH16", "role": "household", "name": "岬道の持ち主さん", "text": "おはようございます。いい天気ですね。旧店舗のこと、大変ですね。何か私にできることがあれば言ってください。"}, {"step": 1, "from": "MD01", "role": "media", "name": "地域紙の記者さん", "text": "皆さん、おはようございます。今日も早いですね。最近、商店街の方で何か動きはありますか？"}, {"step": 1, "from": "MD02", "role": "media", "name": "地域ウェブの記者さん", "text": "駅前の仲介さん、潮見横丁の店さん、地域紙の記者さん、皆さん最近どうですか？商店街で空き店舗が増えているという話もありますが、実際はどうなんでしょうか。土地の相続や後継者問題で、手放したいと考えている方もいるのでしょうか。"}, {"step": 1, "from": "MU01", "role": "municipality", "name": "市役所のまちづくり担当さん", "text": "いえ、市民の方ではなく、担当者さんにお伺いしたかったんです。最近の観光客の入り具合や、地域事業者さんから何かお話は伺っていますか？"}, {"step": 1, "from": "MU02", "role": "municipality", "name": "市役所の観光産業担当さん", "text": "おはようございます。今日は早いですね。何か市民の方からご相談事でもありましたか？"}, {"step": 1, "from": "BR01", "role": "broker", "name": "二代目の仲介さん", "text": "そういえば、この前話した湾岸大通りの大家さん、空き地の草が大変だって言ってたけど、最近空き家が増えてるって話、駅前の仲介さんはどう思う？"}, {"step": 1, "from": "BR02", "role": "broker", "name": "駅前の仲介さん", "text": "二代目の仲介さん、こんにちは。午前中の駅前は賑わってましたね。最近、街の空き家や後継者不足のご相談、増えてませんか？"}, {"step": 1, "from": "MD01", "role": "media", "name": "地域紙の記者さん", "text": "おはようございます。最近、湾岸のスペースポート構想について、市役所ではどのような動きがありますか？"}, {"step": 1, "from": "MU01", "role": "municipality", "name": "市役所のまちづくり担当さん", "text": "担当者さん、失礼しました。市民の方からではなく、まちづくり担当として、最近の観光客の入り具合や、地域事業者さんから何かお話は伺っていますか？　記事の参考にさせてもらおうと思いまして。"}, {"step": 1, "from": "MU02", "role": "municipality", "name": "市役所の観光産業担当さん", "text": "おはようございます。観光客の入り具合ですが、例年並みといったところでしょうか。地域事業者さんからは、特に大きな問題は伺っていませんが、今後の見通しについて少し不安を感じているという声はありますね。"}, {"step": 1, "from": "BR01", "role": "broker", "name": "二代目の仲介さん", "text": "ええ、確かにご相談は増えているように感じます。特に古い物件や、遠方にお住まいの方が相続された土地など、どうしたら良いか分からないという方が多いですね。"}, {"step": 1, "from": "BR02", "role": "broker", "name": "駅前の仲介さん", "text": "二代目の仲介さん、こんにちは。先ほどの記者さんたちの話を聞いていて思ったのですが、最近、街全体で空き家や後継者不足のご相談が増えているような気がします。何かそういったお話、耳にされますか？"}, {"step": 1, "from": "MD01", "role": "media", "name": "地域紙の記者さん", "text": "まちづくり担当さん、先ほどの質問ですが、商店街の空き店舗対策や、地域活性化に向けた具体的な計画など、現在市で検討されていることはありますでしょうか？"}, {"step": 1, "from": "MU01", "role": "municipality", "name": "市役所のまちづくり担当さん", "text": "担当者さん、ありがとうございます。例年並みとのことですが、具体的にどのような不安の声が聞かれますか？また、商店街や旅館の後継者不足について、何か具体的な動きがあれば教えていただけますでしょうか？記者さんもいらっしゃいますし、地域全体で情報共有できればと思います。"}, {"step": 1, "from": "MU02", "role": "municipality", "name": "市役所の観光産業担当さん", "text": "まちづくり担当さん、そうですね。事業者さんからは、具体的な苦情というよりは、今後の見通しについて少し様子を見たい、といった声が聞かれます。記者さん、スペースポート構想については、まだ具体的な計画段階ではなく、情報収集を進めているところです。"}, {"step": 1, "from": "BR01", "role": "broker", "name": "二代目の仲介さん", "text": "いやー、最近、この辺りでも空き家が目につくようになってきましたね。皆さんのお宅では、何か変わったことはありますか？"}, {"step": 1, "from": "BR02", "role": "broker", "name": "駅前の仲介さん", "text": "最近、街の空き家や後継者不足のご相談、増えているように感じるのですが、市役所さんの方では何かそういった動きはありますか？"}, {"step": 1, "from": "BZ02", "role": "business", "name": "潮見横丁の店さん", "text": "皆さん、今日も一日お疲れ様です。最近、街の様子はどうですか？"}, {"step": 1, "from": "HH01", "role": "household", "name": "浜町の大家さん", "text": "あら、〇〇さん。ご機嫌よう。回覧板、お持ちしましたよ。"}, {"step": 1, "from": "HH03", "role": "household", "name": "湾岸大通りの大家さん", "text": "皆さん、こんばんは。この前のスーパーで話したんですが、うちの湾岸大通りにある空き地の草刈りが、本当に大変でして。広さもあるので、毎月のように手入れをするのが負担になってきています。何か、有効活用できるようなアイデアとか、ご存知ないでしょうか？"}, {"step": 1, "from": "HH04", "role": "household", "name": "駅前通りの持ち主さん", "text": "いやあ、灯台下の持ち主さん、お気遣いありがとう。最近どうも体のあちこちがね、坂道なんかもつらくて。この共同浴場の世話だけは、もうしばらく続けたいんだが、家のこともそろそろ考えんと、とは思うんだがね。商店街はずれの持ち主さんが言ってた湯坂の古家も、まあ、うちのことなんだがね。県外の子供たちも、そろそろこっちを出ていけって言うしね。"}, {"step": 1, "from": "HH06", "role": "household", "name": "線路沿いの持ち主さん", "text": "大家さん、先日は回覧板ありがとうございました。駅前の土地のことですが、あの土地、今どうなっているかご存知ですか？"}, {"step": 1, "from": "HH09", "role": "household", "name": "灯台下の持ち主さん", "text": "いやあ、今日はいい天気になりましたね。神社の掃除も捗ります。そういえば、駅前通りの持ち主さんのところ、最近どうですか？湯坂の古家も気になりますが。"}, {"step": 1, "from": "HH11", "role": "household", "name": "波止場通りの持ち主さん", "text": "皆様、ごきげんよう。"}, {"step": 1, "from": "HH14", "role": "household", "name": "商店街はずれの持ち主さん", "text": "湾岸大通りの大家さん、先ほど駅前通りの持ち主さんが仰っていた湯坂の古家、あれは大家さんのところだったんですね。うちも古い家なので、他人事ではないなと思いまして。父の介護で手一杯なのですが、このままにしておくのも心配で。"}, {"step": 1, "from": "HH15", "role": "household", "name": "宮の下の持ち主さん", "text": "皆さん、こんにちは。今日も境内のお掃除、ご苦労様です。そういえば、S1のスーパーで駅裏の大家さんが空き家が増えたって言ってましたけど、この辺りでもそんな感じですかね。"}, {"step": 1, "from": "MD01", "role": "media", "name": "地域紙の記者さん", "text": "皆さん、お疲れ様です。先ほど市役所の方に少しお話を伺ったのですが、商店街の空き店舗や、後継者不足について、今後どのようにしていけば良いのか、皆さんのご意見も伺いたくて。何か気になる動きや、こうなったら良いな、というお考えはありますか？"}, {"step": 1, "from": "MU01", "role": "municipality", "name": "市役所のまちづくり担当さん", "text": "こんにちは。先ほど市役所の担当者さんと話していたのですが、観光客の入りは例年並みでも、地域事業者さんからは今後の見通しについて不安の声があるとのことでした。駅前の仲介さんは、日頃から様々な方とお話されていると思いますが、具体的にどのような不安を感じていらっしゃる方が多いのでしょうか？ 商店街や旅館の後継者不足についても、何かお話は伺いますか？"}, {"step": 1, "from": "BR01", "role": "broker", "name": "二代目の仲介さん", "text": "駅前通りの持ち主さんの話、気になりました。ご自宅のこと、もしよろしければ、こちらでも何かお手伝いできることがあるかもしれません。一度、駅前の事務所ででも、お話をお聞かせいただけませんか？"}, {"step": 1, "from": "BR02", "role": "broker", "name": "駅前の仲介さん", "text": "こんにちは。そうですね、不動産仲介の立場から見ると、高齢化や後継者不足で「この先、どうしたらいいのだろう」と悩んでいらっしゃる方が増えているように感じます。特に、昔から住んでいる方や、相続で土地を受け継いだ方々が、維持管理の負担や建物の老朽化について相談に来られるケースが目につきます。市役所さんの方でも、そういった課題に対して何か具体的な取り組みを検討されていたりしますか？"}, {"step": 1, "from": "BZ02", "role": "business", "name": "潮見横丁の店さん", "text": "皆さんの仰る通り、街の空き家や空き店舗の問題は、私たちのような商売をしている者にとっても気になるところです。特に、後継者不足は深刻な問題だと感じています。"}, {"step": 1, "from": "HH01", "role": "household", "name": "浜町の大家さん", "text": "あら、〇〇さん。ご機嫌よう。回覧板、お持ちしましたよ。"}, {"step": 1, "from": "HH02", "role": "household", "name": "潮見横丁の大家さん", "text": "駅前の土地ですか？いいえ、何も聞いていませんね。どうされたんですか？"}, {"step": 1, "from": "HH03", "role": "household", "name": "湾岸大通りの大家さん", "text": "先ほども話したんですが、うちの湾岸大通りにある空き地の草刈りが、本当に大変でして。広さもあるので、毎月のように手入れをするのが負担になってきています。何か、有効活用できるようなアイデアとか、ご存知ないでしょうか？"}, {"step": 1, "from": "HH04", "role": "household", "name": "駅前通りの持ち主さん", "text": "いやあ、二代目の仲介さん、船着場裏の持ち主さん、波止場通りの持ち主さん、ありがとうございます。最近どうも体のあちこちがね、坂道なんかもつらくて。この共同浴場の世話だけは、もうしばらく続けたいんだが、家のこともそろそろ考えんと、とは思うんだがね。商店街はずれの持ち主さんが言ってた湯坂の古家も、まあ、うちのことなんだがね。県外の子供たちも、そろそろこっちを出ていけって言うしね。"}, {"step": 1, "from": "HH06", "role": "household", "name": "線路沿いの持ち主さん", "text": "大家さん、先日は回覧板ありがとうございました。駅前の土地のことですが、あの土地、今どうなっているかご存知ですか？"}, {"step": 1, "from": "HH07", "role": "household", "name": "東団地の持ち主さん", "text": "旧店舗の改装費用の件ですが、うちでも資材の融通で協力できるかもしれません。商店街が賑わうのは良いことです。何か情報があれば共有しましょう。"}, {"step": 1, "from": "HH08", "role": "household", "name": "船着場裏の持ち主さん", "text": "そうですね。空き家が増えているのは気になりますね。"}, {"step": 1, "from": "HH09", "role": "household", "name": "灯台下の持ち主さん", "text": "そうですね、空き家が増えるのは気になるところです。この辺りでも、昔からある建物は、後を継ぐ人がいなくて困っているという話をよく聞きます。駅前通りの持ち主さんのところも、湯坂の古家、どうなるんでしょうね。"}, {"step": 1, "from": "HH11", "role": "household", "name": "波止場通りの持ち主さん", "text": "皆様、ごきげんよう。"}, {"step": 1, "from": "HH14", "role": "household", "name": "商店街はずれの持ち主さん", "text": "湾岸大通りの大家さんの空き地、大変ですよね。うちも湯坂の古家が、このままにしておくのは心配で。記者さん、商店街の空き店舗や後継者不足についてですが、うちのような古い家も、どうにか活用できないかと考えています。大家さん、後ほど湯坂の古家の件で少しお話よろしいでしょうか。"}, {"step": 1, "from": "HH15", "role": "household", "name": "宮の下の持ち主さん", "text": "そういえば、駅裏の大家さんが言っていたように、最近空き家が増えたように感じますね。この辺りでも、後継者不足で悩んでいる家があるのでしょうか。"}, {"step": 1, "from": "MD01", "role": "media", "name": "地域紙の記者さん", "text": "湾岸大通りの大家さん、商店街はずれの持ち主さん、お話ありがとうございます。空き家や空き地の問題は、街の活性化にも関わる大きな課題ですよね。駅前の仲介さん、最近、空き家や空き店舗の相談が増えているとのことですが、具体的にどのような物件が多いのでしょうか？ また、相続や後継者問題で、手放したいと考えている方の割合などは、把握されていますか？"}, {"step": 1, "from": "MU01", "role": "municipality", "name": "市役所のまちづくり担当さん", "text": "そうなんですね。空き家や後継者不足のご相談が増えているとのこと、具体的にはどのような物件や状況が多いのでしょうか？例えば、築年数が古い物件や、特定の地区でそういった傾向が見られるなど、何か特徴はありますか？"}, {"step": 1, "from": "BR01", "role": "broker", "name": "二代目の仲介さん", "text": "駅前の仲介さん、先ほどの駅前通りの持ち主さんの話、気になりました。ご自宅のこと、もしよろしければ、こちらでも何かお手伝いできることがあるかもしれません。一度、事務所ででも、お話をお聞かせいただけませんか？"}, {"step": 1, "from": "BR02", "role": "broker", "name": "駅前の仲介さん", "text": "市役所のまちづくり担当さん、こんにちは。最近、街の空き家や後継者不足のご相談、増えているように感じるのですが、市役所さんの方では何かそういった動きはありますか？"}, {"step": 1, "from": "BZ04", "role": "business", "name": "駅裏の事業所さん", "text": "商店街の空き店舗や後継者不足は、街全体の活性化に関わる重要な課題ですね。私たちのコワーキングスペースでは、移住者やフリーランスの方々が新しい事業を始めるための支援も行っています。古い建物をリノベーションして、シェアオフィスやアトリエ、あるいは地域住民が集まれるような多目的なスペースとして活用するアイデアがあれば、若い世代の移住や起業を後押しできるのではないでしょうか。湾岸大通りの空き地も、例えば期間限定のマルシェやイベントスペースとして活用することで、街に賑わいが生まれるかもしれません。"}, {"step": 1, "from": "HH01", "role": "household", "name": "浜町の大家さん", "text": "線路沿いの持ち主さん、どうぞよろしくお願いいたします。駅前の土地のこと、私も気になっておりましたので、皆さんとお話しできるのを楽しみにしています。"}, {"step": 1, "from": "HH02", "role": "household", "name": "潮見横丁の大家さん", "text": "駅前の土地の件ですが、私からは何も聞いておりません。どうされたのですか？"}, {"step": 1, "from": "HH03", "role": "household", "name": "湾岸大通りの大家さん", "text": "皆さん、本日はお集まりいただきありがとうございます。湾岸大通りの角にある私の空き地なのですが、毎月草刈りの手入れをするのが本当に負担になってきておりまして。広さもあるので、このままにしておくのも勿体ないですし、何か有効な活用方法はないかと考えております。皆さんのような経験豊富な方々から、何か良いアイデアや、ご存知の情報などがあれば、ぜひお聞かせ願えませんでしょうか。"}, {"step": 1, "from": "HH04", "role": "household", "name": "駅前通りの持ち主さん", "text": "皆様、お集まりいただきありがとうございます。最近、体も思うように動かなくなりましてね、坂道や家の段差もこたえるようになってきました。県外の子供たちも、そろそろこちらを出ていけと申すのですが、この共同浴場の世話だけは、もうしばらく続けたいと思っております。商店街はずれの持ち主さんがおっしゃっていた「湯坂の古家」というのは、実は私の自宅のことなのです。"}, {"step": 1, "from": "HH05", "role": "household", "name": "駅裏の大家さん", "text": "皆さん、本日はお集まりいただきありがとうございます。最近、街の空き家が増えているように感じますが、皆様はどう思われますか？特に、二代目の仲介さんや、市役所のまちづくり担当さん、観光産業担当さんのご意見を伺いたいです。"}, {"step": 1, "from": "HH06", "role": "household", "name": "線路沿いの持ち主さん", "text": "浜町の大家さん、先日は駅前の土地の件でご相談のお時間をいただき、ありがとうございました。あの土地の現状について、何かご存知のことはありますでしょうか？"}, {"step": 1, "from": "HH07", "role": "household", "name": "東団地の持ち主さん", "text": "本町通りの旧店舗の改装費用の件ですが、うちでも資材の融通で協力できるかもしれません。商店街が賑わうのは良いことです。何か情報があれば共有しましょう。"}, {"step": 1, "from": "HH08", "role": "household", "name": "船着場裏の持ち主さん", "text": "湾岸大通りの大家さん、空き地の草刈りは大変ですよね。うちはもう売却したので楽になりましたよ。"}, {"step": 1, "from": "HH09", "role": "household", "name": "灯台下の持ち主さん", "text": "皆さん、こんにちは。今日も集まりましたね。最近、街のあちこちで建物の老朽化や、後を継ぐ人がいなくて困っているという話をよく聞きます。うちの店もそうですが、古い建物は維持が大変で。東団地の持ち主さんのところは、何かそういったお話はありますか？宮の下の持ち主さんのところはどうですか？"}, {"step": 1, "from": "HH10", "role": "household", "name": "魚市場前の持ち主さん", "text": "皆様、はじめまして。最近この地区に越してきた、魚市場前の持ち主と申します。子どもが同じ小学校に通っていると伺い、ご挨拶に参りました。まだまだこの辺りのことは不慣れなもので、皆様のお知恵を拝借できればと思っております。どうぞよろしくお願いいたします。"}, {"step": 1, "from": "HH11", "role": "household", "name": "波止場通りの持ち主さん", "text": "皆様、本日はお集まりいただきありがとうございます。最近、空き家が増えているという話も聞きますが、皆様のお住まいの地域ではいかがでしょうか。また、新しい方もいらっしゃると伺っています。どうぞよろしくお願いいたします。"}, {"step": 1, "from": "HH12", "role": "household", "name": "本町通りの持ち主さん", "text": "皆様、本日はお集まりいただきありがとうございます。私の旧店舗の賃借人から改装の相談を受けているのですが、費用面で難航しているようです。商店街のためにも何とかしたいのですが、皆様のお知り合いで、改装費用について何か情報をお持ちの方はいらっしゃいませんか？特に、東団地の持ち主さん、資材の件、もう少し詳しくお伺いできますでしょうか？"}, {"step": 1, "from": "HH14", "role": "household", "name": "商店街はずれの持ち主さん", "text": "湾岸大通りの大家さん、先ほどの空き地の件ですが、湯坂の古家も、うちのことでして。父の介護で手一杯なのと、家の傷みも進んでいて、どうしたものかと悩んでいます。もしよろしければ、後ほど少しお話を聞かせていただけませんか？"}, {"step": 1, "from": "HH15", "role": "household", "name": "宮の下の持ち主さん", "text": "皆さん、本日はお集まりいただきありがとうございます。S1のスーパーでも話題になりましたが、最近、この辺りでも空き家が増えているように感じます。皆様のところでは、何か後継者不足などで困っているお話はありますでしょうか？"}, {"step": 1, "from": "HH16", "role": "household", "name": "岬道の持ち主さん", "text": "皆さん、こんにちは。今日は町内会の寄り合いですね。最近、北山裏の古家を売却したところです。少し身軽になった気分です。"}, {"step": 1, "from": "MD01", "role": "media", "name": "地域紙の記者さん", "text": "皆さん、本日はお集まりいただきありがとうございます。地域紙の記者として、日頃から皆さんの活動を取材させていただいております。さて、本日は特に、商店街の空き店舗問題や、後継者不足について、皆さんがどのように感じていらっしゃるのか、率直なご意見を伺えればと思っております。また、湾岸大通りの大家さんの空き地の手入れや、商店街はずれの持ち主さんの実家の相続問題など、具体的な課題についても、皆さんのご経験やご意見をお聞かせいただけると幸いです。これらの声が、今後の街づくりの一助となればと考えております。"}, {"step": 1, "from": "MD02", "role": "media", "name": "地域ウェブの記者さん", "text": "皆さん、こんにちは。本日はお集まりいただきありがとうございます。S1の時にも少しお話が出ましたが、最近、駅前の仲介さんや大家さんの方で、空き家や空き店舗に関するご相談は増えていますでしょうか？相続や後継者不足で、土地を手放すことを考えていらっしゃる方がいるのか、もしよろしければお聞かせいただけますでしょうか。"}, {"step": 1, "from": "MU01", "role": "municipality", "name": "市役所のまちづくり担当さん", "text": "そうなんですね。空き家や後継者不足のご相談が増えているとのこと、具体的にはどのような物件や状況が多いのでしょうか？例えば、築年数が古い物件や、特定の地区でそういった傾向が見られるなど、何か特徴はありますか？"}, {"step": 1, "from": "BR01", "role": "broker", "name": "二代目の仲介さん", "text": "駅前の仲介さん、先ほどの駅前通りの持ち主さんの話、気になりました。ご自宅のこと、もしよろしければ、こちらでも何かお手伝いできることがあるかもしれません。一度、事務所ででも、お話をお聞かせいただけませんか？"}, {"step": 1, "from": "BR02", "role": "broker", "name": "駅前の仲介さん", "text": "市役所のまちづくり担当さん、こんにちは。先ほども少しお話が出ましたが、最近、街の空き家や後継者不足について、ご相談が増えているように感じます。市役所さんの方では、そういった課題に対して、何か具体的な取り組みや、今後の計画などはありますでしょうか？"}, {"step": 1, "from": "BZ01", "role": "business", "name": "浜町の旅館さん", "text": "湾岸大通りの大家さん、空き地の活用について、旅館組合でも何かお手伝いできることがあるかもしれません。組合の会議室で、組合員にもこの件を共有し、皆さんの意見も聞いてみたいと思います。また、商店街の空き店舗や後継者不足についても、組合としてできることがないか、皆さんと一緒に考えていきたいです。"}, {"step": 1, "from": "BZ04", "role": "business", "name": "駅裏の事業所さん", "text": "商店街の空き店舗や後継者不足は、街全体の活性化に関わる重要な課題ですね。私たちのコワーキングスペースでは、移住者やフリーランスの方々が新しい事業を始めるための支援も行っています。古い建物をリノベーションして、シェアオフィスやアトリエ、あるいは地域住民が集まれるような多目的なスペースとして活用するアイデアがあれば、若い世代の移住や起業を後押しできるのではないでしょうか。湾岸大通りの空き地も、例えば期間限定のマルシェやイベントスペースとして活用することで、街に賑わいが生まれるかもしれません。"}, {"step": 1, "from": "HH01", "role": "household", "name": "浜町の大家さん", "text": "線路沿いの持ち主さん、駅前の土地について、どのようなご相談でしょうか？私も自分の土地の今後について考えているところですので、皆さんのご意見も参考にさせていただきたいです。"}, {"step": 1, "from": "HH02", "role": "household", "name": "潮見横丁の大家さん", "text": "駅前の土地の件ですが、私からは何も聞いておりません。どうされたのですか？"}, {"step": 1, "from": "HH03", "role": "household", "name": "湾岸大通りの大家さん", "text": "皆さん、本日はお集まりいただきありがとうございます。湾岸大通りの角にある私の空き地なのですが、毎月草刈りの手入れをするのが本当に負担になってきておりまして。広さもあるので、このままにしておくのも勿体ないですし、何か有効な活用方法はないかと考えております。皆さんのような経験豊富な方々から、何か良いアイデアや、ご存知の情報などがあれば、ぜひお聞かせ願えませんでしょうか。特に、駅裏の事業所さんのように、新しい活用方法を考えている方や、地域紙の記者さんのような、街全体の動きを把握されている方からのご意見を伺いたいです。"}, {"step": 1, "from": "HH04", "role": "household", "name": "駅前通りの持ち主さん", "text": "皆様、お集まりいただきありがとうございます。最近、体も思うように動かなくなりましてね、坂道や家の段差もこたえるようになってきました。県外の子供たちも、そろそろこちらを出ていけと申すのですが、この共同浴場の世話だけは、もうしばらく続けたいと思っております。商店街はずれの持ち主さんがおっしゃっていた「湯坂の古家」というのは、実は私の自宅のことなのです。"}, {"step": 1, "from": "HH05", "role": "household", "name": "駅裏の大家さん", "text": "皆さん、本日はお集まりいただきありがとうございます。S1のスーパーでも話題になりましたが、最近、この辺りでも空き家が増えているように感じます。皆様のところでは、何か後継者不足などで困っているお話はありますでしょうか？ 特に、二代目の仲介さんや、市役所のまちづくり担当さん、観光産業担当さんのご意見を伺いたいです。"}, {"step": 1, "from": "HH06", "role": "household", "name": "線路沿いの持ち主さん", "text": "浜町の大家さん、先日は駅前の土地の件でご相談のお時間をいただき、ありがとうございました。あの土地の現状について、何かご存知のことはありますでしょうか？"}, {"step": 1, "from": "HH07", "role": "household", "name": "東団地の持ち主さん", "text": "本町通りの旧店舗の改装費用の件ですが、うちでも資材の融通で協力できるかもしれません。商店街が賑わうのは良いことです。何か情報があれば共有しましょう。"}, {"step": 1, "from": "HH08", "role": "household", "name": "船着場裏の持ち主さん", "text": "湾岸大通りの大家さん、空き地の草刈りは大変ですよね。うちはもう売却したので楽になりましたよ。"}, {"step": 1, "from": "HH09", "role": "household", "name": "灯台下の持ち主さん", "text": "東団地の持ち主さん、先ほどの旧店舗の件、ありがとうございます。資材の融通、大変心強いです。ところで、駅前通りの持ち主さんが、ご自宅のことを「湯坂の古家」と呼んでいらっしゃったのが気になりました。あちらも、後継者の方でお困りなのでしょうか。"}, {"step": 1, "from": "HH10", "role": "household", "name": "魚市場前の持ち主さん", "text": "皆様、はじめまして。最近この地区に越してきた、魚市場前の持ち主と申します。子どもが同じ小学校に通っていると伺い、ご挨拶に参りました。まだまだこの辺りのことは不慣れなもので、皆様のお知恵を拝借できればと思っております。どうぞよろしくお願いいたします。"}, {"step": 1, "from": "HH11", "role": "household", "name": "波止場通りの持ち主さん", "text": "皆様、本日はお集まりいただきありがとうございます。最近、空き家が増えているという話も聞きますが、皆様のお住まいの地域ではいかがでしょうか。また、新しい方もいらっしゃると伺っています。どうぞよろしくお願いいたします。駅前通りの持ち主さん、先ほどの共同浴場での会話、気になっております。ご自宅のこと、もしよろしければ、一度お話をお聞かせいただけませんか？"}, {"step": 1, "from": "HH12", "role": "household", "name": "本町通りの持ち主さん", "text": "東団地の持ち主さん、本日は資材提供のご提案、ありがとうございます。大変心強いです。具体的な見積もりをお見せする前に、いくつか確認したいことがあるのですが、後ほど少しお時間をいただけないでしょうか。湾岸大通りの大家さん、空き地の活用について、もしよろしければ、私も何かお手伝いできることがあるかもしれません。商店街の活性化は、街全体のためにも大切だと考えております。"}, {"step": 1, "from": "HH14", "role": "household", "name": "商店街はずれの持ち主さん", "text": "湾岸大通りの大家さん、先ほどの空き地の件ですが、湯坂の古家も、うちのことでして。父の介護で手一杯なのと、家の傷みも進んでいて、どうしたものかと悩んでいます。もしよろしければ、後ほど少しお話を聞かせていただけませんか？記者さん、うちのような古い家も、どうにか活用できないかと考えています。"}, {"step": 1, "from": "HH15", "role": "household", "name": "宮の下の持ち主さん", "text": "皆さん、本日はお集まりいただきありがとうございます。S1のスーパーでも話題になりましたが、最近、この辺りでも空き家が増えているように感じます。皆様のところでは、何か後継者不足などで困っているお話はありますでしょうか？"}, {"step": 1, "from": "HH16", "role": "household", "name": "岬道の持ち主さん", "text": "皆さん、こんにちは。岬道の持ち主です。北山裏の古家を売却したところですが、身軽になった気分です。湾岸大通りの大家さんの空き地の手入れも大変でしょうね。商店街の活性化や空き家問題は、私たち住民にとっても大切なことだと思います。何か私にできることがあれば、いつでも声をかけてください。"}, {"step": 1, "from": "MD01", "role": "media", "name": "地域紙の記者さん", "text": "湾岸大通りの大家さんの空き地、商店街はずれの持ち主さんの古家、そして駅裏の事業所さんからのご提案、大変参考になります。皆さんがおっしゃるように、空き家や空き店舗の問題は、街の将来を左右する大きな課題です。特に、後継者不足は深刻であり、古い建物の活用や、空き地の有効活用は、新たな活路を見出す上で重要だと感じています。私自身も、これらの課題について、今後さらに深く取材していきたいと考えています。皆様の貴重なご意見を、記事にまとめさせていただき、街全体で共有できれば幸いです。"}, {"step": 1, "from": "MD02", "role": "media", "name": "地域ウェブの記者さん", "text": "本日は貴重なお話をありがとうございました。皆様から出た空き家や後継者不足、土地の活用に関するお話は、この街が抱える課題であり、同時に新たな可能性でもあると感じました。特に、駅裏の事業所さんから提案のあった古い建物のリノベーションや、湾岸大通りの大家さんの空き地の活用アイデアなど、具体的な取り組みに繋がるヒントが多くありました。これらの声を記事にまとめ、街の皆様に共有させていただきたいと思います。また、移住者や新しい事業の受け皿となるような取り組みについても、今後取材を深めていければと考えております。"}, {"step": 1, "from": "MU01", "role": "municipality", "name": "市役所のまちづくり担当さん", "text": "駅前の仲介さん、先ほどの話、大変参考になります。具体的にどのような物件や状況が多いのでしょうか？例えば、築年数が古い物件や、特定の地区でそういった傾向が見られるなど、何か特徴はありますか？また、湾岸大通りの大家さんの空き地活用や、駅前通りの持ち主さんの共同浴場について、皆さんのご意見も伺えればと思います。地域全体で空き家対策や活性化について考えていくための、市役所としての情報提供や支援のあり方についても、皆さんと共有できればと考えております。"}, {"step": 1, "from": "MU02", "role": "municipality", "name": "市役所の観光産業担当さん", "text": "皆様、本日は活発なご意見交換をありがとうございます。空き家や後継者不足、遊休地の活用といった課題は、街の活性化にとって非常に重要であると認識しております。市役所としても、事業者様や地域住民の皆様と連携し、これらの課題解決に向けた情報提供や、可能な範囲での支援を行ってまいりたいと考えております。具体的なご相談がございましたら、いつでも窓口にお越しください。"}], "events": [{"step": 1, "id": "SCRIPT", "name": "台本", "role": "script", "action": "scripted_transfer", "target": "", "ok": true, "outcome": "transfer", "why": "", "utterance": "", "ch": "none", "to": "", "memory": "", "reasoning": "", "under_name": ""}, {"step": 1, "id": "SCRIPT", "name": "台本", "role": "script", "action": "scripted_transfer", "target": "", "ok": true, "outcome": "transfer", "why": "", "utterance": "", "ch": "none", "to": "", "memory": "", "reasoning": "", "under_name": ""}, {"step": 1, "id": "BR01", "name": "二代目の仲介さん", "role": "broker", "action": "utterance", "target": "", "ok": true, "outcome": "silent", "why": "", "utterance": "", "ch": "none", "to": "", "memory": "", "reasoning": "", "under_name": ""}, {"step": 1, "id": "BR02", "name": "駅前の仲介さん", "role": "broker", "action": "utterance", "target": "", "ok": true, "outcome": "spoke", "why": "", "utterance": "", "ch": "none", "to": "", "memory": "", "reasoning": "", "under_name": ""}, {"step": 1, "id": "BZ02", "name": "潮見横丁の店さん", "role": "business", "action": "utterance", "target": "", "ok": true, "outcome": "silent", "why": "", "utterance": "", "ch": "none", "to": "", "memory": "", "reasoning": "", "under_name": ""}, {"step": 1, "id": "BZ03", "name": " function lineChart(svg,series,opts){
 const W=900,H=260,L=54,R=168,T=18,B=34;
 const xs=i=>L+(W-L-R)*(nSteps<=1?0:i/nSteps);
 const ymax=opts.ymax!=null?opts.ymax:Math.max(0.0001,...series.flatMap(s=>s.data.filter(v=>v!=null)));
 const ys=v=>H-B-(H-T-B)*(v/ymax);
 let g=`<rect x="0" y="0" width="${W}" height="${H}" fill="#fff"/>`;
 for(let t=0;t<=4;t++){const v=ymax*t/4,y=ys(v);
  g+=`<line x1="${L}" y1="${y}" x2="${W-R}" y2="${y}" stroke="#E5E7EB"/>`
    +`<text x="${L-8}" y="${y+4}" text-anchor="end" font-size="11" fill="#6B7280">${opts.fmt(v)}</text>`;}
 for(let s=0;s<=nSteps;s+=Math.max(1,Math.round(nSteps/12)))
  g+=`<text x="${xs(s)}" y="${H-12}" text-anchor="middle" font-size="11" fill="#6B7280">${s}</text>`;
 (opts.marks||[]).forEach(mk=>{const x=xs(mk.step);
  g+=`<line x1="${x}" y1="${T}" x2="${x}" y2="${H-B}" stroke="${mk.color}" stroke-dasharray="4 3"/>`
    +`<text x="${x+4}" y="${T+12}" font-size="11" font-weight="700" fill="${mk.color}">${esc(mk.label)}</text>`;});
 series.forEach((s,si)=>{
  let d="",started=false;
  s.data.forEach((v,i)=>{ if(v==null)return; const x=xs(i+1),y=ys(v);
   d+=(started?"L":"M")+x+" "+y+" "; started=true;});
  g+=`<path d="${d}" fill="none" stroke="${s.color}" stroke-width="2.5"/>`
    +`<text x="${W-R+8}" y="${T+16+si*18}" font-size="12" font-weight="700" fill="${s.color}">${esc(s.label)}</text>`;});
 g+=`<line x1="${L}" y1="${H-B}" x2="${W-R}" y2="${H-B}" stroke="#111827"/>`
   +`<text x="${W-R}" y="${H-2}" text-anchor="end" font-size="11" fill="#6B7280">経過月</text>`;
 svg.innerHTML=g;
}

const CATS=[["deal","成約"],["nego","申し入れ"],["list","売出"],
 ["media","報道"],["gov","自治体"],["exit","退出・廃業"],["talk","発言"],
 ["fail","不成立"],["idle","静観"]];
function cat(e){
 if(!e.ok) return "fail";
 const o=e.outcome;
 if(o==="transfer") return "deal";
 if(o==="offer"||o==="counter"||o==="withdraw") return "nego";
 if(o==="listing"||o==="unlist") return "list";
 if(o==="rent_change"||o==="rent_negotiation"||o==="redevelop") return "rent";
 if(o==="publication") return "media";
 if(o==="ordinance"||o==="ordinance_study"||o==="request_report") return "gov";
 if(o==="move_out"||o==="business_closed"||o==="relocate") return "exit";
 if(e.action==="investigate"||e.action==="public_statement") return "gov";
 if(e.utterance) return "talk";
 return "idle";
}
const P=pid=>`<span class="pill" data-pid="${pid}">${pid}</span>`;
function summary(e){
 const t=e.target;
 switch(e.action){
  case "make_offer": return `${P(t)} に取得を申し入れ（名義「${esc(e.under_name||"—")}」）`;
  case "accept_offer": {
   const tr=(D.ledger||[]).find(r=>r.kind==="transfer"&&r.step===e.step&&r.offer_id===t);
   return tr?`${P(tr.parcel_id)} の名義を「${esc(tr.under_name)}」へ移した`
            :`申し入れ ${esc(t)} に応じた`;}

  case "reject_offer": return `申し入れ ${esc(t)} に応じなかった`;
  case "withdraw_offer": return `申し入れ ${esc(t)} を取り下げ`;

  case "unlist": return `${P(t)} の売り出しを取り下げ`;

  case "relocate": return `${P(t)} へ店を移す`;
  case "close_shop": return `<b>店を畳んだ</b>`;
  case "move_out": return `<b>この街から転出した</b>`;
  case "circulate_listing": return `${esc(nameOf[t]||t)} に売り情報を流す`;
  case "approach_owner": return `${esc(nameOf[t]||t)} に売却を打診`;
  case "publish": return `<b>記事を出した</b>`;
  case "investigate": return `登記簿を調べた`;
  case "silent": return `今月は書かなかった`;
  case "enact_ordinance": return `<b>条例を施行「${esc(t)}」</b>`;
  case "study_ordinance": return `規制の検討を進める`;
  case "request_report": return `${esc(nameOf[t]||t)} に説明を求めた`;
  case "public_statement": return `声明を出した`;
  case "monitor": case "hold": case "wait": case "continue": return `静観`;
  default: return esc(e.action);
 }
}
function beatHtml(e){
 const c=cat(e), label=(CATS.find(x=>x[0]===c)||["","?"])[1];
 let h=`<div class="beat" data-cat="${c}" data-id="${e.id}" data-step="${e.step}">`
  +`<span class="tag t-${c}">${label}</span><div class="bd">`
  +`<div class="hl"><span class="who">${esc(e.name)}</span>`
  +`<span class="small">（${esc(ROLEJA[e.role]||e.role)}）</span> ${summary(e)}</div>`;
 if(!e.ok) h+=`<div class="sub">→ 帳簿上は<b>不成立</b>（${esc(e.outcome)}${e.why?" / "+esc(e.why):""}）。コードは補正していない。</div>`;
 if(e.reasoning) h+=`<div class="sub">理由：${esc(e.reasoning)}</div>`;
 if(e.utterance) h+=`<div class="say ${e.ch==="public"?"pub":e.ch==="private"?"pri":""}">`
  +`${e.ch==="private"?"（"+esc(nameOf[e.to]||e.to)+"へ）":""}「${esc(e.utterance)}」</div>`;
 return h+`</div></div>`;
}

 +opts.map(o=>`<option value="${o[0]}">${o[1]}</option>`).join(""); }
fillSel($("#asel"),D.agents.map(a=>[a.id,`${a.name}（${ROLEJA[a.role]||a.role}）`]),"すべて");
fillSel($("#psel2"),D.parcels.map(p=>[p.pid,`${p.pid}（${p.block}）`]),"すべて");
fillSel($("#msel"),Array.from({length:nSteps},(_,i)=>[i+1,`第${i+1}月`]),"全期間");
fillSel($("#psel"),D.parcels.map(p=>[p.pid,`${p.pid}（${p.block}・${p.use}）`]),"（区画を選ぶ）");
fillSel($("#tsel"),D.agents.map(a=>[a.id,`${a.name}（${ROLEJA[a.role]||a.role}）`]),"（選ぶ）");
function chronicle(){
 const aid=$("#asel").value, pid=$("#psel2").value, mo=$("#msel").value;
 const q=$("#q").value.trim();
 let rows=D.events.filter(e=>active.has(cat(e)));
 if(aid) rows=rows.filter(e=>e.id===aid);
 if(mo) rows=rows.filter(e=>e.step===+mo);
 if(pid){
  const offs=new Set((D.ledger||[]).filter(r=>r.parcel_id===pid&&r.offer_id).map(r=>r.offer_id));
  rows=rows.filter(e=>e.target===pid||offs.has(e.target)
   ||(e.utterance||"").includes(pid)||(e.reasoning||"").includes(pid));
 }
 if(q) rows=rows.filter(e=>(e.utterance+e.reasoning+e.name).includes(q));
 $("#cnt").textContent=`${rows.length} 件`;
 let h="",cur=-1;
 rows.forEach(e=>{ if(e.step!==cur){cur=e.step; h+=`<div class="mo">第${cur}月</div>`;} h+=beatHtml(e); });
 $("#chron").innerHTML=h||'<p class="small">条件に合う出来事がない。</p>';
}
$("#catbar").addEventListener("click",ev=>{
 const b=ev.target.closest("button"); if(!b)return;
 if(b.id==="allcat"){ active=new Set(CATS.map(c=>c[0]));
  document.querySelectorAll(".catb").forEach(x=>x.classList.add("on")); chronicle(); return; }
 const c=b.dataset.c; if(active.has(c)){active.delete(c);b.classList.remove("on");}
 else{active.add(c);b.classList.add("on");} chronicle();
});
["#asel","#psel2","#msel"].forEach(s=>$(s).addEventListener("change",chronicle));
$("#q").addEventListener("input",chronicle);
$("#reset").addEventListener("click",()=>{
 $("#asel").value="";$("#psel2").value="";$("#msel").value="";$("#q").value="";
 active=new Set(CATS.filter(c=>c[0]!=="idle").map(c=>c[0]));
 document.querySelectorAll(".catb").forEach(x=>x.classList.toggle("on",active.has(x.dataset.c)));
 chronicle();
});
document.addEventListener("click",ev=>{
 const p=ev.target.closest(".pill"); if(!p)return;
 selPid=p.dataset.pid; $("#psel").value=selPid; renderParcel(); draw(+slider.value);
 $("#psel").scrollIntoView({behavior:"smooth",block:"center"});
});

/* ---------- 区画の履歴 ---------- */
function renderParcel(){
 const pid=$("#psel").value;
 selPid=pid||null; draw(+slider.value);
 if(!pid){ $("#phist").innerHTML='<p class="small">マップの区画をクリックするか、上で区画を選ぶ。</p>';
  $("#pinfo").textContent=""; return; }
 const p=PARCEL[pid];
 const last=D.frames[D.frames.length-1];
 $("#pinfo").innerHTML=`${p.block}／用途 ${esc(last.use[pid])}`
  +`／最終の名義 <b>${esc(last.registered[pid])}</b>`;
 const offs=new Set((D.ledger||[]).filter(r=>r.parcel_id===pid&&r.offer_id).map(r=>r.offer_id));
 const recs=(D.ledger||[]).filter(r=>r.parcel_id===pid
   ||(r.offer_id&&offs.has(r.offer_id)));
 const rowFor=(r)=>{
  const who=nameOf[r.by||r.from_id||r.seller||r.agent_id]||r.by||r.from_id||"";
  switch(r.kind){
   case "offer": return [`申入`,`${esc(r.under_name)} 名義での取得の申し入れ（${r.offer_id}）`];
   case "consult": return [`相談`,`${esc(nameOf[r.by]||r.by)} が ${esc(nameOf[r.to]||r.to)} に相談（${r.consult_id}）`];
   case "advice": return [`回答`,`${esc(nameOf[r.by]||r.by)} が ${esc(nameOf[r.to]||r.to)} の相談に答えた（${r.consult_id}）`];
   case "keep": return [`応じない`,`${esc(nameOf[r.by]||r.by)} が申し入れに応じなかった（${r.offer_id}）`];
   case "hold": return [`保留`,`${esc(nameOf[r.by]||r.by)} は今月決めなかった（${r.offer_id}）`];
   case "transfer": return [`移転`,`${esc(nameOf[r.seller]||r.seller)} → 名義「${esc(r.under_name)}」`];
   case "unlist": return [`取下`,`${esc(who)} が売り出しを取り下げ`];

   case "tenancy_end": return [`退去`,`${esc(nameOf[r.tenant]||r.tenant)} が退去（${esc(r.reason)}）`];
   case "relocate": return [`入居`,`${esc(nameOf[r.agent_id]||r.agent_id)} が入居`];
   default: return null;
  }
 };
 let h='<table><thead><tr><th>月</th><th>種別</th><th>内容</th><th>そのときの言い分</th></tr></thead><tbody>';
 let n=0;
 recs.forEach(r=>{
  const rw=rowFor(r); if(!rw)return; n++;
  const actor=r.by||r.from_id||r.seller||r.agent_id||r.tenant;
  const e=D.events.find(x=>x.step===r.step&&x.id===actor);
  h+=`<tr><td>第${r.step}月</td><td><b>${rw[0]}</b></td><td>${rw[1]}</td>`
   +`<td class="small">${e&&e.reasoning?esc(e.reasoning):""}`
   +`${e&&e.utterance?"<br>「"+esc(e.utterance)+"」":""}</td></tr>`;
 });
 h+="</tbody></table>";
 $("#phist").innerHTML=n?h:'<p class="small">この区画には、期間中なにも起きなかった。</p>';
}
$("#psel").addEventListener("change",renderParcel);

/* ---------- エージェント別スレッド ---------- */
function renderThread(){
 const id=$("#tsel").value;
 if(!id){ $("#thread").innerHTML='<p class="small">エージェントを選ぶと、その1体の36か月が一本で読める。</p>';
  $("#tinfo").textContent=""; return; }
 let rows=D.events.filter(e=>e.id===id);
 if($("#thideidle").checked) rows=rows.filter(e=>cat(e)!=="idle");
 const acts={}; rows.forEach(e=>{acts[e.action]=(acts[e.action]||0)+1;});
 $("#tinfo").innerHTML=`${rows.length}か月ぶん ／ `
  +Object.entries(acts).sort((a,b)=>b[1]-a[1]).map(([a,c])=>`${esc(a)}×${c}`).join("、");
 let h="";
 rows.forEach(e=>{
  h+=`<div class="mo">第${e.step}月</div>`+beatHtml(e);
  if(e.memory) h+=`<div class="beat" style="border-bottom:none;padding-top:0;">`
   +`<span class="tag t-idle">記憶</span><div class="bd"><div class="mem">${esc(e.memory)}</div></div></div>`;
 });
 $("#thread").innerHTML=h||'<p class="small">該当なし。</p>';
}
$("#tsel").addEventListener("change",renderThread);
$("#thideidle").addEventListener("change",renderThread);

/* ---------- step 連動 ---------- */
const slider=$("#slider"); slider.max=nSteps; slider.value=nSteps;
function stepInfo(step){
 const r=D.kpi[step-1];
 if(!r) return "第0月（初期状態）";
 return `第${step}月 — 取得主体シェア <b>${pct(r.acquirer_share)}</b> ／ HHI ${r.hhi.toFixed(3)}`
  +` ／ 累計成約 ${r.transfers_cum} ／ 営業中の店 ${r.shops_occupied}/${r.shops_total}`
  +` ／ 転出率 ${pct(r.resident_outflow)}`;
}
function update(){
 const s=+slider.value;
 $("#stepnum").textContent=s===0?"第0月":"第"+s+"月";
 draw(s); $("#stepinfo").innerHTML=stepInfo(s);
}
slider.addEventListener("input",update);
let timer=null;
$("#play").addEventListener("click",()=>{
 if(timer){clearInterval(timer);timer=null;$("#play").textContent="▶ 再生";return;}
 if(+slider.value>=nSteps) slider.value=0;
 $("#play").textContent="⏸ 停止";
 timer=setInterval(()=>{ if(+slider.value>=nSteps){clearInterval(timer);timer=null;
  $("#play").textContent="▶ 再生";return;} slider.value=+slider.value+1; update(); },420);
});

/* ---------- 出来事 ---------- */
let ev="";
ev+="<h3>報道</h3>";
ev+=D.publications.length?D.publications.map(p=>
 `<div class="beat"><span class="tag t-media">第${p.step}月</span><div class="bd">
  <div class="hl">${esc(p.headline)}</div></div></div>`).join("")
 :"<p class='small'>期間中、この街のことは記事にならなかった。</p>";
ev+="<h3>規制</h3>";
ev+=D.ordinances.length?D.ordinances.map(o=>
 `<div class="beat"><span class="tag t-gov">第${o.step}月</span><div class="bd">
  <div class="hl">${esc(o.title)}</div><div class="sub">${esc(o.body)}</div></div></div>`).join("")
 :"<p class='small'>期間中、土地取引の規制は発動しなかった。</p>";
$("#events").innerHTML=ev;

update(); chronicle(); renderParcel(); renderThread();
</script></body></html>
