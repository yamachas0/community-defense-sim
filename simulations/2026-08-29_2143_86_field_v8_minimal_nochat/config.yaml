# A市フィールド v8「最小の町」— 会話なしの世界（対照）
# 設計の正: docs/world_design_v8_minimal.md
#
# config_field_v8.yaml との差は **chat: false の1行と run_name だけ** である
# （＝「違うのは隣と話せるかどうかだけ」を設定ファイルで証明できる形にしてある）。
run_name: field_v8_minimal_nochat
scenario_version: field_v8
seed: 85
steps: 36
personas_file: configs/personas_v8.yaml

# 集まり（月1回）の有無。false にすると集まりを飛ばす。
# **行き先を選ぶコールは false でも残す**（差分を「会話の有無」だけに保つため）。
chat: false
# 1回の集まりで各自が話す回数。施主決定 2026-08-29 21:28 で 1 を既定にした
# （2巡にしない・返事は翌月の思考から）。2 以上も動くが既定は 1。
scene_rounds: 1
# X社のコールを何人ずつに区切るか（出力の切れを避けるためだけの分割。
# X社に見えている情報は毎回すべて同じ）。
acquirer_chunk: 10

llm:
  provider: google
  model: gemini-2.5-flash-lite
  temperature: 0.75
  max_tokens: 2200
  parallel_workers: 8
  # 明示キャッシュ（CachedContent）は **使わない**。
  # 実測 2026-08-29：共通前置き（この町の説明・場所・月の進み方・30体の名簿・共通ルール）は
  # countTokens で **1,461 トークン**。gemini-2.5-flash-lite の CachedContent 最低は
  # **2,048**（API が 400 で明示的にそう返す＝実測済み）。埋め草で届かせるのは施主が禁じたので
  # 明示キャッシュは使わない。ただし 1,461 は**暗黙キャッシュの最低 1,024 を超えている**ので、
  # 全コールで1文字も違わない system 前置きは暗黙キャッシュに載りうる。
  # 効いているかどうかは1か月スモークの cached_tokens で実測する
  # （docs/world_design_v8_minimal.md §9）。
  enable_cache: false
  batch_classify: false
  batch_agents: false

world:
  town_name: A市
  background: |
    A市は湾岸にある人口約12万人の温泉観光都市である。対岸の空港では
    スペースポート構想が進むが、時期と需要規模は確定していない。
    市内では人口減少、高齢化、相続、築古建物の改修負担、旅館と商店の
    後継者不足が同時に進む。住民には住み続けたい人、土地を手放すことを
    考えうる人、まだ何も考えていない人がいる。事業者と行政も通常の日常を送る。
    個々の取引・会話が将来どうなるかは開始時点では決まっていない。

social:
  # 会場は v5c の15会場から V07「地元不動産仲介の事務所」を外した14である。
  # 理由＝v8 は施主確定で仲介業2体（U・V）を名簿から外したので、その事務所に
  # 出入りする人が町に1人もいない＝誰の生活動線にも入らない死んだ場になる。
  # 代わりの場を発明すると世界の中身を足すことになるため、**足さずに減らした**
  # （施主判断 2026-08-29 21:34・docs/world_design_v8_minimal.md §2）。
  venues:
    - {id: V01, label: 駅前の飲食店}
    - {id: V02, label: 地区公民館}
    - {id: V03, label: 共同浴場}
    - {id: V04, label: 湾岸の喫茶店}
    - {id: V05, label: 旅館組合の会議室}
    - {id: V06, label: 市役所の待合}
    - {id: V08, label: 地域イベント会場}
    - {id: V09, label: 商店街の床屋}
    - {id: V10, label: スーパーのレジ待ち}
    - {id: V11, label: 神社の境内（掃除・祭りの準備）}
    - {id: V12, label: 小学校の校門前（送り迎え）}
    - {id: V13, label: 隣家の玄関先（回覧板の受け渡し）}
    - {id: V14, label: バス停と駅のホーム}
    - {id: V15, label: 診療所の待合}

cost:
  price_table:
    gemini-2.5-flash-lite: {input: 0.10, output: 0.40, cache_read: 0.01, cache_storage_hour: 1.00}
  safety_factor: 2.0
