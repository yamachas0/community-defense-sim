# A市フィールド v8「最小の町」— 会話なしの世界（対照）
# 設計の正: docs/world_design_v8_minimal.md
#
# config_field_v8.yaml との差は **chat: false の1行と run_name だけ** である
# （＝「違うのは隣と話せるかどうかだけ」を設定ファイルで証明できる形にしてある）。
run_name: field_v8_minimal_nochat
scenario_version: field_v8
seed: 85
steps: 36
personas_file: configs/personas_v8.yaml

# 場での会話の有無。false にすると場での会話を飛ばす（隣近所の配送も止まる）。
# **行き先を選ぶコールは false でも残す**（差分を「会話の有無」だけに保つため）。
chat: false
# 1か月に各自が場で話す回数。施主決定 2026-08-29 21:28 で 1 を既定にした
# （2巡にしない・返事は翌月の思考から）。2 以上も動くが既定は 1。
scene_rounds: 1
# X社のコールを何人ずつに区切るか（出力の切れを避けるためだけの分割。
# X社に見えている情報は毎回すべて同じ）。
acquirer_chunk: 10

llm:
  provider: google
  model: gemini-2.5-flash-lite
  temperature: 0.75
  max_tokens: 2200
  parallel_workers: 8
  # 明示キャッシュ（CachedContent）を使う。
  # 実測 2026-08-29（countTokens）：
  #   住民の共通前置き（町の説明・6つの場所・月の進み方・30体の名簿と隣・共通ルール）
  #     = **2,406 トークン** → gemini-2.5-flash-lite の最低 2,048 を**自然に超えた**
  #       （超えた直接の原因は施主 21:53 指示の「隣は誰か」を名簿に足したこと。埋め草はしていない）
  #   X社の前置き = 1,958 トークン → 2,048 に届かないので X社のコールはキャッシュされない
  #     （X社は36か月で約110コールしかないので影響は小さい）
  # 参考：足す前は 1,461 で、caches.create が
  #   `400 Cached content is too small. total_token_count=1365, min_total_token_count=2048`
  #   を返した（＝この 2,048 は推測ではなく API が返した実測値）。
  # 実際に効いたかどうかは1か月スモークの cached_tokens で確かめる
  # （docs/world_design_v8_minimal.md §9）。走行終了時にキャッシュは必ず削除する。
  enable_cache: true
  cache_ttl_seconds: 5400
  batch_classify: false
  batch_agents: false

world:
  town_name: A市
  background: |
    A市は湾岸にある人口約12万人の温泉観光都市である。対岸の空港では
    スペースポート構想が進むが、時期と需要規模は確定していない。
    市内では人口減少、高齢化、相続、築古建物の改修負担、旅館と商店の
    後継者不足が同時に進む。住民には住み続けたい人、土地を手放すことを
    考えうる人、まだ何も考えていない人がいる。事業者と行政も通常の日常を送る。
    個々の取引・会話が将来どうなるかは開始時点では決まっていない。

social:
  # 公共の場6か所（施主決定 2026-08-29 22:02＝共同浴場を商店街・商業施設に含めた）。
  # +「今月はどこにも行かない」。家の前・道端の立ち話は**場ではなく隣近所の経路**が
  # 受け持つ（施主 21:57）。**全員がどの場所へも行ける**
  # （ハッカソン1と同じ「動いた人同士が話す」型）。
  # 網羅性の考え方は docs/world_design_v8_minimal.md 2-1。
  # note は共通前置きに1行ずつ出る場所の説明。**その場で何が話されるかは書かない**（中立）。
  venues:
    - {id: V06, label: 市役所,           note: 窓口と待合}
    - {id: V02, label: 公民館・集会所,   note: 町内会や自治会、祭りの準備で使う}
    - {id: V14, label: 駅・バス停,       note: 駅前とホームとバス停}
    - {id: V09, label: 商店街・商業施設, note: 店先と飲食店と喫茶と共同浴場}
    - {id: V12, label: 公園・校門前,     note: 広場とベンチ、小学校の送り迎え}
    - {id: V15, label: 診療所の待合,     note: 順番を待つ間}

cost:
  price_table:
    gemini-2.5-flash-lite: {input: 0.10, output: 0.40, cache_read: 0.01, cache_storage_hour: 1.00}
  safety_factor: 2.0
