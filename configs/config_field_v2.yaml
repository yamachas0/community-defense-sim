# 静かな占領 — A市フィールド v2
# 別府型の湾岸温泉観光都市。既存mvp_v1は変更せず、比較可能な別シナリオとして保存する。

run_name: field_v2_a_city
seed: 84
steps: 60
personas_file: configs/personas/field_v2.yaml

llm:
  provider: google
  model: gemini-2.5-flash-lite
  temperature: 0.95
  max_tokens: 620
  parallel_workers: 8
  enable_cache: false

agents:
  households: 16
  businesses: 4
  brokers: 2
  acquirers: 1
  municipality: 2
  media: 2

world:
  town_name: A市
  background: |
    A市は別府湾西岸にある人口約12万人の国際温泉観光都市である。
    湾の反対側にあるA空港では、4年後の本格運用を目標にスペースポート化が進み、
    宇宙関連企業、研究者、運航関係者、会議・研修、打上げ観光の需要増が期待されている。
    A市は発射施設の隣接地ではないが、既存の宿泊、温泉、大学、国際人材の受入基盤から、
    長期滞在者の住宅・宿泊・研究交流を受け止める都市と見られている。

    市内では人口減少、高齢化、相続、築古建物の修繕・耐震・消防改修負担、
    旅館と商店の後継者不足が同時に進む。市の面的再開発は財源不足で止まっている。
    宇宙港構想を値上がり材料として保有を続けたい人も、改修前に手放したい人も、
    外部投資を歓迎する事業者も、温泉文化や生活環境を守りたい住民もいる。
    計画の実現時期と需要規模は確定しておらず、将来予測には不確実性がある。

    4地区は、湾岸観光地区、中央駅前地区、北部学術・生活地区、温泉丘陵地区。
    売買や所有名義の情報は、近隣の立ち話、町内会、旅館組合、仲介、管理会社からの通知、
    地元報道、登記調査など別々の経路で断片的に伝わる。
  grid: {cols: 8, rows: 6}
  block_names: [湾岸観光地区, 中央駅前地区, 北部学術・生活地区, 温泉丘陵地区]
  base_assessed_value: 2600
  block_premium:
    湾岸観光地区: 1.35
    中央駅前地区: 1.20
    北部学術・生活地区: 0.85
    温泉丘陵地区: 1.05
  initial_shop_rent: 24
  shop_coords:
    [[1,0],[2,0],[3,0],[5,0],[6,0],
     [1,1],[2,1],[5,1],[6,1],
     [1,3],[2,3],[5,3]]
  vacant_coords: [[0,2],[3,2],[7,2],[0,5],[3,5],[6,5]]
  public_coords: [[0,0],[7,5]]

scenario:
  initial_cash:
    household: 1000
    business: 650
    broker: 1200
    municipality: 24000
    media: 500
    acquirer: 0
  acquirer_budget: 90000
  acquirer_mandate: |
    60か月以内にA市内で、宿泊、住宅、商業、研究交流機能を組み合わせた
    長期保有ポートフォリオを形成すること。既存物件の収益を維持しながら、
    A空港のスペースポート化に伴う企業滞在・技術者住宅・会議研修・観光需要が
    顕在化した際に運営転換できる余地を確保し、10年間の長期収益を目指す。
    計画の実現時期と需要には不確実性がある。
    制約は、予算を超えず、日本の法令と契約を守ること。
    取得対象、順序、価格、地域説明、既存入居者の扱い、利用可能な国内法人名義の
    使い分けは自ら判断すること。

kpi:
  classify_utterances: true
  classify_batch: 25
  cascade_window: 3

cost:
  price_table:
    gemini-2.5-flash-lite: {input: 0.10, output: 0.40, cache_read: 0.01, cache_storage_hour: 1.00}
    gemini-2.5-flash:      {input: 0.30, output: 2.50, cache_read: 0.03, cache_storage_hour: 1.00}
    gemini-3.1-flash-lite: {input: 0.25, output: 1.50, cache_read: 0.025, cache_storage_hour: 1.00}
    gemini-3.5-flash-lite: {input: 0.30, output: 2.50, cache_read: 0.03, cache_storage_hour: 1.00}
  safety_factor: 2.0

