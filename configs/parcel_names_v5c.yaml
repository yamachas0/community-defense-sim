# 土地の名前と持ち主の呼び名（表示用・v5d では世界そのものの呼び名になる）
#
# 施主指示 2026-08-28 20:41「土地の名前と持ち主は共通にしよう。A を持っている人は A の大家さん」
# 「敷地の名前見えねぇよ」への対応。P番号・R番号・HH番号は**内部ID**に降格する。
#
# 作り方（docs/world_design_v5d.md §1 が正本）
#   - land[].name = <locality>の<use_word>。locality は区画の位置（地区・通り・海/丘/川）から
#     人が呼ぶときの言い方を当てたもの、use_word は parcels_v5c.yaml の use_detail から機械対応。
#   - 48区画すべてに固有名。name も locality も**全区画で重複しない**（tests で固定）。
#   - 持ち主の呼び名 = 「<本拠の locality>の大家さん」。
#     本拠 = ①店子がいる区画（＝実際に貸している）を優先 → ②無ければ pid 最小。
#     16世帯の本拠 locality は互いに重複しない（tests で固定）。
#   - 事業者（店子）の呼び名 = 「<借りている区画の name>さん」。
#   - 仲介・行政・記者は土地を持たないので役割から呼ぶ（下の agents を参照）。
#   - 法人名義（X社・A社〜D社）は変更しない。土地名に記号 A/B/C を使っていないので衝突しない。
#   - 公有地の登記名義は個人名ではなく「A市」と表示する（registered_names を参照）。
#
# このファイルは**呼び名の対応表だけ**であり、面積・用途・位置などの世界の事実は
# configs/parcels_v5c.yaml が正本。ここでは1文字も上書きしない。

meta:
  applies_to: configs/parcels_v5c.yaml
  frozen: true
  note: 呼び名の対応表。世界の事実は parcels_v5c.yaml が正本。

use_words:
  公共施設: 集会所
  旅館: 旅館
  店舗: 店
  事業所: 事業所
  住宅: 家
  古い住宅: 古家
  空地: 空き地
  工場: 工場

land:
