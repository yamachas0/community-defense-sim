    use_detail: 既存 use ＋ 所有者・使い手のペルソナ本文の語から機械判定
    owner_profile: 所有者ペルソナの年齢・世帯・生業から機械判定
    visibility: frontage+size+use+zone の加点（買い手の内部値）
