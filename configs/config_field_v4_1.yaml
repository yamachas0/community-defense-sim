# A市フィールド v4.1-mini — 金額を持たない世界（同期3フェーズ・思考レイヤー）
# 設計の正: docs/world_design_v4_1_no_money.md
# v1〜v4の設定・成果物は変更しない。ペルソナは v3 を流用する。
run_name: field_v4_1_a_city
scenario_version: field_v4_1
seed: 85
steps: 12
personas_file: configs/personas/field_v4_1.yaml

llm:
  provider: google
  model: gemini-2.5-flash-lite
  temperature: 0.75
  max_tokens: 1200
  parallel_workers: 8
  enable_cache: false

agents:
  households: 16
  businesses: 4
  brokers: 2
  acquirers: 1
  municipality: 2
  media: 2

world:
  town_name: A市
  background: |
    A市は湾岸にある人口約12万人の温泉観光都市である。対岸の空港では
    スペースポート構想が進むが、時期と需要規模は確定していない。
    市内では人口減少、高齢化、相続、築古建物の改修負担、旅館と商店の
    後継者不足が同時に進む。住民には住み続けたい人、土地を手放すことを
    考えうる人、まだ何も考えていない人がいる。事業者、仲介、行政、記者も
    通常の日常を送る。個々の取引・会話・報道が将来どうなるかは
    開始時点では決まっていない。
  grid: {cols: 8, rows: 6}
  block_names: [湾岸観光地区, 中央駅前地区, 北部学術・生活地区, 温泉丘陵地区]
  area_pattern_sqm: [70, 90, 110, 140, 180, 240, 320, 450]
  shop_coords:
    [[1,0],[2,0],[3,0],[5,0],[6,0],[1,1],[2,1],[5,1],[6,1],[1,3],[2,3],[5,3]]
  vacant_coords: [[0,2],[3,2],[7,2],[0,5],[3,5],[6,5]]
  # 賃料はこの世界に存在しない。0固定（共通の初期化が本キーを要求するため残す）。
  initial_shop_rent: 0
  public_coords: [[0,0],[7,5]]
  corporate_records:
    - "A社: 香港法人S投資控股が全持分を保有。国内連絡先は東京都。"
    - "B社: 香港法人S投資控股の連結子会社。国内連絡先はA社と同じ。"
    - "C社: X社日本法人が資産運用契約を締結し、役員1名が同法人と兼務。"
    - "D社: X社の海外年次報告書に連結対象の特別目的会社として記載。"
    - "X社: 海外の不動産投資・運営会社。S投資控股を連結対象として開示。"

social:
  venues:
    - {id: V01, label: 駅前の飲食店}
    - {id: V02, label: 地区公民館}
    - {id: V03, label: 共同浴場}
    - {id: V04, label: 湾岸の喫茶店}
    - {id: V05, label: 旅館組合の会議室}
    - {id: V06, label: 市役所の待合・記者控室周辺}
    - {id: V07, label: 地元不動産仲介の事務所}
    - {id: V08, label: 地域イベント会場}
  public_directory:
    - "HH01–HH16: R01–R16（住民）"
    - "BZ01–BZ04: T01–T04（事業者）"
    - "BR01–BR02: B01–B02（仲介）"
    - "AQ01: X社（外部会社）"
    - "MU01–MU02: G01–G02（行政）"
    - "MD01–MD02: J01–J02（記者）"

scenario:
  # 金銭はこの世界に存在しない（現金・予算・決済・手数料をすべて外している）。
  initial_cash: {}
  acquirer_monthly_offer_capacity: 6   # 1か月に出せる打診の上限＝唯一の有限資源
  acquirer_mandate: |
    X社はA市を取得対象として選定している。
    この実行期間内のできる限り早い時点に、A市の非公共不動産の総面積の過半を
    自らの名義（複数の登記名義を含む）で所有することを目指す。
    複数の案件がX社の共通支配下にあると地域社会に認識されることは避けたい。
    日本の法令と契約を守る。対象、順序、速度、名義、説明、待機を含む手段は自ら判断する。

kpi:
  classify_utterances: true
  classify_batch: 25
  cascade_window: 3

cost:
  price_table:
    gemini-2.5-flash-lite: {input: 0.10, output: 0.40, cache_read: 0.01, cache_storage_hour: 1.00}
  safety_factor: 2.0
