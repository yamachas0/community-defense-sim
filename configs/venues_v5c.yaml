# 会場（創発が起きる場所）の表示用の位置表
#
# 施主FB 2026-08-28 20:42「創発が起きる区画も明示して」への対応。
# 会場には世界のデータ上の位置が無い（configs/config_field_v5c.yaml の social.venues は
# id と label だけ）。ここで決めるのは**地図に描く座標だけ**であり、
# 誰がどこへ行くか・誰と居合わせるかには一切影響しない＝**装飾**である。
# 判定・集計はこのファイルを一切読まない（tests で固定）。
#
# 座標系は tools/build_present_data.py の配置と同じ極座標：
#   中心 (500, 380)、半径 R=320、angle_deg は右方向=0°・時計回り、
#   y は 0.78 に潰す。radius_f は R に対する比。
# 区画と重なったときは、区画を動かさずに**会場だけ**を外へ押し出す（決定論）。
#
# badge = 地図上の丸の中に出す1文字。kind = 描き分け（区画は四角、会場は丸）。

meta:
  applies_to: configs/config_field_v5c.yaml (social.venues)
  decoration: true
  note: 表示位置は装飾。世界の同席・配送・判定には使わない。

